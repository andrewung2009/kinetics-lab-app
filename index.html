ep",blurb:"Order, molecularity and the rate-determining step"},{id:6,name:"Building mechanisms",blurb:"Proposing and checking a route"},{id:7,name:"Measuring rates I",blurb:"Initial-rate experiments and clocks"},{id:8,name:"Measuring rates II",blurb:"Sampling, colorimetry and other methods"},{id:9,name:"Arrhenius",blurb:"Activation energy from rate constants"},{id:10,name:"Catalysts",blurb:"Heterogeneous catalysis and autocatalysis"}],version:2},Vf=[{id:"l1-01",section:1,source:"Kinetics 1, p.1",difficulty:1,q:"The rate of reaction is the change in ______ of reactants or products per unit time.",answer:"concentration",distractors:["mass","volume","number of moles"],a:"The rate of reaction is the <b>change in concentration</b> of reactants or products per unit time."},{id:"l1-02",section:1,source:"Kinetics 1, p.1",difficulty:1,q:"Rate of reaction = ______ / &Delta;time.",answer:"&Delta;concentration",distractors:["&Delta;mass","&Delta;temperature","concentration &times; time"],a:"Rate = <b>&Delta;concentration / &Delta;time</b>."},{id:"l1-03",section:1,source:"Kinetics 1, p.1",difficulty:1,q:"The usual unit of rate of reaction is ______.",answer:"mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup>",distractors:["mol dm<sup>&minus;3</sup>","s<sup>&minus;1</sup>","dm<sup>3</sup> mol<sup>&minus;1</sup> s<sup>&minus;1</sup>"],a:"Rate is measured in <b>mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup></b>."},{id:"l1-04",section:1,source:"Kinetics 1, p.1",difficulty:1,q:"A minus sign is put in front of &Delta;[reactant]/&Delta;t because reactant concentration ______ with time.",answer:"decreases",distractors:["increases","stays constant","reaches equilibrium"],a:"Reactant concentration falls, so &Delta;[A] is negative; the minus sign makes the rate <b>positive</b>."},{id:"l1-05",section:1,source:"Kinetics 1, p.2",difficulty:2,q:"For A + 3B &rarr; 2D, rate = &minus;&Delta;[A]/&Delta;t = &minus;&Delta;[B]/______&Delta;t = &Delta;[D]/2&Delta;t.",answer:"3",distractors:["1","2","1/3"],a:"Each change in concentration is divided by its <b>stoichiometric coefficient</b>."},{id:"l1-06",section:1,source:"Kinetics 1, p.2",difficulty:2,q:"For 4NH<sub>3</sub> + 3O<sub>2</sub> &rarr; 2N<sub>2</sub> + 6H<sub>2</sub>O, N<sub>2</sub> forms at 0.27 mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup>. Water forms at ______ mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup>.",answer:"0.81",distractors:["0.54","0.27","1.62"],a:"Water: (6/2) &times; 0.27 = <b>0.81 mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup></b>."},{id:"l1-07",section:1,source:"Kinetics 1, p.2",difficulty:2,q:"For the same ammonia oxidation, ammonia is consumed at ______ mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup>.",answer:"0.54",distractors:["0.81","0.27","1.08"],a:"Ammonia: (4/2) &times; 0.27 = <b>0.54 mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup></b>."},{id:"l1-08",section:1,source:"Kinetics 1, p.1",difficulty:1,q:"For A + B &rarr; C, rate = &minus;&Delta;[A]/&Delta;t = &minus;&Delta;[B]/&Delta;t = ______.",answer:"&Delta;[C]/&Delta;t",distractors:["&minus;&Delta;[C]/&Delta;t","2&Delta;[C]/&Delta;t","&Delta;[A]/&Delta;t"],a:"The rate can be written using <b>&Delta;[C]/&Delta;t</b> because C is the product."},{id:"l1-09",section:1,source:"Kinetics 1, p.2",difficulty:2,q:"Dividing each concentration change by its coefficient makes the rate ______ whichever reactant or product is used.",answer:"the same",distractors:["different","negative","zero"],a:"This removes ambiguity: every component gives <b>the same rate</b>."},{id:"l1-10",section:1,source:"Kinetics 1, p.1",difficulty:1,q:"The rate of a reaction can be expressed using the change in concentration of ______ component.",answer:"any",distractors:["only the first","only the limiting","only the product"],a:"Use <b>any</b> reactant or product, as long as it is divided by its coefficient."},{id:"l2-01",section:2,source:"Kinetics 1, p.3",difficulty:1,q:"The general rate equation is rate = ______.",answer:"k[A]<sup>m</sup>[B]<sup>n</sup>",distractors:["k([A] + [B])","[A]<sup>m</sup>[B]<sup>n</sup> / k","k[A + B]<sup>m+n</sup>"],a:"rate = <b>k[A]<sup>m</sup>[B]<sup>n</sup></b>, where m and n are the orders."},{id:"l2-02",section:2,source:"Kinetics 1, p.3",difficulty:1,q:"The order with respect to A is the ______ to which [A] is raised in the rate equation.",answer:"power",distractors:["coefficient","concentration","volume"],a:"The order is the <b>power</b> of that concentration in the rate equation."},{id:"l2-03",section:2,source:"Kinetics 1, p.3",difficulty:2,q:"If a reaction is zero order with respect to A, changing [A] has ______ effect on the rate.",answer:"no",distractors:["a doubling","a halving","a proportional"],a:"Anything to the power zero is 1, so the <b>[A] term disappears</b>."},{id:"l2-04",section:2,source:"Kinetics 1, p.3",difficulty:1,q:"If a reaction is first order with respect to A, the rate is ______ proportional to [A].",answer:"directly",distractors:["inversely","not","exponentially"],a:"First order means rate &prop; [A], so the rate is <b>directly proportional</b>."},{id:"l2-05",section:2,source:"Kinetics 1, p.3",difficulty:2,q:"If a reaction is second order with respect to A, doubling [A] multiplies the rate by ______.",answer:"4",distractors:["2","3","8"],a:"2<sup>2</sup> = <b>4</b>."},{id:"l2-06",section:2,source:"Kinetics 1, p.3",difficulty:1,q:"The overall order is found by ______ the individual orders.",answer:"adding",distractors:["multiplying","averaging","subtracting"],a:"Overall order = <b>sum of the individual orders</b>."},{id:"l2-07",section:2,source:"Kinetics 1, p.3",difficulty:2,q:"In this specification orders are 0, 1 or 2, but ______ orders such as 1.53 are possible.",answer:"fractional",distractors:["negative","imaginary","whole-number"],a:"Orders can be <b>fractional</b>, although 0, 1 and 2 are the ones you meet here."},{id:"l2-08",section:2,source:"Kinetics 1, p.3",difficulty:2,q:"Orders and k can only be found by ______.",answer:"experiment",distractors:["balancing the equation","reading the coefficients","measuring the enthalpy change"],a:"They are <b>empirical</b> and cannot be deduced from the balanced equation."},{id:"l2-09",section:2,source:"Kinetics 1, p.4",difficulty:2,q:"k is the ______ constant linking rate to the concentrations.",answer:"proportionality",distractors:["equilibrium","solubility","dissociation"],a:"k is the <b>proportionality constant</b> in the rate equation."},{id:"l2-10",section:2,source:"Kinetics 1, p.4",difficulty:2,q:"k changes with temperature and surface area, but not with ______.",answer:"concentration",distractors:["temperature","surface area","catalyst"],a:"k is specific to a reaction at a temperature; it is <b>independent of concentration</b>."},{id:"l2-11",section:2,source:"Kinetics 1, p.4",difficulty:1,q:"A large value of k means the reaction is relatively ______.",answer:"fast",distractors:["slow","zero order","at equilibrium"],a:"Large k = <b>fast</b>; small k = slow."},{id:"l2-12",section:2,source:"Kinetics 1, p.6",difficulty:2,q:"For a first-order reaction, the units of k are ______.",answer:"s<sup>&minus;1</sup>",distractors:["mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup>","dm<sup>3</sup> mol<sup>&minus;1</sup> s<sup>&minus;1</sup>","dm<sup>6</sup> mol<sup>&minus;2</sup> s<sup>&minus;1</sup>"],a:"First order: k = rate/[A], so k has units <b>s<sup>&minus;1</sup></b>."},{id:"l2-13",section:2,source:"Kinetics 1, p.6",difficulty:2,q:"For a second-order reaction, the units of k are ______.",answer:"dm<sup>3</sup> mol<sup>&minus;1</sup> s<sup>&minus;1</sup>",distractors:["s<sup>&minus;1</sup>","mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup>","dm<sup>6</sup> mol<sup>&minus;2</sup> s<sup>&minus;1</sup>"],a:"Second order: k = rate/[A]<sup>2</sup>, giving <b>dm<sup>3</sup> mol<sup>&minus;1</sup> s<sup>&minus;1</sup></b>."},{id:"l2-14",section:2,source:"Kinetics 1, p.6",difficulty:2,q:"For a zero-order reaction, the units of k are ______.",answer:"mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup>",distractors:["s<sup>&minus;1</sup>","dm<sup>3</sup> mol<sup>&minus;1</sup> s<sup>&minus;1</sup>","dm<sup>6</sup> mol<sup>&minus;2</sup> s<sup>&minus;1</sup>"],a:"Zero order: rate = k, so k has the units of rate, <b>mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup></b>."},{id:"l3-01",section:3,source:"Kinetics 1, p.6",difficulty:1,q:"The half-life is the time for a reactant concentration to ______.",answer:"halve",distractors:["double","reach zero","reach equilibrium"],a:"Half-life is the time for the concentration to <b>decrease by half</b>."},{id:"l3-02",section:3,source:"Kinetics 1, p.8",difficulty:1,q:"A reaction with a constant half-life is ______ order.",answer:"first",distractors:["zero","second","third"],a:"A constant half-life means the reaction is <b>first order</b>."},{id:"l3-03",section:3,source:"Kinetics 1, p.8",difficulty:1,q:"For a first-order reaction, t<sub>1/2</sub> = ______.",answer:"ln 2 / k",distractors:["k / ln 2","2 / k","ln 2 &times; k"],a:"t<sub>1/2</sub> = ln 2 / k &asymp; <b>0.693 / k</b>."},{id:"l3-04",section:3,source:"Kinetics 1, p.7",difficulty:2,q:"For a zero-order reaction, the linear graph is ______ against time, and k = &minus;slope.",answer:"[A]",distractors:["ln[A]","1/[A]","rate"],a:"<b>[A] against time</b> is linear for zero order; k = &minus;slope."},{id:"l3-05",section:3,source:"Kinetics 1, p.7",difficulty:2,q:"For a first-order reaction, the linear graph is ______ against time, and k = &minus;slope.",answer:"ln[A]",distractors:["[A]","1/[A]","rate"],a:"<b>ln[A] against time</b> is linear for first order; k = &minus;slope."},{id:"l3-06",section:3,source:"Kinetics 1, p.7",difficulty:2,q:"For a second-order reaction, the linear graph is ______ against time, and k = slope.",answer:"1/[A]",distractors:["[A]","ln[A]","rate"],a:"<b>1/[A] against time</b> is linear for second order; k = slope."},{id:"l3-07",section:3,source:"Kinetics 1, p.6",difficulty:2,q:"To find order from concentration–time data, plot [A], ln[A] and ______ against time.",answer:"1/[A]",distractors:["[A]<sup>2</sup>","rate","log[A]"],a:"Whichever graph is linear gives the order."},{id:"l3-08",section:3,source:"Kinetics 1, p.7",difficulty:2,q:"For a zero-order reaction, a graph of rate against [A] is ______.",answer:"horizontal",distractors:["a straight line through the origin","an upward curve","a downward curve"],a:"Rate is independent of [A], so the line is <b>horizontal</b>."},{id:"l3-09",section:3,source:"Kinetics 1, p.10",difficulty:2,q:"For a first-order reaction, a graph of rate against [A] is ______.",answer:"a straight line through the origin",distractors:["horizontal","an upward curve","a straight line with a positive intercept"],a:"First order: rate = k[A], so the graph is a <b>straight line through the origin</b>."},{id:"l3-10",section:3,source:"Kinetics 1, p.9",difficulty:3,q:"A first-order reaction has t<sub>1/2</sub> = 10 min. k = ______ s<sup>&minus;1</sup>.",answer:"1.15 &times; 10<sup>&minus;3</sup>",distractors:["6.93 &times; 10<sup>&minus;3</sup>","1.15 &times; 10<sup>&minus;3</sup> min<sup>&minus;1</sup>","1.44 &times; 10<sup>&minus;3</sup>"],a:"10 min = 600 s; k = 0.693 / 600 = <b>1.15 &times; 10<sup>&minus;3</sup> s<sup>&minus;1</sup></b>."},{id:"l3-11",section:3,source:"Kinetics 1, p.9",difficulty:3,q:"3.0 g of A decomposes to 0.375 g in 36 min. If the reaction is first order, t<sub>1/2</sub> = ______ min.",answer:"12",distractors:["18","9","36"],a:"3.0 &rarr; 1.5 &rarr; 0.75 &rarr; 0.375 is three half-lives; 36 / 3 = <b>12 min</b>."},{id:"l3-12",section:3,source:"Kinetics 1, p.11",difficulty:3,q:"Benzenediazonium chloride gives 80 cm<sup>3</sup> of N<sub>2</sub> in total; 40 cm<sup>3</sup> evolves in 40 min. 70 cm<sup>3</sup> evolves after ______ min.",answer:"120",distractors:["80","160","100"],a:"t<sub>1/2</sub> = 40 min. 70 cm<sup>3</sup> evolved leaves 10 cm<sup>3</sup> = 80/8, three half-lives: 3 &times; 40 = <b>120 min</b>."},{id:"l3-13",section:3,source:"Kinetics 1, p.11",difficulty:3,q:"For first-order N<sub>2</sub>O<sub>5</sub>, rate = 2.10 &times; 10<sup>&minus;5</sup> and [N<sub>2</sub>O<sub>5</sub>] = 2.00. k = ______ s<sup>&minus;1</sup>.",answer:"1.05 &times; 10<sup>&minus;5</sup>",distractors:["4.20 &times; 10<sup>&minus;5</sup>","2.10 &times; 10<sup>&minus;5</sup>","1.05 &times; 10<sup>&minus;5</sup> mol dm<sup>&minus;3</sup>"],a:"k = rate/[N<sub>2</sub>O<sub>5</sub>] = 2.10 &times; 10<sup>&minus;5</sup> / 2.00 = <b>1.05 &times; 10<sup>&minus;5</sup> s<sup>&minus;1</sup></b>."},{id:"l4-01",section:4,source:"Kinetics 2, p.1",difficulty:2,q:"The initial-rate method finds orders by varying one concentration at a time and measuring the ______ rate.",answer:"initial",distractors:["final","average","maximum"],a:"Use the <b>initial rate</b>, measured at the very start of the reaction."},{id:"l4-02",section:4,source:"Kinetics 2, p.1",difficulty:2,q:"In initial-rate experiments, all other concentrations, the total volume and the ______ are kept constant.",answer:"temperature",distractors:["pressure","catalyst mass","colour"],a:"Change one variable at a time while keeping <b>temperature</b>, volume and other concentrations constant."},{id:"l4-03",section:4,source:"Kinetics 2, p.1",difficulty:2,q:"If doubling [X] doubles the rate, the order with respect to X is ______.",answer:"1",distractors:["0","2","3"],a:"Double concentration &rarr; double rate = <b>first order</b>."},{id:"l4-04",section:4,source:"Kinetics 2, p.1",difficulty:2,q:"If doubling [X] quadruples the rate, the order with respect to X is ______.",answer:"2",distractors:["0","1","3"],a:"Double concentration &rarr; four times the rate = <b>second order</b>."},{id:"l4-05",section:4,source:"Kinetics 2, p.1",difficulty:2,q:"If changing [X] has no effect on the rate, the order with respect to X is ______.",answer:"0",distractors:["1","2","3"],a:"No change in rate = <b>zero order</b>."},{id:"l4-06",section:4,source:"Kinetics 2, p.1",difficulty:3,q:"NO/H<sub>2</sub> data: halving [H<sub>2</sub>] halves the rate. The order in H<sub>2</sub> is ______.",answer:"1",distractors:["0","2","1.5"],a:"Halving the concentration halves the rate, so the reaction is <b>first order in H<sub>2</sub></b>."},{id:"l4-07",section:4,source:"Kinetics 2, p.1",difficulty:3,q:"NO/H<sub>2</sub> data: halving [NO] quarters the rate. The order in NO is ______.",answer:"2",distractors:["0","1","0.5"],a:"Halving the concentration quarters the rate, so the reaction is <b>second order in NO</b>."},{id:"l4-08",section:4,source:"Kinetics 2, p.1",difficulty:3,q:"The rate equation for the NO/H<sub>2</sub> reaction is rate = ______.",answer:"k[H<sub>2</sub>][NO]<sup>2</sup>",distractors:["k[H<sub>2</sub>]<sup>2</sup>[NO]","k[H<sub>2</sub>][NO]","k[NO]<sup>2</sup>"],a:"First order in H<sub>2</sub>, second order in NO: rate = <b>k[H<sub>2</sub>][NO]<sup>2</sup></b>."},{id:"l4-09",section:4,source:"Kinetics 2, p.1",difficulty:3,q:"For rate = k[H<sub>2</sub>][NO]<sup>2</sup>, with [H<sub>2</sub>] = 0.010, [NO] = 0.025 and rate = 2.4 &times; 10<sup>&minus;6</sup>, k = ______ dm<sup>6</sup> mol<sup>&minus;2</sup> s<sup>&minus;1</sup>.",answer:"0.384",distractors:["15.4","0.0096","38.4"],a:"k = 2.4 &times; 10<sup>&minus;6</sup> / (0.010 &times; 0.025<sup>2</sup>) = <b>0.384</b>."},{id:"l4-10",section:4,source:"Kinetics 2, p.1",difficulty:3,q:"A + 3B data: doubling [A] while [B] is constant doubles the rate. The order in A is ______.",answer:"1",distractors:["0","2","3"],a:"Doubling [A] doubles the rate, so A is <b>first order</b>."},{id:"l4-11",section:4,source:"Kinetics 2, p.1",difficulty:3,q:"A + 3B data: doubling [B] multiplies the rate by about 4. The order in B is ______.",answer:"2",distractors:["0","1","3"],a:"Doubling [B] quadruples the rate, so B is <b>second order</b>."},{id:"l4-12",section:4,source:"Kinetics 2, p.2",difficulty:3,q:"For A + 3B &rarr; AB<sub>3</sub>, the rate equation is rate = ______.",answer:"k[A][B]<sup>2</sup>",distractors:["k[A]<sup>2</sup>[B]","k[A][B]<sup>3</sup>","k[A][B]"],a:"First order in A, second order in B: rate = <b>k[A][B]<sup>2</sup></b>."},{id:"l4-13",section:4,source:"Kinetics 2, p.4",difficulty:3,q:"For H<sub>2</sub> + I<sub>2</sub> &rarr; 2HI, rate = k[H<sub>2</sub>][I<sub>2</sub>] and k = 8.58 &times; 10<sup>&minus;5</sup>. With [H<sub>2</sub>] = 0.010 and [I<sub>2</sub>] = 0.050, rate = ______ mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup>.",answer:"4.29 &times; 10<sup>&minus;8</sup>",distractors:["4.29 &times; 10<sup>&minus;6</sup>","8.58 &times; 10<sup>&minus;8</sup>","1.72 &times; 10<sup>&minus;7</sup>"],a:"rate = 8.58 &times; 10<sup>&minus;5</sup> &times; 0.010 &times; 0.050 = <b>4.29 &times; 10<sup>&minus;8</sup> mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup></b>."},{id:"l4-14",section:4,source:"Kinetics 2, p.3",difficulty:2,q:"In the propanone/iodine experiment, excess NaHCO<sub>3</sub> is added to ______ the reaction before titration.",answer:"stop",distractors:["speed up","catalyse","colour"],a:"NaHCO<sub>3</sub> neutralises the acid catalyst, <b>stopping</b> the reaction at that moment."},{id:"l4-15",section:4,source:"Kinetics 2, p.3",difficulty:2,q:"In the propanone/iodine experiment, the titre falls at a constant rate. The reaction is ______ order with respect to iodine.",answer:"zero",distractors:["first","second","third"],a:"The rate does not depend on [I<sub>2</sub>], so it is <b>zero order</b> in iodine."},{id:"l4-16",section:4,source:"Kinetics 2, p.4",difficulty:3,q:"Without the acid catalyst, the propanone/iodine reaction is much ______.",answer:"slower",distractors:["faster","unchanged","zero order"],a:"The acid provides an alternative route with a <b>lower activation energy</b>, so without it the reaction is much slower."},{id:"l5-01",section:5,source:"Kinetics 3, p.1",difficulty:1,q:"A reaction mechanism describes the ______ involved in a reaction and how bonds are broken and made.",answer:"steps",distractors:["products","catalysts","orders"],a:"A mechanism describes the <b>steps</b> and the bond changes in each one."},{id:"l5-02",section:5,source:"Kinetics 3, p.2",difficulty:1,q:"The rate-determining step is the ______ step in a multi-step mechanism.",answer:"slowest",distractors:["fastest","first","last"],a:"The slowest step is the <b>rate-determining step</b>."},{id:"l5-03",section:5,source:"Kinetics 3, p.2",difficulty:1,q:"The overall rate of a reaction is controlled by the ______ step.",answer:"slowest",distractors:["fastest","first","final"],a:"The slow step acts as the bottleneck and controls the <b>overall rate</b>."},{id:"l5-04",section:5,source:"Kinetics 3, p.3",difficulty:2,q:"In a simple mechanism where the slow step is first, the rate equation shows the species in the ______ step.",answer:"rate-determining",distractors:["fastest","final","equilibrium"],a:"The orders tell you which species collide in the <b>rate-determining step</b>."},{id:"l5-05",section:5,source:"Kinetics 3, p.1",difficulty:2,q:"For 2-bromo-2-methylpropane + OH<sup>&minus;</sup>, the slow step is the breaking of the C–Br bond to form a ______.",answer:"carbocation",distractors:["carbanion","radical","alkene"],a:"The C–Br bond breaks slowly to form a <b>carbocation</b>, which OH<sup>&minus;</sup> then attacks quickly."},{id:"l5-06",section:5,source:"Kinetics 3, p.3",difficulty:2,q:"In the SN1 mechanism, OH<sup>&minus;</sup> attacks in the fast step, so the reaction is ______ order in OH<sup>&minus;</sup>.",answer:"zero",distractors:["first","second","third"],a:"OH<sup>&minus;</sup> is not in the slow step, so the reaction is <b>zero order</b> in OH<sup>&minus;</sup>."},{id:"l5-07",section:5,source:"Kinetics 3, p.3",difficulty:2,q:"For the SN1 reaction, the rate equation is rate = k[______].",answer:"organic compound",distractors:["OH<sup>&minus;</sup>","organic compound][OH<sup>&minus;</sup>","H<sub>2</sub>O"],a:"Only the organic compound is in the slow step: rate = <b>k[organic compound]</b>."},{id:"l5-08",section:5,source:"Kinetics 3, p.3",difficulty:2,q:"In the SN2 reaction, the organic compound and OH<sup>&minus;</sup> react in ______ step, so rate = k[organic][OH<sup>&minus;</sup>].",answer:"one",distractors:["two","three","the slow"],a:"SN2 is a single step, so it is <b>first order in both</b> reactants."},{id:"l5-09",section:5,source:"Kinetics 3, p.4",difficulty:2,q:"The molecularity of a step is the number of ______ taking part in that step.",answer:"species",distractors:["orders","products","catalysts"],a:"Molecularity counts the <b>species</b> in one step."},{id:"l5-10",section:5,source:"Kinetics 3, p.4",difficulty:2,q:"Unlike order, molecularity is found from the ______.",answer:"mechanism",distractors:["experiment","rate equation","balanced equation"],a:"Molecularity comes from the <b>mechanism</b>; order comes from experiment."},{id:"l5-11",section:5,source:"Kinetics 3, p.5",difficulty:2,q:"A step involving one species breaking into ions is ______.",answer:"unimolecular",distractors:["bimolecular","termolecular","zero order"],a:"One species in the step = <b>unimolecular</b>."},{id:"l5-12",section:5,source:"Kinetics 3, p.5",difficulty:2,q:"A step involving two ions reacting together is ______.",answer:"bimolecular",distractors:["unimolecular","termolecular","first order"],a:"Two species in the step = <b>bimolecular</b>."},{id:"l6-01",section:6,source:"Kinetics 2, p.5",difficulty:2,q:"The first step in proposing a mechanism from a rate equation is to decide the species in the ______ step.",answer:"rate-determining",distractors:["fastest","final","first fast"],a:"Start with the species shown by the rate equation in the <b>rate-determining step</b>."},{id:"l6-02",section:6,source:"Kinetics 2, p.5",difficulty:2,q:"After choosing the slow-step species, suggest possible ______ for that step.",answer:"products",distractors:["catalysts","orders","units"],a:"The products may include species that are not in the overall equation."},{id:"l6-03",section:6,source:"Kinetics 2, p.6",difficulty:2,q:"Then compare the slow step with the ______ equation to see what is still to be accounted for.",answer:"stoichiometric",distractors:["rate","ionic","half"],a:"Compare with the <b>stoichiometric</b> equation to find missing species."},{id:"l6-04",section:6,source:"Kinetics 2, p.6",difficulty:2,q:"Finally add the steps, cancel intermediates and check they sum to the ______ equation.",answer:"overall",distractors:["rate","half","ionic"],a:"The steps must add up to the <b>overall</b> equation."},{id:"l6-05",section:6,source:"Kinetics 2, p.5",difficulty:3,q:"For 2ICl + H<sub>2</sub> &rarr; 2HCl + I<sub>2</sub>, rate = k[ICl][H<sub>2</sub>]. The slow step is ______.",answer:"ICl + H<sub>2</sub> &rarr; HCl + HI",distractors:["ICl + ICl &rarr; I<sub>2</sub> + Cl<sub>2</sub>","H<sub>2</sub> &rarr; 2H","HI + HI &rarr; H<sub>2</sub> + I<sub>2</sub>"],a:"One ICl and one H<sub>2</sub> in the slow step gives the observed rate equation."},{id:"l6-06",section:6,source:"Kinetics 2, p.6",difficulty:3,q:"The fast second step of the ICl/H<sub>2</sub> mechanism is ______.",answer:"ICl + HI &rarr; HCl + I<sub>2</sub>",distractors:["ICl + H<sub>2</sub> &rarr; HCl + HI","H<sub>2</sub> + I<sub>2</sub> &rarr; 2HI","HCl + HI &rarr; H<sub>2</sub> + ICl"],a:"The fast step uses the HI intermediate: <b>ICl + HI &rarr; HCl + I<sub>2</sub></b>."},{id:"l6-07",section:6,source:"Kinetics 2, p.7",difficulty:3,q:"Mechanism: ICl + ICl &rarr; I<sub>2</sub> + Cl<sub>2</sub> (slow), then Cl<sub>2</sub> + H<sub>2</sub> &rarr; 2HCl. The fault is that the slow step would make the reaction ______ order in H<sub>2</sub>.",answer:"zero",distractors:["first","second","third"],a:"The slow step contains no H<sub>2</sub>, so it would be <b>zero order</b> in H<sub>2</sub>; the experimental rate is first order in H<sub>2</sub>."},{id:"l6-08",section:6,source:"Kinetics 2, p.7",difficulty:3,q:"Mechanism: ICl &rarr; I• + Cl• (slow). This would make the rate ______ of [H<sub>2</sub>].",answer:"independent",distractors:["first order","second order","proportional"],a:"It would give rate = k[ICl], but the experimental rate is <b>k[ICl][H<sub>2</sub>]</b>."},{id:"l6-09",section:6,source:"Kinetics 2, p.7",difficulty:3,q:"For first-order 2N<sub>2</sub>O<sub>5</sub> &rarr; 4NO<sub>2</sub> + O<sub>2</sub>, a possible slow step is ______.",answer:"N<sub>2</sub>O<sub>5</sub> &rarr; NO<sub>2</sub> + NO<sub>3</sub>",distractors:["2N<sub>2</sub>O<sub>5</sub> &rarr; products","N<sub>2</sub>O<sub>5</sub> + N<sub>2</sub>O<sub>5</sub> &rarr; products","O<sub>2</sub> &rarr; 2O"],a:"One N<sub>2</sub>O<sub>5</sub> in the slow step gives <b>first order</b>."},{id:"l6-10",section:6,source:"Kinetics 2, p.7",difficulty:3,q:"For A + 3B &rarr; AB<sub>3</sub> with rate = k[A][B]<sup>2</sup>, the slow step should contain ______.",answer:"A + 2B",distractors:["A + B","A + 3B","3B"],a:"The orders show one A and two B in the slow step: <b>A + 2B</b>."},{id:"l6-11",section:6,source:"Kinetics 2, p.7",difficulty:3,q:"For 2H<sub>2</sub> + 2NO &rarr; 2H<sub>2</sub>O + N<sub>2</sub> with rate = k[H<sub>2</sub>][NO]<sup>2</sup>, the slow step contains ______.",answer:"H<sub>2</sub> + 2NO",distractors:["H<sub>2</sub> + NO","2NO","2H<sub>2</sub> + 2NO"],a:"One H<sub>2</sub> and two NO in the slow step gives <b>k[H<sub>2</sub>][NO]<sup>2</sup></b>."},{id:"l6-12",section:6,source:"Kinetics 4, p.1",difficulty:3,q:"NO<sub>2</sub> + CO &rarr; NO + CO<sub>2</sub> is second order in NO<sub>2</sub> and zero order in CO. The slow step is ______.",answer:"NO<sub>2</sub> + NO<sub>2</sub>",distractors:["NO<sub>2</sub> + CO","CO + CO","NO<sub>2</sub> + NO"],a:"Two NO<sub>2</sub> collide in the slow step, so CO enters in a later fast step."},{id:"l6-13",section:6,source:"Kinetics 4, p.2",difficulty:3,q:"The fast step in the NO<sub>2</sub>/CO mechanism is ______.",answer:"NO<sub>3</sub> + CO &rarr; NO<sub>2</sub> + CO<sub>2</sub>",distractors:["NO<sub>2</sub> + NO<sub>2</sub> &rarr; NO + NO<sub>3</sub>","NO + CO &rarr; NO<sub>2</sub> + CO<sub>2</sub>","NO<sub>2</sub> + CO &rarr; NO<sub>3</sub> + CO<sub>2</sub>"],a:"After the slow step, NO<sub>3</sub> reacts quickly with CO: <b>NO<sub>3</sub> + CO &rarr; NO<sub>2</sub> + CO<sub>2</sub></b>."},{id:"l6-14",section:6,source:"Kinetics 4, p.2",difficulty:3,q:"For 2NO + O<sub>2</sub> &rarr; 2NO<sub>2</sub>, the fast first step is 2NO &harr; N<sub>2</sub>O<sub>2</sub>, then N<sub>2</sub>O<sub>2</sub> + O<sub>2</sub> is slow. The rate law is rate = ______.",answer:"k[NO]<sup>2</sup>[O<sub>2</sub>]",distractors:["k[N<sub>2</sub>O<sub>2</sub>][O<sub>2</sub>]","k[NO][O<sub>2</sub>]","k[NO]<sup>2</sup>"],a:"Substitute the intermediate: [N<sub>2</sub>O<sub>2</sub>] &prop; [NO]<sup>2</sup>, giving <b>k[NO]<sup>2</sup>[O<sub>2</sub>]</b>."},{id:"l6-15",section:6,source:"Kinetics 4, p.2",difficulty:3,q:"A rate law cannot contain a reaction ______ because it is not observable.",answer:"intermediate",distractors:["catalyst","product","reactant"],a:"Replace the intermediate using the fast equilibrium so the rate law contains only reactants."},{id:"l7-01",section:7,source:"Kinetics 5, p.1",difficulty:2,q:"A reaction that produces a gas can be followed by measuring the ______.",answer:"volume of gas evolved",distractors:["colorimetry","titration","pH measurement"],a:"Collect the gas in a syringe or measuring cylinder and record the <b>volume evolved</b>."},{id:"l7-02",section:7,source:"Kinetics 5, p.12",difficulty:2,q:"A reaction involving a coloured substance can be followed using ______.",answer:"colorimetry",distractors:["mass change","gas volume","dilatometry"],a:"A colorimeter measures the <b>absorbance</b> of the coloured substance."},{id:"l7-03",section:7,source:"Kinetics 5, p.1",difficulty:2,q:"In a simple initial-rate experiment, measure the ______ taken for a small fixed change to happen.",answer:"time",distractors:["mass","volume","temperature"],a:"Time how long a fixed event takes, then repeat with a different concentration."},{id:"l7-04",section:7,source:"Kinetics 5, p.3",difficulty:2,q:"If the amount of gas is not measured, ______ can be used as a measure of initial rate.",answer:"1/t",distractors:["t","t<sup>2</sup>","log t"],a:"Rate is inversely proportional to time, so use <b>1/t</b>."},{id:"l7-05",section:7,source:"Kinetics 5, p.3",difficulty:2,q:"A graph of 1/t against concentration is a straight line for a ______ order reaction.",answer:"first",distractors:["zero","second","third"],a:"First order: rate &prop; concentration, so <b>1/t</b> against concentration is linear."},{id:"l7-06",section:7,source:"Kinetics 5, p.4",difficulty:3,q:"For rate = k[A]<sup>n</sup>, a graph of log(rate) against log[A] has gradient ______.",answer:"n",distractors:["k","log k","1/n"],a:"log(rate) = log k + <b>n</b> log[A], so the gradient is the order."},{id:"l7-07",section:7,source:"Kinetics 5, p.5",difficulty:2,q:"In the H<sub>2</sub>O<sub>2</sub> decomposition experiment, the weighing bottle keeps the catalyst separate to avoid ______ at the start.",answer:"gas loss",distractors:["cooling","dilution","colour change"],a:"Adding the catalyst inside the sealed flask avoids <b>losing gas</b> while the bung is fitted."},{id:"l7-08",section:7,source:"Kinetics 5, p.6",difficulty:2,q:"In the thiosulphate–acid reaction, the rate is measured by the time for the ______ to disappear.",answer:"cross",distractors:["colour","precipitate","gas syringe"],a:"A cross on paper under the flask disappears as sulphur precipitates: time the <b>cross</b>."},{id:"l7-09",section:7,source:"Kinetics 5, p.7",difficulty:2,q:"When changing thiosulphate concentration, each sample is made up to the same total volume with ______.",answer:"water",distractors:["acid","thiosulphate","indicator"],a:"Top up with <b>water</b> so only the thiosulphate concentration changes."},{id:"l7-10",section:7,source:"Kinetics 5, p.8",difficulty:2,q:"In the iodine clock, starch turns the mixture ______ when the thiosulphate is used up.",answer:"blue",distractors:["yellow","colourless","red"],a:"The first excess iodine reacts with starch and turns the mixture <b>blue</b>."},{id:"l7-11",section:7,source:"Kinetics 5, p.8",difficulty:2,q:"The small amount of thiosulphate delays the blue colour by reacting with the ______ first.",answer:"iodine",distractors:["starch","acid","peroxide"],a:"Thiosulphate removes the <b>iodine</b> until it is used up, then starch turns blue."},{id:"l8-01",section:8,source:"Kinetics 5, p.9",difficulty:2,q:"In the sampling method, small portions are removed at intervals and ______ to find the concentration.",answer:"titrated",distractors:["weighed","filtered","distilled"],a:"Samples are <b>titrated</b> to measure how much reactant remains."},{id:"l8-02",section:8,source:"Kinetics 5, p.9",difficulty:2,q:"For bromoethane + NaOH, adding the sample to excess acid ______ the reaction.",answer:"stops",distractors:["speeds up","catalyses","dilutes"],a:"Excess acid uses up the NaOH and <b>stops</b> the reaction."},{id:"l8-03",section:8,source:"Kinetics 5, p.9",difficulty:3,q:"After quenching with excess acid, the leftover acid is found by titration with ______.",answer:"sodium hydroxide",distractors:["hydrochloric acid","thiosulphate","iodine"],a:"Back-titrate the excess acid with <b>sodium hydroxide</b>."},{id:"l8-04",section:8,source:"Kinetics 5, p.9",difficulty:2,q:"Cooling and diluting a sample before titration ______ the reaction.",answer:"slows",distractors:["stops","speeds up","catalyses"],a:"Cooling and diluting <b>slows</b> the reaction while you titrate."},{id:"l8-05",section:8,source:"Kinetics 5, p.12",difficulty:2,q:"In colorimetry, choose a filter that the sample ______.",answer:"absorbs",distractors:["reflects","emits","transmits"],a:"Use the colour the sample <b>absorbs</b>; copper(II) sulphate absorbs red light."},{id:"l8-06",section:8,source:"Kinetics 5, p.12",difficulty:2,q:"A colorimeter calibration curve plots absorbance against ______.",answer:"concentration",distractors:["time","temperature","volume"],a:"The calibration curve converts absorbance into <b>concentration</b>."},{id:"l8-07",section:8,source:"Kinetics 5, p.12",difficulty:2,q:"The propanone/iodine mixture fades from brown to ______ as iodine is used up.",answer:"colourless",distractors:["blue","green","white"],a:"Iodine is brown; as it is used up the mixture fades to <b>colourless</b>."},{id:"l8-08",section:8,source:"Kinetics 5, p.13",difficulty:2,q:"pH is poor when the hydrogen ion concentration changes only ______.",answer:"slightly",distractors:["greatly","linearly","to zero"],a:"A small change in [H<sup>+</sup>] gives only a small pH change, so pH is not sensitive enough."},{id:"l8-09",section:8,source:"Kinetics 5, p.13",difficulty:2,q:"As H<sup>+</sup> and I<sup>&minus;</sup> are used up, the conductivity of the mixture ______.",answer:"falls",distractors:["rises","stays constant","halves"],a:"Fewer ions means lower conductivity, so it <b>falls</b>."},{id:"l8-10",section:8,source:"Kinetics 5, p.13",difficulty:2,q:"Dilatometry measures the change in ______ of the reaction mixture with time.",answer:"volume",distractors:["mass","colour","pH"],a:"Dilatometry follows the change in <b>volume</b>."},{id:"l8-11",section:8,source:"Kinetics 5, p.13",difficulty:2,q:"Polarimetry measures the change in ______ of plane-polarised light.",answer:"rotation",distractors:["colour","intensity","wavelength"],a:"Polarimetry follows the change in <b>rotation</b> for optically active compounds."},{id:"l9-01",section:9,source:"Kinetics 5, p.15",difficulty:1,q:"The Arrhenius equation is k = ______.",answer:"Ae<sup>&minus;Ea/RT</sup>",distractors:["Ae<sup>Ea/RT</sup>","Ea e<sup>&minus;A/RT</sup>","A + e<sup>&minus;Ea/RT</sup>"],a:"k = <b>Ae<sup>&minus;Ea/RT</sup></b>."},{id:"l9-02",section:9,source:"Kinetics 5, p.15",difficulty:2,q:"In the Arrhenius equation, A is the ______ factor.",answer:"pre-exponential",distractors:["equilibrium","activation","rate"],a:"A is the <b>pre-exponential</b> (frequency) factor."},{id:"l9-03",section:9,source:"Kinetics 5, p.15",difficulty:1,q:"Ea is the minimum ______ required for a reaction to take place.",answer:"energy",distractors:["concentration","temperature","volume"],a:"Ea is the <b>activation energy</b>."},{id:"l9-04",section:9,source:"Kinetics 5, p.16",difficulty:2,q:"Taking natural logs of the Arrhenius equation gives ln k = ______.",answer:"ln A &minus; Ea/RT",distractors:["ln A + Ea/RT","Ea/RT &minus; ln A","ln A &times; Ea/RT"],a:"ln k = <b>ln A &minus; Ea/RT</b>."},{id:"l9-05",section:9,source:"Kinetics 5, p.16",difficulty:2,q:"A graph of ln k against 1/T has gradient ______.",answer:"&minus;Ea/R",distractors:["Ea/R","&minus;R/Ea","ln A"],a:"Gradient = <b>&minus;Ea/R</b>."},{id:"l9-06",section:9,source:"Kinetics 5, p.16",difficulty:2,q:"The intercept of the ln k against 1/T graph is ______.",answer:"ln A",distractors:["A","&minus;Ea/R","Ea"],a:"Extrapolate to the y-axis: intercept = <b>ln A</b>."},{id:"l9-07",section:9,source:"Kinetics 5, p.16",difficulty:2,q:"When temperature increases, the term e<sup>&minus;Ea/RT</sup> gets ______.",answer:"bigger",distractors:["smaller","zero","negative"],a:"Ea/RT gets smaller, so e<sup>&minus;Ea/RT</sup> gets <b>bigger</b> and k increases."},{id:"l9-08",section:9,source:"Kinetics 5, p.17",difficulty:3,q:"A = 0.3, Ea = 50 kJ mol<sup>&minus;1</sup>, T = 300 K. k is about ______.",answer:"5.90 &times; 10<sup>&minus;10</sup>",distractors:["1.97 &times; 10<sup>&minus;9</sup>","20.05","0.3"],a:"Ea/RT = 20.05; e<sup>&minus;20.05</sup> = 1.97 &times; 10<sup>&minus;9</sup>; k = 0.3 &times; 1.97 &times; 10<sup>&minus;9</sup> = <b>5.90 &times; 10<sup>&minus;10</sup></b>."},{id:"l9-09",section:9,source:"Kinetics 5, p.18",difficulty:3,q:"Using rates at two temperatures gives Ea = 432 ______.",answer:"kJ mol<sup>&minus;1</sup>",distractors:["J mol<sup>&minus;1</sup>","kJ K<sup>&minus;1</sup>","mol dm<sup>&minus;3</sup>"],a:"The worked example gives Ea = <b>432 kJ mol<sup>&minus;1</sup></b>."},{id:"l9-10",section:9,source:"Kinetics 5, p.16",difficulty:2,q:"The two-temperature Arrhenius method is less reliable because it uses only ______ values of k.",answer:"two",distractors:["three","four","ten"],a:"Only <b>two</b> values introduce large errors; a full graph is better."},{id:"l10-01",section:10,source:"Kinetics 5, p.19",difficulty:1,q:"A heterogeneous catalyst is in a ______ phase from the reactants.",answer:"different",distractors:["same","liquid","gas"],a:"Heterogeneous = <b>different phase</b>, usually a solid catalyst with gaseous or liquid reactants."},{id:"l10-02",section:10,source:"Kinetics 5, p.19",difficulty:1,q:"A homogeneous catalyst is in the ______ phase as the reactants.",answer:"same",distractors:["different","solid","aqueous"],a:"Homogeneous = <b>same phase</b> as the reactants."},{id:"l10-03",section:10,source:"Kinetics 5, p.19",difficulty:2,q:"In heterogeneous catalysis, reactants ______ onto the catalyst surface.",answer:"adsorb",distractors:["absorb","desorb","dissolve"],a:"Reactants <b>adsorb</b> (stick) onto the surface."},{id:"l10-04",section:10,source:"Kinetics 5, p.19",difficulty:2,q:"An ______ is a part of the catalyst surface that is especially good at adsorbing reactants.",answer:"active site",distractors:["intermediate","catalyst","product"],a:"Reactions happen at <b>active sites</b>."},{id:"l10-05",section:10,source:"Kinetics 5, p.19",difficulty:2,q:"The final stage of heterogeneous catalysis is ______ of the products.",answer:"desorption",distractors:["adsorption","absorption","diffusion"],a:"Products break away by <b>desorption</b>, freeing the active site."},{id:"l10-06",section:10,source:"Kinetics 5, p.19",difficulty:2,q:"A good catalyst adsorbs reactants strongly enough to activate them, but not so strongly that products cannot ______.",answer:"desorb",distractors:["adsorb","dissolve","melt"],a:"Products must be able to <b>desorb</b>."},{id:"l10-07",section:10,source:"Kinetics 5, p.20",difficulty:2,q:"Silver is a poor catalyst because it adsorbs reactants too ______.",answer:"weakly",distractors:["strongly","quickly","slowly"],a:"<b>Silver</b> adsorbs too weakly to activate the reactants."},{id:"l10-08",section:10,source:"Kinetics 5, p.20",difficulty:2,q:"Tungsten is a poor catalyst because it adsorbs reactants too ______.",answer:"strongly",distractors:["weakly","quickly","slowly"],a:"<b>Tungsten</b> adsorbs too strongly, so products cannot leave."},{id:"l10-09",section:10,source:"Kinetics 5, p.20",difficulty:2,q:"Ethene + H<sub>2</sub> &rarr; ethane is catalysed by ______.",answer:"nickel",distractors:["silver","tungsten","iron"],a:"<b>Nickel</b> catalyses the hydrogenation; the same reaction hardens vegetable oil to make margarine."},{id:"l10-10",section:10,source:"Kinetics 5, p.21",difficulty:2,q:"In autocatalysis, the reaction is catalysed by one of its ______.",answer:"products",distractors:["reactants","intermediates","catalysts"],a:"A <b>product</b> catalyses the reaction, so the rate increases as it forms."},{id:"l10-11",section:10,source:"Kinetics 5, p.21",difficulty:2,q:"The oxidation of ethanedioic acid by MnO<sub>4</sub><sup>&minus;</sup> is catalysed by ______ ions.",answer:"Mn<sup>2+</sup>",distractors:["Mn<sup>7+</sup>","H<sup>+</sup>","Fe<sup>2+</sup>"],a:"The reaction is catalysed by <b>Mn<sup>2+</sup></b>, which is produced as the reaction proceeds."},{id:"l10-12",section:10,source:"Kinetics 5, p.22",difficulty:2,q:"An autocatalytic reaction starts slow, then ______ as catalyst is formed.",answer:"speeds up",distractors:["slows down","stops","stays constant"],a:"More catalyst is formed, so the reaction <b>speeds up</b> before finally slowing as reactants run out."},{id:"l10-13",section:10,source:"Kinetics 5, p.22",difficulty:3,q:"An S-shaped rate curve does not always prove autocatalysis; it could be caused by a surface coating or an ______ reaction.",answer:"exothermic",distractors:["endothermic","equilibrium","zero-order"],a:"A strongly <b>exothermic</b> reaction can heat up and speed up, producing a similar curve."}],Wf={meta:Bf,cards:Vf},
