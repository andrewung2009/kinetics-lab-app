"Orders, k and units",topic:"Kinetics"},{id:3,name:"Kinetics 3 · Graphs & half-life",blurb:"Turning graphs into orders and k",topic:"Kinetics"},{id:4,name:"Kinetics 4 · Initial-rate method",blurb:"Deducing orders from experiments",topic:"Kinetics"},{id:5,name:"Kinetics 5 · Mechanisms & the slow step",blurb:"Order, molecularity and the rate-determining step",topic:"Kinetics"},{id:6,name:"Kinetics 6 · Building mechanisms",blurb:"Proposing and checking a route",topic:"Kinetics"},{id:7,name:"Kinetics 7 · Measuring rates I",blurb:"Initial-rate experiments and clocks",topic:"Kinetics"},{id:8,name:"Kinetics 8 · Measuring rates II",blurb:"Sampling, colorimetry and other methods",topic:"Kinetics"},{id:9,name:"Kinetics 9 · Arrhenius",blurb:"Activation energy from rate constants",topic:"Kinetics"},{id:10,name:"Kinetics 10 · Catalysts",blurb:"Heterogeneous catalysis and autocatalysis",topic:"Kinetics"},{id:11,name:"Acid–base I · Protons & pH",blurb:"Brønsted–Lowry theory, pH, Kw and strong acids/bases",topic:"Acid-base"},{id:12,name:"Acid–base II · Weak acids & Ka",blurb:"Ka, pKa, assumptions, calculations and Core practical 11",topic:"Acid-base"},{id:13,name:"Acid–base III · Buffers",blurb:"How buffers work, buffer pH and buffer calculations",topic:"Acid-base"},{id:14,name:"Acid–base IV · Salts & indicators",blurb:"Hydrolysis of salts and choosing an indicator",topic:"Acid-base"},{id:15,name:"Acid–base V · Titration curves",blurb:"All curve combinations, diprotic acids and half-neutralisation",topic:"Acid-base"},{id:16,name:"Equilibria I · Kc",blurb:"Homogeneous and heterogeneous Kc expressions and calculations",topic:"Equilibria"},{id:17,name:"Equilibria II · Kp",blurb:"Mole fractions, partial pressures and Kp",topic:"Equilibria"},{id:18,name:"Equilibria III · Shifting K",blurb:"Temperature, pressure, catalysts and ΔStotal = R ln K",topic:"Equilibria"},{id:19,name:"Entropy & feasibility",blurb:"ΔSsystem, ΔSsurroundings, ΔStotal and thermodynamic vs kinetic stability",topic:"Entropy"},{id:20,name:"Lattice energy & Born–Haber",blurb:"Atomisation, electron affinity, lattice energy and polarisation",topic:"Energetics"},{id:21,name:"Solution & hydration",blurb:"ΔsolH, ΔhydH, energy cycles and solubility trends",topic:"Energetics"}],version:3},kf=[{id:"l1-01",section:1,qtype:"Define",spec:["11.1i"],source:"Kinetics 1, p.1",difficulty:1,q:"Define rate of reaction: the change in ______ of reactants or products per unit time.",answer:"concentration",distractors:["mass","volume","number of moles"],a:"The rate of reaction is the <b>change in concentration</b> of reactants or products per unit time."},{id:"l1-02",section:1,qtype:"State",spec:["11.1i"],source:"Kinetics 1, p.1",difficulty:1,q:"State the rate equation in terms of concentration change: rate = ______ / &Delta;time.",answer:"&Delta;concentration",distractors:["&Delta;mass","&Delta;temperature","concentration &times; time"],a:"Rate = <b>&Delta;concentration / &Delta;time</b>."},{id:"l1-03",section:1,qtype:"State",spec:["11.1i"],source:"Kinetics 1, p.1",difficulty:1,q:"State the usual unit of rate of reaction: ______.",answer:"mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup>",distractors:["mol dm<sup>&minus;3</sup>","s<sup>&minus;1</sup>","dm<sup>3</sup> mol<sup>&minus;1</sup> s<sup>&minus;1</sup>"],a:"Rate is measured in <b>mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup></b>."},{id:"l1-04",section:1,qtype:"Explain",spec:["11.1i"],source:"Kinetics 1, p.1",difficulty:1,q:"Explain why a minus sign is used: reactant concentration ______ with time.",answer:"decreases",distractors:["increases","stays constant","reaches equilibrium"],a:"Reactant concentration falls, so &Delta;[A] is negative; the minus sign makes the rate <b>positive</b>."},{id:"l1-05",section:1,qtype:"Calculate",spec:["11.1i"],source:"Kinetics 1, p.2",difficulty:2,q:"Calculate the missing coefficient: for A + 3B &rarr; 2D, rate = &minus;&Delta;[A]/&Delta;t = &minus;&Delta;[B]/______&Delta;t = &Delta;[D]/2&Delta;t.",answer:"3",distractors:["1","2","1/3"],a:"Each change in concentration is divided by its <b>stoichiometric coefficient</b>."},{id:"l1-06",section:1,qtype:"Calculate",spec:["11.1i"],source:"Kinetics 1, p.2",difficulty:2,q:"Calculate the rate of formation of water: for 4NH<sub>3</sub> + 3O<sub>2</sub> &rarr; 2N<sub>2</sub> + 6H<sub>2</sub>O, N<sub>2</sub> forms at 0.27 mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup>. Water forms at ______ mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup>.",answer:"0.81",distractors:["0.54","0.27","1.62"],a:"Water: (6/2) &times; 0.27 = <b>0.81 mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup></b>."},{id:"l1-07",section:1,qtype:"Calculate",spec:["11.1i"],source:"Kinetics 1, p.2",difficulty:2,q:"Calculate the rate of consumption of ammonia for the same reaction: ammonia is consumed at ______ mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup>.",answer:"0.54",distractors:["0.81","0.27","1.08"],a:"Ammonia: (4/2) &times; 0.27 = <b>0.54 mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup></b>."},{id:"l1-08",section:1,qtype:"State",spec:["11.1i"],source:"Kinetics 1, p.1",difficulty:1,q:"State the rate for A + B &rarr; C: rate = &minus;&Delta;[A]/&Delta;t = &minus;&Delta;[B]/&Delta;t = ______.",answer:"&Delta;[C]/&Delta;t",distractors:["&minus;&Delta;[C]/&Delta;t","2&Delta;[C]/&Delta;t","&Delta;[A]/&Delta;t"],a:"The rate can be written using <b>&Delta;[C]/&Delta;t</b> because C is the product."},{id:"l1-09",section:1,qtype:"Explain",spec:["11.1i"],source:"Kinetics 1, p.2",difficulty:2,q:"Explain why each concentration change is divided by its coefficient: this makes the rate ______ whichever reactant or product is used.",answer:"the same",distractors:["different","negative","zero"],a:"This removes ambiguity: every component gives <b>the same rate</b>."},{id:"l1-10",section:1,qtype:"State",spec:["11.1i"],source:"Kinetics 1, p.1",difficulty:1,q:"State which component can be used to express the rate: the change in concentration of ______ component.",answer:"any",distractors:["only the first","only the limiting","only the product"],a:"Use <b>any</b> reactant or product, as long as it is divided by its coefficient."},{id:"l2-01",section:2,qtype:"Define",spec:["11.1ii"],source:"Kinetics 1, p.3",difficulty:1,q:"Define the general rate equation: rate = ______.",answer:"k[A]<sup>m</sup>[B]<sup>n</sup>",distractors:["k([A] + [B])","[A]<sup>m</sup>[B]<sup>n</sup> / k","k[A + B]<sup>m+n</sup>"],a:"rate = <b>k[A]<sup>m</sup>[B]<sup>n</sup></b>, where m and n are the orders."},{id:"l2-02",section:2,qtype:"Define",spec:["11.1iii"],source:"Kinetics 1, p.3",difficulty:1,q:"Define order with respect to A: the ______ to which [A] is raised in the rate equation.",answer:"power",distractors:["coefficient","concentration","volume"],a:"The order is the <b>power</b> of that concentration in the rate equation."},{id:"l2-03",section:2,qtype:"Deduce",spec:["11.1iii"],source:"Kinetics 1, p.3",difficulty:2,q:"Deduce the effect of changing [A] for a zero-order reaction: changing [A] has ______ effect on the rate.",answer:"no",distractors:["a doubling","a halving","a proportional"],a:"Anything to the power zero is 1, so the <b>[A] term disappears</b>."},{id:"l2-04",section:2,qtype:"Deduce",spec:["11.1iii"],source:"Kinetics 1, p.3",difficulty:1,q:"Deduce the relationship for a first-order reaction: the rate is ______ proportional to [A].",answer:"directly",distractors:["inversely","not","exponentially"],a:"First order means rate &prop; [A], so the rate is <b>directly proportional</b>."},{id:"l2-05",section:2,qtype:"Deduce",spec:["11.1iii"],source:"Kinetics 1, p.3",difficulty:2,q:"Deduce the effect of doubling [A] for a second-order reaction: the rate is multiplied by ______.",answer:"4",distractors:["2","3","8"],a:"2<sup>2</sup> = <b>4</b>."},{id:"l2-06",section:2,qtype:"Define",spec:["11.1iv"],source:"Kinetics 1, p.3",difficulty:1,q:"Define overall order: found by ______ the individual orders.",answer:"adding",distractors:["multiplying","averaging","subtracting"],a:"Overall order = <b>sum of the individual orders</b>."},{id:"l2-07",section:2,qtype:"State",spec:["11.1iii"],source:"Kinetics 1, p.3",difficulty:2,q:"State whether orders can be fractional: in this specification orders are 0, 1 or 2, but ______ orders such as 1.53 are possible.",answer:"fractional",distractors:["negative","imaginary","whole-number"],a:"Orders can be <b>fractional</b>, although 0, 1 and 2 are the ones you meet here."},{id:"l2-08",section:2,qtype:"State",spec:["11.1iii"],source:"Kinetics 1, p.3",difficulty:2,q:"State how orders and k are found: only by ______.",answer:"experiment",distractors:["balancing the equation","reading the coefficients","measuring the enthalpy change"],a:"They are <b>empirical</b> and cannot be deduced from the balanced equation."},{id:"l2-09",section:2,qtype:"Define",spec:["11.1v"],source:"Kinetics 1, p.4",difficulty:2,q:"Define the rate constant k: the ______ constant linking rate to the concentrations.",answer:"proportionality",distractors:["equilibrium","solubility","dissociation"],a:"k is the <b>proportionality constant</b> in the rate equation."},{id:"l2-10",section:2,qtype:"State",spec:["11.1v"],source:"Kinetics 1, p.4",difficulty:2,q:"State the factor that does not change the rate constant k: ______.",answer:"concentration",distractors:["temperature","surface area","catalyst"],a:"k is specific to a reaction at a temperature; it is <b>independent of concentration</b>."},{id:"l2-11",section:2,qtype:"State",spec:["11.1v"],source:"Kinetics 1, p.4",difficulty:1,q:"State what a large value of k means: the reaction is relatively ______.",answer:"fast",distractors:["slow","zero order","at equilibrium"],a:"Large k = <b>fast</b>; small k = slow."},{id:"l2-12",section:2,qtype:"State",spec:["11.1v"],source:"Kinetics 1, p.6",difficulty:2,q:"State the units of k for a first-order reaction: ______.",answer:"s<sup>&minus;1</sup>",distractors:["mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup>","dm<sup>3</sup> mol<sup>&minus;1</sup> s<sup>&minus;1</sup>","dm<sup>6</sup> mol<sup>&minus;2</sup> s<sup>&minus;1</sup>"],a:"First order: k = rate/[A], so k has units <b>s<sup>&minus;1</sup></b>."},{id:"l2-13",section:2,qtype:"State",spec:["11.1v"],source:"Kinetics 1, p.6",difficulty:2,q:"State the units of k for a second-order reaction: ______.",answer:"dm<sup>3</sup> mol<sup>&minus;1</sup> s<sup>&minus;1</sup>",distractors:["s<sup>&minus;1</sup>","mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup>","dm<sup>6</sup> mol<sup>&minus;2</sup> s<sup>&minus;1</sup>"],a:"Second order: k = rate/[A]<sup>2</sup>, giving <b>dm<sup>3</sup> mol<sup>&minus;1</sup> s<sup>&minus;1</sup></b>."},{id:"l2-14",section:2,qtype:"State",spec:["11.1v"],source:"Kinetics 1, p.6",difficulty:2,q:"State the units of k for a zero-order reaction: ______.",answer:"mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup>",distractors:["s<sup>&minus;1</sup>","dm<sup>3</sup> mol<sup>&minus;1</sup> s<sup>&minus;1</sup>","dm<sup>6</sup> mol<sup>&minus;2</sup> s<sup>&minus;1</sup>"],a:"Zero order: rate = k, so k has the units of rate, <b>mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup></b>."},{id:"l3-01",section:3,qtype:"Define",spec:["11.1vi"],source:"Kinetics 1, p.6",difficulty:1,q:"Define half-life: the time for a reactant concentration to ______.",answer:"halve",distractors:["double","reach zero","reach equilibrium"],a:"Half-life is the time for the concentration to <b>decrease by half</b>."},{id:"l3-02",section:3,qtype:"Deduce",spec:["11.2"],source:"Kinetics 1, p.8",difficulty:1,q:"Deduce the order from a constant half-life: a reaction with a constant half-life is ______ order.",answer:"first",distractors:["zero","second","third"],a:"A constant half-life means the reaction is <b>first order</b>."},{id:"l3-03",section:3,qtype:"State",spec:["11.2"],source:"Kinetics 1, p.8",difficulty:1,q:"State the half-life equation for a first-order reaction: t<sub>1/2</sub> = ______.",answer:"ln 2 / k",distractors:["k / ln 2","2 / k","ln 2 &times; k"],a:"t<sub>1/2</sub> = ln 2 / k &asymp; <b>0.693 / k</b>."},{id:"l3-04",section:3,qtype:"State",spec:["11.5i"],source:"Kinetics 1, p.7",difficulty:2,q:"State the linear graph for a zero-order reaction: ______ against time, and k = &minus;slope.",answer:"[A]",distractors:["ln[A]","1/[A]","rate"],a:"<b>[A] against time</b> is linear for zero order; k = &minus;slope."},{id:"l3-05",section:3,qtype:"State",spec:["11.5i"],source:"Kinetics 1, p.7",difficulty:2,q:"State the linear graph for a first-order reaction: ______ against time, and k = &minus;slope.",answer:"ln[A]",distractors:["[A]","1/[A]","rate"],a:"<b>ln[A] against time</b> is linear for first order; k = &minus;slope."},{id:"l3-06",section:3,qtype:"State",spec:["11.5i"],source:"Kinetics 1, p.7",difficulty:2,q:"State the linear graph for a second-order reaction: ______ against time, and k = slope.",answer:"1/[A]",distractors:["[A]","ln[A]","rate"],a:"<b>1/[A] against time</b> is linear for second order; k = slope."},{id:"l3-07",section:3,qtype:"State",spec:["11.5i"],source:"Kinetics 1, p.6",difficulty:2,q:"State how to find order from concentration&ndash;time data: plot [A], ln[A] and ______ against time.",answer:"1/[A]",distractors:["[A]<sup>2</sup>","rate","log[A]"],a:"Whichever graph is linear gives the order."},{id:"l3-08",section:3,qtype:"State",spec:["11.5ii"],source:"Kinetics 1, p.7",difficulty:2,q:"State the rate&ndash;concentration graph for a zero-order reaction: rate against [A] is ______.",answer:"horizontal",distractors:["a straight line through the origin","an upward curve","a downward curve"],a:"Rate is independent of [A], so the line is <b>horizontal</b>."},{id:"l3-09",section:3,qtype:"State",spec:["11.5ii"],source:"Kinetics 1, p.10",difficulty:2,q:"State the rate&ndash;concentration graph for a first-order reaction: rate against [A] is ______.",answer:"a straight line through the origin",distractors:["horizontal","an upward curve","a straight line with a positive intercept"],a:"First order: rate = k[A], so the graph is a <b>straight line through the origin</b>."},{id:"l3-10",section:3,qtype:"Calculate",spec:["11.2"],source:"Kinetics 1, p.9",difficulty:3,q:"Calculate k for a first-order reaction with t<sub>1/2</sub> = 10 min: k = ______ s<sup>&minus;1</sup>.",answer:"1.15 &times; 10<sup>&minus;3</sup>",distractors:["6.93 &times; 10<sup>&minus;3</sup>","1.15 &times; 10<sup>&minus;3</sup> min<sup>&minus;1</sup>","1.44 &times; 10<sup>&minus;3</sup>"],a:"10 min = 600 s; k = 0.693 / 600 = <b>1.15 &times; 10<sup>&minus;3</sup> s<sup>&minus;1</sup></b>."},{id:"l3-11",section:3,qtype:"Calculate",spec:["11.2"],source:"Kinetics 1, p.9",difficulty:3,q:"Calculate the half-life: 3.0 g of A decomposes to 0.375 g in 36 min. If the reaction is first order, t<sub>1/2</sub> = ______ min.",answer:"12",distractors:["18","9","36"],a:"3.0 &rarr; 1.5 &rarr; 0.75 &rarr; 0.375 is three half-lives; 36 / 3 = <b>12 min</b>."},{id:"l3-12",section:3,qtype:"Calculate",spec:["11.2"],source:"Kinetics 1, p.11",difficulty:3,q:"Calculate the time for 70 cm<sup>3</sup> of N<sub>2</sub> to evolve: benzenediazonium chloride gives 80 cm<sup>3</sup> in total; 40 cm<sup>3</sup> evolves in 40 min. 70 cm<sup>3</sup> evolves after ______ min.",answer:"120",distractors:["80","160","100"],a:"t<sub>1/2</sub> = 40 min. 70 cm<sup>3</sup> evolved leaves 10 cm<sup>3</sup> = 80/8, three half-lives: 3 &times; 40 = <b>120 min</b>."},{id:"l3-13",section:3,qtype:"Calculate",spec:["11.2"],source:"Kinetics 1, p.11",difficulty:3,q:"Calculate k for first-order N<sub>2</sub>O<sub>5</sub>: rate = 2.10 &times; 10<sup>&minus;5</sup> and [N<sub>2</sub>O<sub>5</sub>] = 2.00. k = ______ s<sup>&minus;1</sup>.",answer:"1.05 &times; 10<sup>&minus;5</sup>",distractors:["4.20 &times; 10<sup>&minus;5</sup>","2.10 &times; 10<sup>&minus;5</sup>","1.05 &times; 10<sup>&minus;5</sup> mol dm<sup>&minus;3</sup>"],a:"k = rate/[N<sub>2</sub>O<sub>5</sub>] = 2.10 &times; 10<sup>&minus;5</sup> / 2.00 = <b>1.05 &times; 10<sup>&minus;5</sup> s<sup>&minus;1</sup></b>."},{id:"l4-01",section:4,qtype:"Describe",spec:["11.4i"],source:"Kinetics 2, p.1",difficulty:2,q:"Describe the initial-rate method: it finds orders by varying one concentration at a time and measuring the ______ rate.",answer:"initial",distractors:["final","average","maximum"],a:"Use the <b>initial rate</b>, measured at the very start of the reaction."},{id:"l4-02",section:4,qtype:"Describe",spec:["11.4i"],source:"Kinetics 2, p.1",difficulty:2,q:"Describe the variables kept constant in initial-rate experiments: all other concentrations, the total volume and the ______ are kept constant.",answer:"temperature",distractors:["pressure","catalyst mass","colour"],a:"Change one variable at a time while keeping <b>temperature</b>, volume and other concentrations constant."},{id:"l4-03",section:4,qtype:"Deduce",spec:["11.5iii"],source:"Kinetics 2, p.1",difficulty:2,q:"Deduce the order if doubling [X] doubles the rate: the order with respect to X is ______.",answer:"1",distractors:["0","2","3"],a:"Double concentration &rarr; double rate = <b>first order</b>."},{id:"l4-04",section:4,qtype:"Deduce",spec:["11.5iii"],source:"Kinetics 2, p.1",difficulty:2,q:"Deduce the order if doubling [X] quadruples the rate: the order with respect to X is ______.",answer:"2",distractors:["0","1","3"],a:"Double concentration &rarr; four times the rate = <b>second order</b>."},{id:"l4-05",section:4,qtype:"Deduce",spec:["11.5iii"],source:"Kinetics 2, p.1",difficulty:2,q:"Deduce the order if changing [X] has no effect: the order with respect to X is ______.",answer:"0",distractors:["1","2","3"],a:"No change in rate = <b>zero order</b>."},{id:"l4-06",section:4,qtype:"Deduce",spec:["11.5iii"],source:"Kinetics 2, p.1",difficulty:3,q:"Deduce the order in H<sub>2</sub> from the data: halving [H<sub>2</sub>] halves the rate, so the order is ______.",answer:"1",distractors:["0","2","1.5"],a:"Halving the concentration halves the rate, so the reaction is <b>first order in H<sub>2</sub></b>."},{id:"l4-07",section:4,qtype:"Deduce",spec:["11.5iii"],source:"Kinetics 2, p.1",difficulty:3,q:"Deduce the order in NO from the data: halving [NO] quarters the rate, so the order is ______.",answer:"2",distractors:["0","1","0.5"],a:"Halving the concentration quarters the rate, so the reaction is <b>second order in NO</b>."},{id:"l4-08",section:4,qtype:"Deduce",spec:["11.5iii"],source:"Kinetics 2, p.1",difficulty:3,q:"Deduce the rate equation for the NO/H<sub>2</sub> reaction: rate = ______.",answer:"k[H<sub>2</sub>][NO]<sup>2</sup>",distractors:["k[H<sub>2</sub>]<sup>2</sup>[NO]","k[H<sub>2</sub>][NO]","k[NO]<sup>2</sup>"],a:"First order in H<sub>2</sub>, second order in NO: rate = <b>k[H<sub>2</sub>][NO]<sup>2</sup></b>."},{id:"l4-09",section:4,qtype:"Calculate",spec:["11.5iii"],source:"Kinetics 2, p.1",difficulty:3,q:"Calculate k for rate = k[H<sub>2</sub>][NO]<sup>2</sup> with [H<sub>2</sub>] = 0.010, [NO] = 0.025 and rate = 2.4 &times; 10<sup>&minus;6</sup>: k = ______ dm<sup>6</sup> mol<sup>&minus;2</sup> s<sup>&minus;1</sup>.",answer:"0.384",distractors:["15.4","0.0096","38.4"],a:"k = 2.4 &times; 10<sup>&minus;6</sup> / (0.010 &times; 0.025<sup>2</sup>) = <b>0.384</b>."},{id:"l4-10",section:4,qtype:"Deduce",spec:["11.5iii"],source:"Kinetics 2, p.1",difficulty:3,q:"Deduce the order in A from the data: doubling [A] while [B] is constant doubles the rate, so the order is ______.",answer:"1",distractors:["0","2","3"],a:"Doubling [A] doubles the rate, so A is <b>first order</b>."},{id:"l4-11",section:4,qtype:"Deduce",spec:["11.5iii"],source:"Kinetics 2, p.1",difficulty:3,q:"Deduce the order in B from the data: doubling [B] multiplies the rate by about 4, so the order is ______.",answer:"2",distractors:["0","1","3"],a:"Doubling [B] quadruples the rate, so B is <b>second order</b>."},{id:"l4-12",section:4,qtype:"Deduce",spec:["11.5iii"],source:"Kinetics 2, p.2",difficulty:3,q:"Deduce the rate equation for A + 3B &rarr; AB<sub>3</sub>: rate = ______.",answer:"k[A][B]<sup>2</sup>",distractors:["k[A]<sup>2</sup>[B]","k[A][B]<sup>3</sup>","k[A][B]"],a:"First order in A, second order in B: rate = <b>k[A][B]<sup>2</sup></b>."},{id:"l4-13",section:4,qtype:"Calculate",spec:["11.5iii"],source:"Kinetics 2, p.4",difficulty:3,q:"Calculate the rate for H<sub>2</sub> + I<sub>2</sub> &rarr; 2HI: rate = k[H<sub>2</sub>][I<sub>2</sub>], k = 8.58 &times; 10<sup>&minus;5</sup>, [H<sub>2</sub>] = 0.010 and [I<sub>2</sub>] = 0.050. rate = ______ mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup>.",answer:"4.29 &times; 10<sup>&minus;8</sup>",distractors:["4.29 &times; 10<sup>&minus;6</sup>","8.58 &times; 10<sup>&minus;8</sup>","1.72 &times; 10<sup>&minus;7</sup>"],a:"rate = 8.58 &times; 10<sup>&minus;5</sup> &times; 0.010 &times; 0.050 = <b>4.29 &times; 10<sup>&minus;8</sup> mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup></b>."},{id:"l4-14",section:4,qtype:"Describe",spec:["11.6i"],source:"Kinetics 2, p.3",difficulty:2,q:"Describe the purpose of adding excess NaHCO<sub>3</sub> in the propanone/iodine experiment: it is added to ______ the reaction before titration.",answer:"stop",distractors:["speed up","catalyse","colour"],a:"NaHCO<sub>3</sub> neutralises the acid catalyst, <b>stopping</b> the reaction at that moment."},{id:"l4-15",section:4,qtype:"Deduce",spec:["11.6i"],source:"Kinetics 2, p.3",difficulty:2,q:"Deduce the order in iodine from the constant titre fall: the reaction is ______ order with respect to iodine.",answer:"zero",distractors:["first","second","third"],a:"The rate does not depend on [I<sub>2</sub>], so it is <b>zero order</b> in iodine."},{id:"l4-16",section:4,qtype:"Explain",spec:["11.6i"],source:"Kinetics 2, p.4",difficulty:3,q:"Explain why the reaction is much slower without the acid catalyst: the reaction is much ______ without it.",answer:"slower",distractors:["faster","unchanged","zero order"],a:"The acid provides an alternative route with a <b>lower activation energy</b>, so without it the reaction is much slower."},{id:"l5-01",section:5,qtype:"Define",spec:["11.8"],source:"Kinetics 3, p.1",difficulty:1,q:"Define a reaction mechanism: it describes the ______ involved and how bonds are broken and made.",answer:"steps",distractors:["products","catalysts","orders"],a:"A mechanism describes the <b>steps</b> and the bond changes in each one."},{id:"l5-02",section:5,qtype:"Define",spec:["11.1vii"],source:"Kinetics 3, p.2",difficulty:1,q:"Define the rate-determining step: the ______ step in a multi-step mechanism.",answer:"slowest",distractors:["fastest","first","last"],a:"The slowest step is the <b>rate-determining step</b>."},{id:"l5-03",section:5,qtype:"Explain",spec:["11.1vii"],source:"Kinetics 3, p.2",difficulty:1,q:"Explain which step controls the overall rate: the overall rate is controlled by the ______ step.",answer:"slowest",distractors:["fastest","first","final"],a:"The slow step acts as the bottleneck and controls the <b>overall rate</b>."},{id:"l5-04",section:5,qtype:"Deduce",spec:["11.7"],source:"Kinetics 3, p.3",difficulty:2,q:"Deduce which species appear in the rate equation: in a simple mechanism, the rate equation shows the species in the ______ step.",answer:"rate-determining",distractors:["fastest","final","equilibrium"],a:"The orders tell you which species collide in the <b>rate-determining step</b>."},{id:"l5-05",section:5,qtype:"Explain",spec:["11.9"],source:"Kinetics 3, p.1",difficulty:2,q:"Explain the slow step in the SN1 hydrolysis of 2-bromo-2-methylpropane: the C&ndash;Br bond breaks to form a ______.",answer:"carbocation",distractors:["carbanion","radical","alkene"],a:"The C–Br bond breaks slowly to form a <b>carbocation</b>, which OH<sup>&minus;</sup> then attacks quickly."},{id:"l5-06",section:5,qtype:"Explain",spec:["11.9"],source:"Kinetics 3, p.3",difficulty:2,q:"Explain why SN1 is zero order in OH<sup>&minus;</sup>: OH<sup>&minus;</sup> attacks in the fast step, so the reaction is ______ order in OH<sup>&minus;</sup>.",answer:"zero",distractors:["first","second","third"],a:"OH<sup>&minus;</sup> is not in the slow step, so the reaction is <b>zero order</b> in OH<sup>&minus;</sup>."},{id:"l5-07",section:5,qtype:"State",spec:["11.9"],source:"Kinetics 3, p.3",difficulty:2,q:"State the rate equation for the SN1 reaction: rate = k[______].",answer:"organic compound",distractors:["OH<sup>&minus;</sup>","organic compound][OH<sup>&minus;</sup>","H<sub>2</sub>O"],a:"Only the organic compound is in the slow step: rate = <b>k[organic compound]</b>."},{id:"l5-08",section:5,qtype:"Explain",spec:["11.9"],source:"Kinetics 3, p.3",difficulty:2,q:"Explain why SN2 is first order in both reactants: the organic compound and OH<sup>&minus;</sup> react in ______ step, so rate = k[organic][OH<sup>&minus;</sup>].",answer:"one",distractors:["two","three","the slow"],a:"SN2 is a single step, so it is <b>first order in both</b> reactants."},{id:"l5-09",section:5,qtype:"Define",spec:["11.8"],source:"Kinetics 3, p.4",difficulty:2,q:"Define molecularity: the number of ______ taking part in a step.",answer:"species",distractors:["orders","products","catalysts"],a:"Molecularity counts the <b>species</b> in one step."},{id:"l5-10",section:5,qtype:"State",spec:["11.8"],source:"Kinetics 3, p.4",difficulty:2,q:"State where molecularity is found: unlike order, it is found from the ______.",answer:"mechanism",distractors:["experiment","rate equation","balanced equation"],a:"Molecularity comes from the <b>mechanism</b>; order comes from experiment."},{id:"l5-11",section:5,qtype:"Define",spec:["11.8"],source:"Kinetics 3, p.5",difficulty:2,q:"Define a unimolecular step: a step involving one species breaking into ______.",answer:"unimolecular",distractors:["bimolecular","termolecular","zero order"],a:"One species in the step = <b>unimolecular</b>."},{id:"l5-12",section:5,qtype:"Define",spec:["11.8"],source:"Kinetics 3, p.5",difficulty:2,q:"Define a bimolecular step: a step involving ______ species reacting together.",answer:"bimolecular",distractors:["unimolecular","termolecular","first order"],a:"Two species in the step = <b>bimolecular</b>."},{id:"l6-01",section:6,qtype:"Describe",spec:["11.7"],source:"Kinetics 2, p.5",difficulty:2,q:"Describe the first step in proposing a mechanism from a rate equation: decide the species in the ______ step.",answer:"rate-determining",distractors:["fastest","final","first fast"],a:"Start with the species shown by the rate equation in the <b>rate-determining step</b>."},{id:"l6-02",section:6,qtype:"Suggest",spec:["11.8"],source:"Kinetics 2, p.5",difficulty:2,q:"Suggest what to do after choosing the slow-step species: suggest possible ______ for that step.",answer:"products",distractors:["catalysts","orders","units"],a:"The products may include species that are not in the overall equation."},{id:"l6-03",section:6,qtype:"Describe",spec:["11.8"],source:"Kinetics 2, p.6",difficulty:2,q:"Describe the next step: compare the slow step with the ______ equation.",answer:"stoichiometric",distractors:["rate","ionic","half"],a:"Compare with the <b>stoichiometric</b> equation to find missing species."},{id:"l6-04",section:6,qtype:"Describe",spec:["11.8"],source:"Kinetics 2, p.6",difficulty:2,q:"Describe the final step: add the steps, cancel intermediates and check they sum to the ______ equation.",answer:"overall",distractors:["rate","half","ionic"],a:"The steps must add up to the <b>overall</b> equation."},{id:"l6-05",section:6,qtype:"Deduce",spec:["11.8"],source:"Kinetics 2, p.5",difficulty:3,q:"Deduce the slow step for 2ICl + H<sub>2</sub> &rarr; 2HCl + I<sub>2</sub> given rate = k[ICl][H<sub>2</sub>]: ______.",answer:"ICl + H<sub>2</sub> &rarr; HCl + HI",distractors:["ICl + ICl &rarr; I<sub>2</sub> + Cl<sub>2</sub>","H<sub>2</sub> &rarr; 2H","HI + HI &rarr; H<sub>2</sub> + I<sub>2</sub>"],a:"One ICl and one H<sub>2</sub> in the slow step gives the observed rate equation."},{id:"l6-06",section:6,qtype:"Deduce",spec:["11.8"],source:"Kinetics 2, p.6",difficulty:3,q:"Deduce the fast second step of the ICl/H<sub>2</sub> mechanism: ______.",answer:"ICl + HI &rarr; HCl + I<sub>2</sub>",distractors:["ICl + H<sub>2</sub> &rarr; HCl + HI","H<sub>2</sub> + I<sub>2</sub> &rarr; 2HI","HCl + HI &rarr; H<sub>2</sub> + ICl"],a:"The fast step uses the HI intermediate: <b>ICl + HI &rarr; HCl + I<sub>2</sub></b>."},{id:"l6-07",section:6,qtype:"Explain",spec:["11.8"],source:"Kinetics 2, p.7",difficulty:3,q:"Explain the fault in the proposed mechanism: if ICl + ICl &rarr; I<sub>2</sub> + Cl<sub>2</sub> is slow, the reaction would be ______ order in H<sub>2</sub>.",answer:"zero",distractors:["first","second","third"],a:"The slow step contains no H<sub>2</sub>, so it would be <b>zero order</b> in H<sub>2</sub>; the experimental rate is first order in H<sub>2</sub>."},{id:"l6-08",section:6,qtype:"Explain",spec:["11.8"],source:"Kinetics 2, p.7",difficulty:3,q:"Explain why ICl &rarr; I• + Cl• cannot be the slow step: it would make the rate ______ of [H<sub>2</sub>].",answer:"independent",distractors:["first order","second order","proportional"],a:"It would give rate = k[ICl], but the experimental rate is <b>k[ICl][H<sub>2</sub>]</b>."},{id:"l6-09",section:6,qtype:"Deduce",spec:["11.8"],source:"Kinetics 2, p.7",difficulty:3,q:"Deduce a possible slow step for first-order 2N<sub>2</sub>O<sub>5</sub> &rarr; 4NO<sub>2</sub> + O<sub>2</sub>: ______.",answer:"N<sub>2</sub>O<sub>5</sub> &rarr; NO<sub>2</sub> + NO<sub>3</sub>",distractors:["2N<sub>2</sub>O<sub>5</sub> &rarr; products","N<sub>2</sub>O<sub>5</sub> + N<sub>2</sub>O<sub>5</sub> &rarr; products","O<sub>2</sub> &rarr; 2O"],a:"One N<sub>2</sub>O<sub>5</sub> in the slow step gives <b>first order</b>."},{id:"l6-10",section:6,qtype:"Deduce",spec:["11.8"],source:"Kinetics 2, p.7",difficulty:3,q:"Deduce the species in the slow step for A + 3B &rarr; AB<sub>3</sub> with rate = k[A][B]<sup>2</sup>: ______.",answer:"A + 2B",distractors:["A + B","A + 3B","3B"],a:"The orders show one A and two B in the slow step: <b>A + 2B</b>."},{id:"l6-11",section:6,qtype:"Deduce",spec:["11.8"],source:"Kinetics 2, p.7",difficulty:3,q:"Deduce the species in the slow step for 2H<sub>2</sub> + 2NO &rarr; 2H<sub>2</sub>O + N<sub>2</sub> with rate = k[H<sub>2</sub>][NO]<sup>2</sup>: ______.",answer:"H<sub>2</sub> + 2NO",distractors:["H<sub>2</sub> + NO","2NO","2H<sub>2</sub> + 2NO"],a:"One H<sub>2</sub> and two NO in the slow step gives <b>k[H<sub>2</sub>][NO]<sup>2</sup></b>."},{id:"l6-12",section:6,qtype:"Deduce",spec:["11.8"],source:"Kinetics 4, p.1",difficulty:3,q:"Deduce the slow step for NO<sub>2</sub> + CO &rarr; NO + CO<sub>2</sub>, second order in NO<sub>2</sub> and zero order in CO: ______.",answer:"NO<sub>2</sub> + NO<sub>2</sub>",distractors:["NO<sub>2</sub> + CO","CO + CO","NO<sub>2</sub> + NO"],a:"Two NO<sub>2</sub> collide in the slow step, so CO enters in a later fast step."},{id:"l6-13",section:6,qtype:"Deduce",spec:["11.8"],source:"Kinetics 4, p.2",difficulty:3,q:"Deduce the fast step in the NO<sub>2</sub>/CO mechanism: ______.",answer:"NO<sub>3</sub> + CO &rarr; NO<sub>2</sub> + CO<sub>2</sub>",distractors:["NO<sub>2</sub> + NO<sub>2</sub> &rarr; NO + NO<sub>3</sub>","NO + CO &rarr; NO<sub>2</sub> + CO<sub>2</sub>","NO<sub>2</sub> + CO &rarr; NO<sub>3</sub> + CO<sub>2</sub>"],a:"After the slow step, NO<sub>3</sub> reacts quickly with CO: <b>NO<sub>3</sub> + CO &rarr; NO<sub>2</sub> + CO<sub>2</sub></b>."},{id:"l6-14",section:6,qtype:"Deduce",spec:["11.8"],source:"Kinetics 4, p.2",difficulty:3,q:"Deduce the rate law for 2NO + O<sub>2</sub> &rarr; 2NO<sub>2</sub> with fast 2NO &harr; N<sub>2</sub>O<sub>2</sub> and slow N<sub>2</sub>O<sub>2</sub> + O<sub>2</sub>: rate = ______.",answer:"k[NO]<sup>2</sup>[O<sub>2</sub>]",distractors:["k[N<sub>2</sub>O<sub>2</sub>][O<sub>2</sub>]","k[NO][O<sub>2</sub>]","k[NO]<sup>2</sup>"],a:"Substitute the intermediate: [N<sub>2</sub>O<sub>2</sub>] &prop; [NO]<sup>2</sup>, giving <b>k[NO]<sup>2</sup>[O<sub>2</sub>]</b>."},{id:"l6-15",section:6,qtype:"State",spec:["11.8"],source:"Kinetics 4, p.2",difficulty:3,q:"State why a rate law cannot contain a reaction intermediate: it is not ______.",answer:"intermediate",distractors:["catalyst","product","reactant"],a:"Replace the intermediate using the fast equilibrium so the rate law contains only reactants."},{id:"l7-01",section:7,qtype:"Select",spec:["11.3iv"],source:"Kinetics 5, p.1",difficulty:2,q:"Select a technique for a reaction that produces a gas: measure the ______.",answer:"volume of gas evolved",distractors:["colorimetry","titration","pH measurement"],a:"Collect the gas in a syringe or measuring cylinder and record the <b>volume evolved</b>."},{id:"l7-02",section:7,qtype:"Select",spec:["11.3ii"],source:"Kinetics 5, p.12",difficulty:2,q:"Select a technique for a coloured substance: use ______.",answer:"colorimetry",distractors:["mass change","gas volume","dilatometry"],a:"A colorimeter measures the <b>absorbance</b> of the coloured substance."},{id:"l7-03",section:7,qtype:"Describe",spec:["11.4i"],source:"Kinetics 5, p.1",difficulty:2,q:"Describe a simple initial-rate experiment: measure the ______ taken for a small fixed change.",answer:"time",distractors:["mass","volume","temperature"],a:"Time how long a fixed event takes, then repeat with a different concentration."},{id:"l7-04",section:7,qtype:"State",spec:["11.4i"],source:"Kinetics 5, p.3",difficulty:2,q:"State how to estimate initial rate if gas volume is not measured: use ______.",answer:"1/t",distractors:["t","t<sup>2</sup>","log t"],a:"Rate is inversely proportional to time, so use <b>1/t</b>."},{id:"l7-05",section:7,qtype:"Interpret",spec:["11.5ii"],source:"Kinetics 5, p.3",difficulty:2,q:"Interpret the graph of 1/t against concentration: it is a straight line for a ______ order reaction.",answer:"first",distractors:["zero","second","third"],a:"First order: rate &prop; concentration, so <b>1/t</b> against concentration is linear."},{id:"l7-06",section:7,qtype:"Deduce",spec:["11.5iii"],source:"Kinetics 5, p.4",difficulty:3,q:"Deduce the order from a log(rate) against log[A] graph: the gradient is ______.",answer:"n",distractors:["k","log k","1/n"],a:"log(rate) = log k + <b>n</b> log[A], so the gradient is the order."},{id:"l7-07",section:7,qtype:"Describe",spec:["11.3iii"],source:"Kinetics 5, p.5",difficulty:2,q:"Describe the purpose of the weighing bottle in the H<sub>2</sub>O<sub>2</sub> decomposition experiment: it prevents ______ at the start.",answer:"gas loss",distractors:["cooling","dilution","colour change"],a:"Adding the catalyst inside the sealed flask avoids <b>losing gas</b> while the bung is fitted."},{id:"l7-08",section:7,qtype:"Describe",spec:["11.3v"],source:"Kinetics 5, p.6",difficulty:2,q:"Describe how the thiosulphate&ndash;acid rate is measured: time for the ______ to disappear.",answer:"cross",distractors:["colour","precipitate","gas syringe"],a:"A cross on paper under the flask disappears as sulphur precipitates: time the <b>cross</b>."},{id:"l7-09",section:7,qtype:"Describe",spec:["11.3v"],source:"Kinetics 5, p.7",difficulty:2,q:"Describe how to keep the total volume constant: make each sample up to the same volume with ______.",answer:"water",distractors:["acid","thiosulphate","indicator"],a:"Top up with <b>water</b> so only the thiosulphate concentration changes."},{id:"l7-10",section:7,qtype:"Describe",spec:["11.3v"],source:"Kinetics 5, p.8",difficulty:2,q:"Describe the iodine clock colour change: starch turns the mixture ______ when thiosulphate is used up.",answer:"blue",distractors:["yellow","colourless","red"],a:"The first excess iodine reacts with starch and turns the mixture <b>blue</b>."},{id:"l7-11",section:7,qtype:"Explain",spec:["11.3v"],source:"Kinetics 5, p.8",difficulty:2,q:"Explain the role of thiosulphate in the iodine clock: it reacts with ______ first, delaying the blue colour.",answer:"iodine",distractors:["starch","acid","peroxide"],a:"Thiosulphate removes the <b>iodine</b> until it is used up, then starch turns blue."},{id:"l8-01",section:8,qtype:"Describe",spec:["11.3i"],source:"Kinetics 5, p.9",difficulty:2,q:"Describe the sampling method: small portions are removed at intervals and ______ to find the concentration.",answer:"titrated",distractors:["weighed","filtered","distilled"],a:"Samples are <b>titrated</b> to measure how much reactant remains."},{id:"l8-02",section:8,qtype:"Explain",spec:["11.3i"],source:"Kinetics 5, p.9",difficulty:2,q:"Explain why excess acid is added to a bromoethane/NaOH sample: it ______ the reaction.",answer:"stops",distractors:["speeds up","catalyses","dilutes"],a:"Excess acid uses up the NaOH and <b>stops</b> the reaction."},{id:"l8-03",section:8,qtype:"Describe",spec:["11.3i"],source:"Kinetics 5, p.9",difficulty:3,q:"Describe the back-titration step: leftover acid is titrated with ______.",answer:"sodium hydroxide",distractors:["hydrochloric acid","thiosulphate","iodine"],a:"Back-titrate the excess acid with <b>sodium hydroxide</b>."},{id:"l8-04",section:8,qtype:"Explain",spec:["11.3i"],source:"Kinetics 5, p.9",difficulty:2,q:"Explain why a sample is cooled and diluted before titration: it ______ the reaction.",answer:"slows",distractors:["stops","speeds up","catalyses"],a:"Cooling and diluting <b>slows</b> the reaction while you titrate."},{id:"l8-05",section:8,qtype:"Select",spec:["11.3ii"],source:"Kinetics 5, p.12",difficulty:2,q:"Select a colorimeter filter: choose a filter that the sample ______.",answer:"absorbs",distractors:["reflects","emits","transmits"],a:"Use the colour the sample <b>absorbs</b>; copper(II) sulphate absorbs red light."},{id:"l8-06",section:8,qtype:"Describe",spec:["11.3ii"],source:"Kinetics 5, p.12",difficulty:2,q:"Describe the colorimeter calibration curve: plot absorbance against ______.",answer:"concentration",distractors:["time","temperature","volume"],a:"The calibration curve converts absorbance into <b>concentration</b>."},{id:"l8-07",section:8,qtype:"Describe",spec:["11.3ii"],source:"Kinetics 5, p.12",difficulty:2,q:"Describe the colour change in the propanone/iodine mixture: it fades from brown to ______.",answer:"colourless",distractors:["blue","green","white"],a:"Iodine is brown; as it is used up the mixture fades to <b>colourless</b>."},{id:"l8-08",section:8,qtype:"Explain",spec:["11.3v"],source:"Kinetics 5, p.13",difficulty:2,q:"Explain why pH is a poor method when [H<sup>+</sup>] changes only slightly: the pH change is too ______.",answer:"slightly",distractors:["greatly","linearly","to zero"],a:"A small change in [H<sup>+</sup>] gives only a small pH change, so pH is not sensitive enough."},{id:"l8-09",section:8,qtype:"Explain",spec:["11.3v"],source:"Kinetics 5, p.13",difficulty:2,q:"Explain why conductivity falls as H<sup>+</sup> and I<sup>&minus;</sup> are used up: there are ______ ions in solution.",answer:"falls",distractors:["rises","stays constant","halves"],a:"Fewer ions means lower conductivity, so it <b>falls</b>."},{id:"l8-10",section:8,qtype:"Describe",spec:["11.3v"],source:"Kinetics 5, p.13",difficulty:2,q:"Describe dilatometry: it measures the change in ______ of the reaction mixture.",answer:"volume",distractors:["mass","colour","pH"],a:"Dilatometry follows the change in <b>volume</b>."},{id:"l8-11",section:8,qtype:"Describe",spec:["11.3v"],source:"Kinetics 5, p.13",difficulty:2,q:"Describe polarimetry: it measures the change in ______ of plane-polarised light.",answer:"rotation",distractors:["colour","intensity","wavelength"],a:"Polarimetry follows the change in <b>rotation</b> for optically active compounds."},{id:"l9-01",section:9,qtype:"State",spec:["11.10"],source:"Kinetics 5, p.15",difficulty:1,q:"State the Arrhenius equation: k = ______.",answer:"Ae<sup>&minus;Ea/RT</sup>",distractors:["Ae<sup>Ea/RT</sup>","Ea e<sup>&minus;A/RT</sup>","A + e<sup>&minus;Ea/RT</sup>"],a:"k = <b>Ae<sup>&minus;Ea/RT</sup></b>."},{id:"l9-02",section:9,qtype:"Define",spec:["11.10"],source:"Kinetics 5, p.15",difficulty:2,q:"Define the pre-exponential factor A in the Arrhenius equation: A is the ______ factor.",answer:"pre-exponential",distractors:["equilibrium","activation","rate"],a:"A is the <b>pre-exponential</b> (frequency) factor."},{id:"l9-03",section:9,qtype:"Define",spec:["11.1viii","11.10"],source:"Kinetics 5, p.15",difficulty:1,q:"Define activation energy: the minimum ______ required for a reaction to take place.",answer:"energy",distractors:["concentration","temperature","volume"],a:"Ea is the <b>activation energy</b>."},{id:"l9-04",section:9,qtype:"Rearrange",spec:["11.10"],source:"Kinetics 5, p.16",difficulty:2,q:"Rearrange the Arrhenius equation into its logarithmic form: ln k = ______.",answer:"ln A &minus; Ea/RT",distractors:["ln A + Ea/RT","Ea/RT &minus; ln A","ln A &times; Ea/RT"],a:"ln k = <b>ln A &minus; Ea/RT</b>."},{id:"l9-05",section:9,qtype:"Interpret",spec:["11.10"],source:"Kinetics 5, p.16",difficulty:2,q:"Interpret the graph of ln k against 1/T: the gradient is ______.",answer:"&minus;Ea/R",distractors:["Ea/R","&minus;R/Ea","ln A"],a:"Gradient = <b>&minus;Ea/R</b>."},{id:"l9-06",section:9,qtype:"Interpret",spec:["11.10"],source:"Kinetics 5, p.16",difficulty:2,q:"Interpret the graph of ln k against 1/T: the intercept is ______.",answer:"ln A",distractors:["A","&minus;Ea/R","Ea"],a:"Extrapolate to the y-axis: intercept = <b>ln A</b>."},{id:"l9-07",section:9,qtype:"Explain",spec:["11.10"],source:"Kinetics 5, p.16",difficulty:2,q:"Explain why k increases with temperature: the term e<sup>&minus;Ea/RT</sup> gets ______.",answer:"bigger",distractors:["smaller","zero","negative"],a:"Ea/RT gets smaller, so e<sup>&minus;Ea/RT</sup> gets <b>bigger</b> and k increases."},{id:"l9-08",section:9,qtype:"Calculate",spec:["11.10"],source:"Kinetics 5, p.17",difficulty:3,q:"Calculate k for A = 0.3, Ea = 50 kJ mol<sup>&minus;1</sup> and T = 300 K: k is about ______.",answer:"5.90 &times; 10<sup>&minus;10</sup>",distractors:["1.97 &times; 10<sup>&minus;9</sup>","20.05","0.3"],a:"Ea/RT = 20.05; e<sup>&minus;20.05</sup> = 1.97 &times; 10<sup>&minus;9</sup>; k = 0.3 &times; 1.97 &times; 10<sup>&minus;9</sup> = <b>5.90 &times; 10<sup>&minus;10</sup></b>."},{id:"l9-09",section:9,qtype:"State",spec:["11.10"],source:"Kinetics 5, p.18",difficulty:3,q:"State the units of activation energy obtained from a two-temperature Arrhenius calculation: ______.",answer:"kJ mol<sup>&minus;1</sup>",distractors:["J mol<sup>&minus;1</sup>","kJ K<sup>&minus;1</sup>","mol dm<sup>&minus;3</sup>"],a:"The worked example gives Ea = <b>432 kJ mol<sup>&minus;1</sup></b>."},{id:"l9-10",section:9,qtype:"Explain",spec:["11.10"],source:"Kinetics 5, p.16",difficulty:2,q:"Explain why the two-temperature Arrhenius method is less reliable: it uses only ______ values of k.",answer:"two",distractors:["three","four","ten"],a:"Only <b>two</b> values introduce large errors; a full graph is better."},{id:"l10-01",section:10,qtype:"Define",spec:["11.1ix"],source:"Kinetics 5, p.19",difficulty:1,q:"Define a heterogeneous catalyst: it is in a ______ phase from the reactants.",answer:"different",distractors:["same","liquid","gas"],a:"Heterogeneous = <b>different phase</b>, usually a solid catalyst with gaseous or liquid reactants."},{id:"l10-02",section:10,qtype:"Define",spec:["11.1ix"],source:"Kinetics 5, p.19",difficulty:1,q:"Define a homogeneous catalyst: it is in the ______ phase as the reactants.",answer:"same",distractors:["different","solid","aqueous"],a:"Homogeneous = <b>same phase</b> as the reactants."},{id:"l10-03",section:10,qtype:"Describe",spec:["11.11"],source:"Kinetics 5, p.19",difficulty:2,q:"Describe the first stage of heterogeneous catalysis: reactants ______ onto the catalyst surface.",answer:"adsorb",distractors:["absorb","desorb","dissolve"],a:"Reactants <b>adsorb</b> (stick) onto the surface."},{id:"l10-04",section:10,qtype:"Define",spec:["11.11"],source:"Kinetics 5, p.19",difficulty:2,q:"Define an active site: a part of the catalyst surface that is especially good at ______ reactants.",answer:"active site",distractors:["intermediate","catalyst","product"],a:"Reactions happen at <b>active sites</b>."},{id:"l10-05",section:10,qtype:"Describe",spec:["11.11"],source:"Kinetics 5, p.19",difficulty:2,q:"Describe the final stage of heterogeneous catalysis: ______ of the products.",answer:"desorption",distractors:["adsorption","absorption","diffusion"],a:"Products break away by <b>desorption</b>, freeing the active site."},{id:"l10-06",section:10,qtype:"Explain",spec:["11.11"],source:"Kinetics 5, p.19",difficulty:2,q:"Explain the balance in a good catalyst: it adsorbs reactants strongly enough to activate them, but not so strongly that products cannot ______.",answer:"desorb",distractors:["adsorb","dissolve","melt"],a:"Products must be able to <b>desorb</b>."},{id:"l10-07",section:10,qtype:"Explain",spec:["11.11"],source:"Kinetics 5, p.20",difficulty:2,q:"Explain why silver is a poor catalyst: it adsorbs reactants too ______.",answer:"weakly",distractors:["strongly","quickly","slowly"],a:"<b>Silver</b> adsorbs too weakly to activate the reactants."},{id:"l10-08",section:10,qtype:"Explain",spec:["11.11"],source:"Kinetics 5, p.20",difficulty:2,q:"Explain why tungsten is a poor catalyst: it adsorbs reactants too ______.",answer:"strongly",distractors:["weakly","quickly","slowly"],a:"<b>Tungsten</b> adsorbs too strongly, so products cannot leave."},{id:"l10-09",section:10,qtype:"State",spec:["11.11"],source:"Kinetics 5, p.20",difficulty:2,q:"State the catalyst for ethene + H<sub>2</sub> &rarr; ethane: ______.",answer:"nickel",distractors:["silver","tungsten","iron"],a:"<b>Nickel</b> catalyses the hydrogenation; the same reaction hardens vegetable oil to make margarine."},{id:"l10-10",section:10,qtype:"Explain",spec:["Extension"],source:"Kinetics 5, p.21",difficulty:2,q:"Explain autocatalysis: the reaction is catalysed by one of its ______.",answer:"products",distractors:["reactants","intermediates","catalysts"],a:"A <b>product</b> catalyses the reaction, so the rate increases as it forms."},{id:"l10-11",section:10,qtype:"Explain",spec:["Extension"],source:"Kinetics 5, p.21",difficulty:2,q:"Explain the autocatalytic oxidation of ethanedioic acid by MnO<sub>4</sub><sup>&minus;</sup>: it is catalysed by ______ ions.",answer:"Mn<sup>2+</sup>",distractors:["Mn<sup>7+</sup>","H<sup>+</sup>","Fe<sup>2+</sup>"],a:"The reaction is catalysed by <b>Mn<sup>2+</sup></b>, which is produced as the reaction proceeds."},{id:"l10-12",section:10,qtype:"Explain",spec:["Extension"],source:"Kinetics 5, p.22",difficulty:2,q:"Explain the rate curve of an autocatalytic reaction: it starts slow, then ______ as catalyst is formed.",answer:"speeds up",distractors:["slows down","stops","stays constant"],a:"More catalyst is formed, so the reaction <b>speeds up</b> before finally slowing as reactants run out."},{id:"l10-13",section:10,qtype:"Explain",spec:["Extension"],source:"Kinetics 5, p.22",difficulty:3,q:"Explain why an S-shaped rate curve is not proof of autocatalysis: it could be caused by a surface coating or an ______ reaction.",answer:"exothermic",distractors:["endothermic","equilibrium","zero-order"],a:"A strongly <b>exothermic</b> reaction can heat up and speed up, producing a similar curve."},{id:"l4-17",section:4,qtype:"Deduce",spec:["11.6i"],source:"Kinetics 5, p.21",difficulty:2,q:"Deduce the order in iodine for the acid-catalysed iodination of propanone: the rate is first order in propanone and H<sup>+</sup>, but ______ order in iodine.",answer:"zero",distractors:["first","second","third"],a:"Iodine is not in the rate-determining step, so the reaction is <b>zero order</b> in I<sub>2</sub>."},{id:"l4-18",section:4,qtype:"Deduce",spec:["11.6ii"],source:"Kinetics 5, p.21",difficulty:3,q:"Deduce the species in the rate-determining step from rate = k[propanone][H<sup>+</sup>]: the species are ______.",answer:"propanone and H<sup>+</sup>",distractors:["propanone and iodine","iodine and H<sup>+</sup>","propanone, iodine and H<sup>+</sup>"],a:"Only propanone and H<sup>+</sup> appear in the rate equation, so they collide in the slow step; iodine enters in a later fast step."},{id:"l4-19",section:4,qtype:"Deduce",spec:["11.6iii"],source:"Kinetics 5, p.21",difficulty:3,q:"Deduce the intermediate formed in the slow step of the acid-catalysed iodination: protonation of the carbonyl oxygen leads to an ______.",answer:"enol",distractors:["carbanion","carbocation","iodide ion"],a:"Acid catalyses <b>enolisation</b>; the enol then reacts rapidly with iodine, which is why iodine is zero order."},{id:"l5-13",section:5,qtype:"Explain",spec:["11.9"],source:"Kinetics 3, p.4",difficulty:2,q:"Explain the evidence for SN1 from the rate equation: first order in the halogenoalkane and zero order in OH<sup>&minus;</sup> supports an ______ mechanism.",answer:"SN1",distractors:["SN2","E1","E2"],a:"The slow step is ionisation to a carbocation, so OH<sup>&minus;</sup> is not in the rate equation: <b>SN1</b>."},{id:"l5-14",section:5,qtype:"Explain",spec:["11.9"],source:"Kinetics 3, p.4",difficulty:2,q:"Explain the evidence for SN2 from the rate equation: first order in both the halogenoalkane and OH<sup>&minus;</sup> supports an ______ mechanism.",answer:"SN2",distractors:["SN1","E1","E2"],a:"Both species appear in the rate-determining step, so the mechanism is <b>SN2</b>."},{id:"l7-12",section:7,qtype:"Select",spec:["11.3iii"],source:"Kinetics 1, p.1",difficulty:1,q:"Select a technique for a gas-producing reaction: measure the change in ______ with time.",answer:"mass",distractors:["colour","pH","conductivity"],a:"If gas escapes, the mass of the flask and contents falls. Measure the <b>mass change</b> on a balance."},{id:"l7-13",section:7,qtype:"Describe",spec:["11.4ii"],source:"Kinetics 1, p.1",difficulty:2,q:"Describe continuous monitoring: concentration&ndash;time or volume&ndash;time data are collected by measuring ______ during the reaction.",answer:"at regular intervals",distractors:["only at the start","only at the end","after quenching"],a:"Continuous monitoring records progress <b>at regular intervals</b>, giving a full concentration&ndash;time or volume&ndash;time curve."},{id:"l7-14",section:7,qtype:"Describe",spec:["11.12"],source:"Kinetics 5, p.22",difficulty:2,q:"Describe how the iodine clock measures initial rate: the time to the first blue colour is used as a measure of the ______ rate.",answer:"initial",distractors:["average","final","maximum"],a:"The clock reaction approximates the <b>initial-rate</b> method: measure the time to a fixed colour change."},{id:"l8-12",section:8,qtype:"Describe",spec:["11.12"],source:"Kinetics 5, p.21",difficulty:2,q:"Describe how the iodine&ndash;propanone reaction is followed in Core practical 9a: titrate the remaining iodine with ______.",answer:"sodium thiosulfate",distractors:["sodium hydroxide","potassium manganate(VII)","hydrochloric acid"],a:"Samples are quenched and the remaining iodine is titrated with <b>sodium thiosulfate</b>."},{id:"l9-11",section:9,qtype:"Describe",spec:["11.13"],source:"Kinetics 5, p.22",difficulty:2,q:"Describe how Core practical 10 finds activation energy: plot ______ against 1/T.",answer:"ln(rate)",distractors:["rate","1/rate","rate against temperature"],a:"For a fixed concentration, rate is proportional to k, so <b>ln(rate)</b> against 1/T has gradient &minus;Ea/R."},{id:"l11-01",section:11,qtype:"Define",spec:["14.1"],source:"Acid-base I, p.1",difficulty:1,q:"Define a Br&oslash;nsted&ndash;Lowry acid: a proton ______; a Br&oslash;nsted&ndash;Lowry base is a proton acceptor.",answer:"donor",distractors:["acceptor","remover","carrier"],a:"A Brønsted&ndash;Lowry acid is a <b>proton donor</b>; a base is a proton acceptor."},{id:"l11-02",section:11,qtype:"Describe",spec:["14.1"],source:"Acid-base I, p.1",difficulty:1,q:"Describe proton transfer in an acid&ndash;base reaction: a proton is transferred from the acid to the ______.",answer:"base",distractors:["acid","solvent","salt"],a:"Acid&ndash;base reactions involve <b>proton transfer</b> from the acid to the base."},{id:"l11-03",section:11,qtype:"Define",spec:["14.2"],source:"Acid-base I, p.1",difficulty:2,q:"Define a conjugate acid&ndash;base pair: it differs by one ______.",answer:"H<sup>+</sup>",distractors:["electron","OH<sup>&minus;</sup>","water molecule"],a:"A conjugate pair is formed by losing or gaining one <b>H<sup>+</sup></b> ion."},{id:"l11-04",section:11,qtype:"Identify",spec:["14.2"],source:"Acid-base I, p.2",difficulty:2,q:"Identify the conjugate base of HCO<sub>3</sub><sup>&minus;</sup>: ______.",answer:"CO<sub>3</sub><sup>2&minus;</sup>",distractors:["H<sub>2</sub>CO<sub>3</sub>","CO<sub>2</sub>","OH<sup>&minus;</sup>"],a:"Remove one H<sup>+</sup> from HCO<sub>3</sub><sup>&minus;</sup>: the conjugate base is <b>CO<sub>3</sub><sup>2&minus;</sup></b>."},{id:"l11-05",section:11,qtype:"Define",spec:["14.3"],source:"Acid-base I, p.2",difficulty:1,q:"Define pH: the negative logarithm to base 10 of the ______ ion concentration.",answer:"hydrogen",distractors:["hydroxide","hydronium only","salt"],a:"pH = &minus;log[H<sup>+</sup>], so it is the negative log of the <b>hydrogen</b> ion concentration."},{id:"l11-06",section:11,qtype:"Calculate",spec:["14.4"],source:"Acid-base I, p.3",difficulty:1,q:"Calculate the pH of 0.0100 mol dm<sup>&minus;3</sup> HCl at 25 &deg;C: ______.",answer:"2.00",distractors:["1.00","2.10","12.00"],a:"HCl is strong, so [H<sup>+</sup>] = 0.0100. pH = &minus;log(0.0100) = <b>2.00</b>."},{id:"l11-07",section:11,qtype:"Calculate",spec:["14.5"],source:"Acid-base I, p.3",difficulty:2,q:"Calculate [H<sup>+</sup>] for a solution of pH 3.50: ______ mol dm<sup>&minus;3</sup>.",answer:"3.16 &times; 10<sup>&minus;4</sup>",distractors:["3.50 &times; 10<sup>&minus;3</sup>","3.16 &times; 10<sup>&minus;3</sup>","1.00 &times; 10<sup>&minus;4</sup>"],a:"[H<sup>+</sup>] = 10<sup>&minus;pH</sup> = 10<sup>&minus;3.50</sup> = <b>3.16 &times; 10<sup>&minus;4</sup> mol dm<sup>&minus;3</sup></b>."},{id:"l11-08",section:11,qtype:"Explain",spec:["14.6"],source:"Acid-base I, p.2",difficulty:1,q:"Explain the difference between strong and weak acids: a strong acid dissociates ______ in water, whereas a weak acid dissociates only partially.",answer:"completely",distractors:["partially","not at all","reversibly"],a:"A strong acid is <b>completely</b> dissociated, so [H<sup>+</sup>] equals the acid concentration."},{id:"l11-09",section:11,qtype:"Calculate",spec:["14.7"],source:"Acid-base I, p.3",difficulty:1,q:"Calculate the pH of 0.0500 mol dm<sup>&minus;3</sup> HNO<sub>3</sub> at 25 &deg;C: ______.",answer:"1.30",distractors:["0.50","1.00","12.70"],a:"HNO<sub>3</sub> is strong, so pH = &minus;log(0.0500) = <b>1.30</b>."},{id:"l11-10",section:11,qtype:"Define",spec:["14.10"],source:"Acid-base I, p.4",difficulty:2,q:"Define the ionic product of water, K<sub>w</sub>: K<sub>w</sub> = ______.",answer:"[H<sup>+</sup>][OH<sup>&minus;</sup>]",distractors:["[H<sup>+</sup>]/[OH<sup>&minus;</sup>]","[OH<sup>&minus;</sup>]/[H<sup>+</sup>]","[H<sub>2</sub>O]"],a:"K<sub>w</sub> = <b>[H<sup>+</sup>][OH<sup>&minus;</sup>]</b>; at 25 &deg;C it is 1.00 &times; 10<sup>&minus;14</sup> mol<sup>2</sup> dm<sup>&minus;6</sup>."},{id:"l11-11",section:11,qtype:"Calculate",spec:["14.11"],source:"Acid-base I, p.5",difficulty:2,q:"Calculate the pH of 0.0100 mol dm<sup>&minus;3</sup> NaOH at 25 &deg;C: ______.",answer:"12.00",distractors:["2.00","12.10","13.00"],a:"[OH<sup>&minus;</sup>] = 0.0100, so pOH = 2.00 and pH = 14.00 &minus; 2.00 = <b>12.00</b>."},{id:"l11-12",section:11,qtype:"Calculate",spec:["14.11"],source:"Acid-base I, p.5",difficulty:3,q:"Calculate the pH of 0.0100 mol dm<sup>&minus;3</sup> Ba(OH)<sub>2</sub> at 25 &deg;C: ______.",answer:"12.30",distractors:["12.00","1.70","13.00"],a:"Ba(OH)<sub>2</sub> gives two OH<sup>&minus;</sup> ions: [OH<sup>&minus;</sup>] = 0.0200. pOH = 1.70, so pH = <b>12.30</b>."},{id:"l11-13",section:11,qtype:"Define",spec:["14.12"],source:"Acid-base I, p.4",difficulty:2,q:"Define pK<sub>w</sub>: pK<sub>w</sub> = ______.",answer:"&minus;log K<sub>w</sub>",distractors:["log K<sub>w</sub>","&minus;log[H<sup>+</sup>]","&minus;log[OH<sup>&minus;</sup>]"],a:"pK<sub>w</sub> = <b>&minus;log K<sub>w</sub></b>. At 25 &deg;C, pK<sub>w</sub> = 14.00, so pH + pOH = 14.00."},{id:"l11-14",section:11,qtype:"Compare",spec:["14.13i"],source:"Acid-base I, p.3",difficulty:2,q:"Compare the pH of 0.100 mol dm<sup>&minus;3</sup> HCl and 0.100 mol dm<sup>&minus;3</sup> ethanoic acid: ethanoic acid has a pH of about ______ because it is weak.",answer:"2.88",distractors:["1.00","7.00","13.00"],a:"Ethanoic acid is weak, so [H<sup>+</sup>] is much lower; 0.100 mol dm<sup>&minus;3</sup> CH<sub>3</sub>COOH gives pH <b>2.88</b>."},{id:"l11-15",section:11,qtype:"Compare",spec:["14.13i"],source:"Acid-base I, p.5",difficulty:2,q:"Compare the pH of 0.100 mol dm<sup>&minus;3</sup> NaOH and 0.100 mol dm<sup>&minus;3</sup> ammonia: ammonia has a pH of about ______.",answer:"11.1",distractors:["13.0","7.0","1.0"],a:"Ammonia is a weak base, so it produces fewer OH<sup>&minus;</sup> ions; 0.100 mol dm<sup>&minus;3</sup> NH<sub>3</sub> has pH about <b>11.1</b>."},{id:"l12-01",section:12,qtype:"Deduce",spec:["14.8"],source:"Acid-base II, p.1",difficulty:2,q:"Deduce the K<sub>a</sub> expression for a weak acid HA: K<sub>a</sub> = ______.",answer:"[H<sup>+</sup>][A<sup>&minus;</sup>]/[HA]",distractors:["[HA]/[H<sup>+</sup>][A<sup>&minus;</sup>]","[H<sup>+</sup>]/[HA]","[A<sup>&minus;</sup>]/[HA]"],a:"K<sub>a</sub> = <b>[H<sup>+</sup>][A<sup>&minus;</sup>]/[HA]</b> for HA &rlarr; H<sup>+</sup> + A<sup>&minus;</sup>."},{id:"l12-02",section:12,qtype:"State",spec:["14.8"],source:"Acid-base II, p.1",difficulty:2,q:"State the units of K<sub>a</sub> for a weak monoprotic acid: ______.",answer:"mol dm<sup>&minus;3</sup>",distractors:["mol<sup>2</sup> dm<sup>&minus;6</sup>","dm<sup>3</sup> mol<sup>&minus;1</sup>","no units"],a:"K<sub>a</sub> has units of concentration: <b>mol dm<sup>&minus;3</sup></b>."},{id:"l12-03",section:12,qtype:"Define",spec:["14.12"],source:"Acid-base II, p.2",difficulty:1,q:"Define pK<sub>a</sub>: pK<sub>a</sub> = ______.",answer:"&minus;log K<sub>a</sub>; stronger",distractors:["log K<sub>a</sub>; stronger","&minus;log K<sub>a</sub>; weaker","log K<sub>a</sub>; weaker"],a:"pK<sub>a</sub> = <b>&minus;log K<sub>a</sub></b>. A lower pK<sub>a</sub> means a larger K<sub>a</sub>, so the acid is stronger."},{id:"l12-04",section:12,qtype:"State",spec:["14.9"],source:"Acid-base II, p.3",difficulty:2,q:"State the weak-acid assumption about [HA]: [HA]<sub>eq</sub> &asymp; ______ because the acid is only slightly dissociated.",answer:"[HA]<sub>initial</sub>",distractors:["[H<sup>+</sup>]","[A<sup>&minus;</sup>]","0"],a:"For a weak acid, the amount dissociated is tiny, so <b>[HA]<sub>eq</sub> &asymp; [HA]<sub>initial</sub></b>."},{id:"l12-05",section:12,qtype:"State",spec:["14.9"],source:"Acid-base II, p.3",difficulty:2,q:"State the weak-acid assumption about [H<sup>+</sup>]: [H<sup>+</sup>] &asymp; ______, ignoring H<sup>+</sup> from water.",answer:"[A<sup>&minus;</sup>]",distractors:["[HA]","[OH<sup>&minus;</sup>]","K<sub>a</sub>"],a:"The acid produces equal amounts of H<sup>+</sup> and A<sup>&minus;</sup>, so <b>[H<sup>+</sup>] &asymp; [A<sup>&minus;</sup>]</b>."},{id:"l12-06",section:12,qtype:"State",spec:["14.9"],source:"Acid-base II, p.4",difficulty:2,q:"State the weak-acid formula for [H<sup>+</sup>]: [H<sup>+</sup>] = ______.",answer:"&radic;(K<sub>a</sub> &times; C<sub>0</sub>)",distractors:["K<sub>a</sub> &times; C<sub>0</sub>","K<sub>a</sub>/C<sub>0</sub>","C<sub>0</sub>/K<sub>a</sub>"],a:"[H<sup>+</sup>] = <b>&radic;(K<sub>a</sub> &times; C<sub>0</sub>)</b>, where C<sub>0</sub> is the initial acid concentration."},{id:"l12-07",section:12,qtype:"Calculate",spec:["14.9"],source:"Acid-base II, p.3",difficulty:3,q:"Calculate the pH of 0.100 mol dm<sup>&minus;3</sup> CH<sub>3</sub>COOH (K<sub>a</sub> = 1.7 &times; 10<sup>&minus;5</sup>): ______.",answer:"2.88",distractors:["1.00","2.00","4.77"],a:"[H<sup>+</sup>] = &radic;(1.7 &times; 10<sup>&minus;5</sup> &times; 0.100) = 1.30 &times; 10<sup>&minus;3</sup>; pH = <b>2.88</b>."},{id:"l12-08",section:12,qtype:"Calculate",spec:["14.9"],source:"Acid-base II, p.4",difficulty:3,q:"Calculate the pH of 0.200 mol dm<sup>&minus;3</sup> methanoic acid (K<sub>a</sub> = 1.6 &times; 10<sup>&minus;4</sup>): ______.",answer:"2.25",distractors:["1.00","2.00","3.70"],a:"[H<sup>+</sup>] = &radic;(1.6 &times; 10<sup>&minus;4</sup> &times; 0.200) = 5.66 &times; 10<sup>&minus;3</sup>; pH = <b>2.25</b>."},{id:"l12-09",section:12,qtype:"Calculate",spec:["14.14"],source:"Acid-base II, p.4",difficulty:3,q:"Calculate K<sub>a</sub> for a 0.150 mol dm<sup>&minus;3</sup> weak acid HA of pH 4.38: ______ mol dm<sup>&minus;3</sup>.",answer:"1.16 &times; 10<sup>&minus;8</sup>",distractors:["4.17 &times; 10<sup>&minus;5</sup>","2.78 &times; 10<sup>&minus;7</sup>","1.16 &times; 10<sup>&minus;6</sup>"],a:"[H<sup>+</sup>] = 10<sup>&minus;4.38</sup> = 4.17 &times; 10<sup>&minus;5</sup>. K<sub>a</sub> = (4.17 &times; 10<sup>&minus;5</sup>)<sup>2</sup>/0.150 = <b>1.16 &times; 10<sup>&minus;8</sup></b>."},{id:"l12-10",section:12,qtype:"Calculate",spec:["14.14"],source:"Acid-base II, p.5",difficulty:3,q:"Calculate K<sub>a</sub>: 1.056 g of acid HA (M<sub>r</sub> = 88) is dissolved to make 100 cm<sup>3</sup> of solution of pH 3.26. K<sub>a</sub> = ______ mol dm<sup>&minus;3</sup>.",answer:"2.52 &times; 10<sup>&minus;6</sup>",distractors:["5.50 &times; 10<sup>&minus;4</sup>","2.52 &times; 10<sup>&minus;5</sup>","3.02 &times; 10<sup>&minus;7</sup>"],a:"n = 1.056/88 = 0.0120 mol, C = 0.120 mol dm<sup>&minus;3</sup>; [H<sup>+</sup>] = 5.50 &times; 10<sup>&minus;4</sup>; K<sub>a</sub> = (5.50 &times; 10<sup>&minus;4</sup>)<sup>2</sup>/0.120 = <b>2.52 &times; 10<sup>&minus;6</sup></b>."},{id:"l12-11",section:12,qtype:"Calculate",spec:["14.14"],source:"Acid-base II, p.4",difficulty:3,q:"Calculate the concentration of propanoic acid: pH = 3.52 and K<sub>a</sub> = 1.35 &times; 10<sup>&minus;5</sup>. Concentration = ______ mol dm<sup>&minus;3</sup>.",answer:"6.76 &times; 10<sup>&minus;3</sup>",distractors:["3.02 &times; 10<sup>&minus;4</sup>","1.35 &times; 10<sup>&minus;5</sup>","0.149"],a:"[H<sup>+</sup>] = 3.02 &times; 10<sup>&minus;4</sup>; C = [H<sup>+</sup>]<sup>2</sup>/K<sub>a</sub> = (3.02 &times; 10<sup>&minus;4</sup>)<sup>2</sup>/(1.35 &times; 10<sup>&minus;5</sup>) = <b>6.76 &times; 10<sup>&minus;3</sup></b>."},{id:"l12-12",section:12,qtype:"Predict",spec:["14.13ii"],source:"Acid-base II, p.4",difficulty:2,q:"Predict the pH change when a weak acid is diluted by a factor of 10: the pH rises by about ______, not 1.",answer:"0.5",distractors:["1.0","2.0","0.1"],a:"For a weak acid, [H<sup>+</sup>] &prop; &radic;C, so a 10-fold dilution lowers [H<sup>+</sup>] by about 3.16 and raises pH by <b>0.5</b>."},{id:"l12-13",section:12,qtype:"Predict",spec:["14.13ii"],source:"Acid-base II, p.4",difficulty:3,q:"Predict the pH change when a weak acid is diluted by a factor of 1000: the pH rises by about ______, whereas a strong acid would rise by 3.",answer:"1.5",distractors:["3.0","0.5","2.0"],a:"A 1000-fold dilution changes [H<sup>+</sup>] by &radic;1000 &asymp; 31.6, so pH rises by log(31.6) = <b>1.5</b>."},{id:"l12-14",section:12,qtype:"Describe",spec:["14.23"],source:"Acid-base II, p.5",difficulty:2,q:"Describe how Core practical 11 finds K<sub>a</sub>: measure the pH of a solution of ______ concentration.",answer:"known",distractors:["unknown","zero","buffer"],a:"Prepare a solution of <b>known</b> concentration, measure its pH, convert pH to [H<sup>+</sup>] and use K<sub>a</sub> = [H<sup>+</sup>]<sup>2</sup>/[HA]."},{id:"l12-15",section:12,qtype:"Explain",spec:["14.9"],source:"Acid-base II, p.3",difficulty:2,q:"Explain why the weak-acid approximations are useful: they avoid solving a ______ equation.",answer:"quadratic",distractors:["linear","simultaneous","differential"],a:"The assumptions let us use [H<sup>+</sup>] = &radic;(K<sub>a</sub>C<sub>0</sub>) instead of solving a <b>quadratic</b> equation."},{id:"l12-16",section:12,qtype:"State",spec:["14.9"],source:"Acid-base II, p.2",difficulty:2,q:"State what a larger K<sub>a</sub> means about acid strength: the acid is ______.",answer:"stronger; lower",distractors:["weaker; lower","stronger; higher","weaker; higher"],a:"Larger K<sub>a</sub> = more dissociation = <b>stronger acid</b>; pK<sub>a</sub> = &minus;log K<sub>a</sub> is therefore <b>lower</b>."},{id:"l13-01",section:13,qtype:"Define",spec:["14.17"],source:"Acid-base III, p.1",difficulty:1,q:"Define a buffer solution: it resists a change in ______ when small amounts of acid or alkali are added.",answer:"pH",distractors:["temperature","volume","colour"],a:"A buffer <b>resists pH change</b> on addition of small amounts of H<sup>+</sup> or OH<sup>&minus;</sup>."},{id:"l13-02",section:13,qtype:"Explain",spec:["14.17"],source:"Acid-base III, p.1",difficulty:2,q:"Explain the condition for a good buffer: the amounts of both the acid and its conjugate base must be ______ compared with the added H<sup>+</sup> or OH<sup>&minus;</sup>.",answer:"large",distractors:["small","equal to zero","catalytic"],a:"Both components must be present in <b>large</b> amounts so the ratio changes only slightly."},{id:"l13-03",section:13,qtype:"Describe",spec:["14.18"],source:"Acid-base III, p.1",difficulty:2,q:"Describe how an acidic buffer is made: from a weak acid and its conjugate base in the form of a ______.",answer:"salt",distractors:["strong acid","strong base","gas"],a:"Ethanoic acid and sodium ethanoate form an <b>acidic buffer</b>: weak acid + conjugate base salt."},{id:"l13-04",section:13,qtype:"Describe",spec:["14.18"],source:"Acid-base III, p.2",difficulty:2,q:"Describe how an alkaline buffer is made: from a weak base and its conjugate acid in the form of a ______.",answer:"salt",distractors:["strong base","strong acid","metal"],a:"Ammonia and ammonium chloride form an <b>alkaline buffer</b>: weak base + conjugate acid salt."},{id:"l13-05",section:13,qtype:"Explain",spec:["14.18"],source:"Acid-base III, p.2",difficulty:2,q:"Explain the common-ion effect in an acidic buffer: CH<sub>3</sub>COO<sup>&minus;</sup> suppresses the ionisation of ______.",answer:"CH<sub>3</sub>COOH",distractors:["Na<sup>+</sup>","H<sub>2</sub>O","OH<sup>&minus;</sup>"],a:"The common ion shifts CH<sub>3</sub>COOH &rlarr; CH<sub>3</sub>COO<sup>&minus;</sup> + H<sup>+</sup> to the left, suppressing ionisation of <b>CH<sub>3</sub>COOH</b>."},{id:"l13-06",section:13,qtype:"Explain",spec:["14.18"],source:"Acid-base III, p.3",difficulty:2,q:"Explain how an ethanoate buffer removes added H<sup>+</sup>: H<sup>+</sup> reacts with ______.",answer:"CH<sub>3</sub>COO<sup>&minus;</sup>",distractors:["CH<sub>3</sub>COOH","Na<sup>+</sup>","H<sub>2</sub>O"],a:"H<sup>+</sup> + CH<sub>3</sub>COO<sup>&minus;</sup> &rarr; CH<sub>3</sub>COOH; the H<sup>+</sup> is removed and pH changes only slightly."},{id:"l13-07",section:13,qtype:"Explain",spec:["14.18"],source:"Acid-base III, p.3",difficulty:2,q:"Explain how an ethanoate buffer removes added OH<sup>&minus;</sup>: OH<sup>&minus;</sup> reacts with ______.",answer:"CH<sub>3</sub>COOH",distractors:["CH<sub>3</sub>COO<sup>&minus;</sup>","Na<sup>+</sup>","H<sub>3</sub>O<sup>+</sup>"],a:"OH<sup>&minus;</sup> + CH<sub>3</sub>COOH &rarr; CH<sub>3</sub>COO<sup>&minus;</sup> + H<sub>2</sub>O; the OH<sup>&minus;</sup> is removed."},{id:"l13-08",section:13,qtype:"Deduce",spec:["14.19"],source:"Acid-base III, p.5",difficulty:2,q:"Deduce the buffer equation for [H<sup>+</sup>]: [H<sup>+</sup>] = K<sub>a</sub> &times; ______.",answer:"[acid]/[conjugate base]",distractors:["[conjugate base]/[acid]","[acid] &times; [conjugate base]","[salt]/[water]"],a:"Rearranging K<sub>a</sub> gives <b>[H<sup>+</sup>] = K<sub>a</sub> &times; [acid]/[conjugate base]</b>."},{id:"l13-09",section:13,qtype:"Calculate",spec:["14.19"],source:"Acid-base III, p.5",difficulty:3,q:"Calculate the pH of a buffer containing 0.100 mol dm<sup>&minus;3</sup> CH<sub>3</sub>COOH and 0.150 mol dm<sup>&minus;3</sup> CH<sub>3</sub>COO<sup>&minus;</sup> (K<sub>a</sub> = 1.7 &times; 10<sup>&minus;5</sup>): ______.",answer:"4.95",distractors:["4.77","5.13","4.83"],a:"[H<sup>+</sup>] = 1.7 &times; 10<sup>&minus;5</sup> &times; (0.100/0.150) = 1.13 &times; 10<sup>&minus;5</sup>; pH = <b>4.95</b>."},{id:"l13-10",section:13,qtype:"Calculate",spec:["14.19"],source:"Acid-base III, p.6",difficulty:3,q:"Calculate the pH of a solution containing 0.100 mol dm<sup>&minus;3</sup> NH<sub>3</sub> and 0.0500 mol dm<sup>&minus;3</sup> NH<sub>4</sub><sup>+</sup> (K<sub>a</sub> of NH<sub>4</sub><sup>+</sup> = 5.62 &times; 10<sup>&minus;10</sup>): ______.",answer:"9.55",distractors:["9.25","10.05","4.75"],a:"[H<sup>+</sup>] = 5.62 &times; 10<sup>&minus;10</sup> &times; (0.0500/0.100) = 2.81 &times; 10<sup>&minus;10</sup>; pH = <b>9.55</b>."},{id:"l13-11",section:13,qtype:"State",spec:["14.20"],source:"Acid-base III, p.2",difficulty:2,q:"State the pH of a buffer made from equal concentrations of acid and conjugate base: pH = ______.",answer:"pK<sub>a</sub>",distractors:["pK<sub>w</sub>","pH of water","pOH"],a:"If [acid] = [conjugate base], [H<sup>+</sup>] = K<sub>a</sub>, so <b>pH = pK<sub>a</sub></b>."},{id:"l13-12",section:13,qtype:"Calculate",spec:["14.20"],source:"Acid-base IV, p.1",difficulty:3,q:"Calculate the ethanoate concentration needed to make a buffer of pH 4.35 from 0.150 mol dm<sup>&minus;3</sup> ethanoic acid (K<sub>a</sub> = 1.7 &times; 10<sup>&minus;5</sup>): ______ mol dm<sup>&minus;3</sup>.",answer:"0.0571",distractors:["0.150","0.394","1.70 &times; 10<sup>&minus;5</sup>"],a:"[H<sup>+</sup>] = 4.47 &times; 10<sup>&minus;5</sup>; [salt] = K<sub>a</sub>[acid]/[H<sup>+</sup>] = <b>0.0571</b> mol dm<sup>&minus;3</sup>."},{id:"l13-13",section:13,qtype:"Describe",spec:["14.20"],source:"Acid-base III, p.7",difficulty:3,q:"Describe how a buffer can be made by partial neutralisation: adding a strong base to a weak acid partially ______ the weak acid.",answer:"neutralises",distractors:["oxidises","reduces","precipitates"],a:"The strong base converts some weak acid into its conjugate base, so both buffer components are present."},{id:"l13-14",section:13,qtype:"State",spec:["14.22i"],source:"Acid-base V, p.15",difficulty:2,q:"State the main buffer system in blood: H<sub>2</sub>CO<sub>3</sub>/______.",answer:"HCO<sub>3</sub><sup>&minus;</sup>",distractors:["CO<sub>3</sub><sup>2&minus;</sup>","CO<sub>2</sub>","H<sub>2</sub>O"],a:"The carbonic acid/hydrogencarbonate buffer keeps blood pH close to <b>7.4</b>."},{id:"l13-15",section:13,qtype:"Explain",spec:["14.22i"],source:"Acid-base V, p.15",difficulty:2,q:"Explain why buffers are important in cells: enzymes and other proteins only work within a narrow ______ range.",answer:"pH",distractors:["temperature","pressure","concentration"],a:"Buffers maintain a narrow <b>pH</b> range inside cells and in blood."},{id:"l13-16",section:13,qtype:"Explain",spec:["14.22ii"],source:"Acid-base V, p.15",difficulty:2,q:"Explain why buffers are added to foods: they prevent pH changes caused by ______ or fungal activity.",answer:"bacterial",distractors:["radioactive","catalytic","oxidative"],a:"Food buffers slow pH changes caused by <b>bacterial</b> or fungal growth."},{id:"l14-01",section:14,qtype:"Predict",spec:["14.13i"],source:"Acid-base IV, p.3",difficulty:2,q:"Predict the pH of sodium ethanoate solution: it is a salt of a weak acid and a strong base, so its solution is ______.",answer:"alkaline",distractors:["acidic","neutral","strongly acidic"],a:"CH<sub>3</sub>COO<sup>&minus;</sup> hydrolyses to produce OH<sup>&minus;</sup>, so the solution is <b>alkaline</b>."},{id:"l14-02",section:14,qtype:"Deduce",spec:["14.13i"],source:"Acid-base IV, p.3",difficulty:2,q:"Deduce the hydrolysis equation for ethanoate ions: CH<sub>3</sub>COO<sup>&minus;</sup> + H<sub>2</sub>O &rlarr; ______ + OH<sup>&minus;</sup>.",answer:"CH<sub>3</sub>COOH",distractors:["CH<sub>3</sub>COONa","H<sub>3</sub>O<sup>+</sup>","CO<sub>2</sub>"],a:"The conjugate base takes a proton from water: <b>CH<sub>3</sub>COO<sup>&minus;</sup> + H<sub>2</sub>O &rlarr; CH<sub>3</sub>COOH + OH<sup>&minus;</sup></b>."},{id:"l14-03",section:14,qtype:"Predict",spec:["14.13i"],source:"Acid-base IV, p.4",difficulty:2,q:"Predict the pH of ammonium chloride solution: it is a salt of a weak base and a strong acid, so its solution is ______.",answer:"acidic",distractors:["alkaline","neutral","strongly alkaline"],a:"NH<sub>4</sub><sup>+</sup> hydrolyses to produce H<sub>3</sub>O<sup>+</sup>, so the solution is <b>acidic</b>."},{id:"l14-04",section:14,qtype:"Deduce",spec:["14.13i"],source:"Acid-base IV, p.4",difficulty:2,q:"Deduce the hydrolysis equation for ammonium ions: NH<sub>4</sub><sup>+</sup> + H<sub>2</sub>O &rlarr; ______ + H<sub>3</sub>O<sup>+</sup>.",answer:"NH<sub>3</sub>",distractors:["NH<sub>4</sub>Cl","OH<sup>&minus;</sup>","HCl"],a:"NH<sub>4</sub><sup>+</sup> + H<sub>2</sub>O &rlarr; <b>NH<sub>3</sub></b> + H<sub>3</sub>O<sup>+</sup>."},{id:"l14-05",section:14,qtype:"Predict",spec:["14.13i"],source:"Acid-base IV, p.4",difficulty:1,q:"Predict the pH of NaCl solution: a salt of a strong acid and a strong base gives a ______ solution.",answer:"neutral",distractors:["acidic","alkaline","buffered"],a:"Na<sup>+</sup> and Cl<sup>&minus;</sup> do not hydrolyse appreciably, so NaCl(aq) is <b>neutral</b>, pH 7."},{id:"l14-06",section:14,qtype:"Predict",spec:["14.13i"],source:"Acid-base IV, p.5",difficulty:2,q:"Predict the pH of CH<sub>3</sub>COONH<sub>4</sub> solution: a salt of a weak acid and a weak base gives a solution with pH approximately ______.",answer:"7",distractors:["1","13","10"],a:"Both ions hydrolyse, so the pH is close to <b>7</b>, although it may be slightly acidic or alkaline depending on the constants."},{id:"l14-07",section:14,qtype:"Define",spec:["14.16"],source:"Acid-base IV, p.5",difficulty:2,q:"Define an acid&ndash;base indicator: it is a weak ______, HIn, with different colours for HIn and In<sup>&minus;</sup>.",answer:"acid",distractors:["base","salt","oxidising agent"],a:"HIn &rlarr; H<sup>+</sup> + In<sup>&minus;</sup>; the two forms have different colours."},{id:"l14-08",section:14,qtype:"Deduce",spec:["14.16"],source:"Acid-base IV, p.6",difficulty:2,q:"Deduce the pH at the end point of an indicator: when [HIn] = [In<sup>&minus;</sup>], pH = ______.",answer:"pK<sub>In</sub>",distractors:["pK<sub>w</sub>","pK<sub>a</sub> of the acid being titrated","7"],a:"When [HIn] = [In<sup>&minus;</sup>], [H<sup>+</sup>] = K<sub>In</sub>, so pH = <b>pK<sub>In</sub></b>."},{id:"l14-09",section:14,qtype:"State",spec:["14.16"],source:"Acid-base IV, p.6",difficulty:2,q:"State the pH range and use of methyl orange: it changes over approximately pH ______ and is suitable for a strong acid&ndash;weak base titration.",answer:"3.1&ndash;4.4",distractors:["8.3&ndash;10.0","6.0&ndash;7.0","1.0&ndash;2.0"],a:"Methyl orange has a low pH range of about <b>3.1&ndash;4.4</b>, matching the acidic equivalence point of a strong acid&ndash;weak base titration."},{id:"l14-10",section:14,qtype:"State",spec:["14.16"],source:"Acid-base IV, p.6",difficulty:2,q:"State the pH range and use of phenolphthalein: it changes over approximately pH ______ and is suitable for a weak acid&ndash;strong base titration.",answer:"8.3&ndash;10.0",distractors:["3.1&ndash;4.4","6.0&ndash;7.0","1.0&ndash;2.0"],a:"Phenolphthalein has a high pH range of about <b>8.3&ndash;10.0</b>, matching the alkaline equivalence point of a weak acid&ndash;strong base titration."},{id:"l14-11",section:14,qtype:"Select",spec:["14.16"],source:"Acid-base IV, p.6",difficulty:2,q:"Select a suitable indicator for a strong acid&ndash;strong base titration: the vertical section is around pH 7, so ______ indicator is suitable.",answer:"any",distractors:["no","only methyl orange","only phenolphthalein"],a:"The pH jump is very large, so <b>any</b> indicator whose range falls within the vertical section can be used."},{id:"l14-12",section:14,qtype:"Select",spec:["14.16"],source:"Acid-base IV, p.8",difficulty:2,q:"Select a suitable indicator for a weak acid&ndash;weak base titration: there is no sharp pH jump, so there is ______ suitable indicator.",answer:"no",distractors:["one","always a","only one"],a:"The pH changes gradually at equivalence, so <b>no</b> normal indicator gives a sharp end point."},{id:"l14-13",section:14,qtype:"Distinguish",spec:["14.16"],source:"Acid-base IV, p.6",difficulty:2,q:"Distinguish the end point from the equivalence point: the indicator changes colour at the ______ point.",answer:"end",distractors:["equivalence","buffer","neutralisation"],a:"The indicator changes colour at the <b>end point</b>; it should coincide with the equivalence point."},{id:"l15-01",section:15,qtype:"Interpret",spec:["14.15"],source:"Acid-base IV, p.7",difficulty:2,q:"Interpret the strong acid&ndash;strong base titration curve: it starts at low pH and has a sharp vertical section at pH ______.",answer:"7",distractors:["2","10","13"],a:"The equivalence point of a strong acid&ndash;strong base titration is at pH <b>7</b>."},{id:"l15-02",section:15,qtype:"Interpret",spec:["14.15"],source:"Acid-base IV, p.8",difficulty:2,q:"Interpret the weak acid&ndash;strong base titration curve: it has a buffer region and equivalence pH ______ 7.",answer:"above",distractors:["below","equal to","exactly at"],a:"The salt of a weak acid and strong base is alkaline, so the equivalence pH is <b>above 7</b> (about 8&ndash;9)."},{id:"l15-03",section:15,qtype:"Interpret",spec:["14.15"],source:"Acid-base IV, p.8",difficulty:2,q:"Interpret the strong acid&ndash;weak base titration curve: it has equivalence pH ______ 7.",answer:"below",distractors:["above","equal to","exactly at"],a:"The salt of a strong acid and weak base is acidic, so the equivalence pH is <b>below 7</b> (about 5)."},{id:"l15-04",section:15,qtype:"Interpret",spec:["14.15"],source:"Acid-base V, p.8",difficulty:2,q:"Interpret the weak acid&ndash;weak base titration curve: it has ______ sharp pH jump at the equivalence point.",answer:"no",distractors:["a large","a small but sharp","two"],a:"There are two buffer regions and no sharp jump, so the end point is hard to detect with an indicator."},{id:"l15-05",section:15,qtype:"Calculate",spec:["14.15"],source:"Acid-base IV, p.9",difficulty:2,q:"Calculate the initial pH when sketching a weak acid&ndash;strong base curve: use [H<sup>+</sup>] = ______.",answer:"&radic;(K<sub>a</sub>C<sub>0</sub>)",distractors:["K<sub>a</sub>C<sub>0</sub>","K<sub>a</sub>/C<sub>0</sub>","C<sub>0</sub>"],a:"Before any base is added, the weak acid pH is found from <b>&radic;(K<sub>a</sub>C<sub>0</sub>)</b>."},{id:"l15-06",section:15,qtype:"Describe",spec:["14.15"],source:"Acid-base IV, p.9",difficulty:2,q:"Describe how to find the final pH when sketching a titration curve: it is limited by the pH of the ______ reagent.",answer:"excess",distractors:["first","buffer","salt"],a:"The curve cannot go beyond the pH of the <b>excess</b> acid or base added from the burette."},{id:"l15-07",section:15,qtype:"Deduce",spec:["14.15"],source:"Acid-base IV, p.9",difficulty:2,q:"Deduce the equivalence volume: use ______ = a/b.",answer:"M<sub>a</sub>V<sub>a</sub>/M<sub>b</sub>V<sub>b</sub>",distractors:["M<sub>a</sub>V<sub>b</sub>/M<sub>b</sub>V<sub>a</sub>","M<sub>a</sub>M<sub>b</sub>/V<sub>a</sub>V<sub>b</sub>","V<sub>a</sub>/V<sub>b</sub>"],a:"Use <b>M<sub>a</sub>V<sub>a</sub>/M<sub>b</sub>V<sub>b</sub> = a/b</b>, where a/b is the stoichiometric ratio."},{id:"l15-08",section:15,qtype:"State",spec:["14.15"],source:"Acid-base IV, p.9",difficulty:2,q:"State the half-neutralisation volume in terms of the equivalence volume: it is ______ the equivalence volume.",answer:"half",distractors:["twice","equal to","one quarter of"],a:"At half-neutralisation, half the acid has been neutralised, so the volume
