sub>4</sub><sup>2&minus;</sup>, overall order 2.",keywords:["first","second|2|two","overall"],numerics:[],distractors:["First order with respect to each reactant; overall order 1.","Second order with respect to each reactant; overall order 4.","Zero order with respect to HgCl<sub>2</sub>, first order with respect to C<sub>2</sub>O<sub>4</sub><sup>2&minus;</sup>; overall 1."],prereqs:["e02","e05"]},{id:"e10",section:2,source:"Kinetics 1, p.5",difficulty:2,q:"For C<sub>2</sub>H<sub>4</sub> + I<sub>2</sub> &rarr; C<sub>2</sub>H<sub>4</sub>I<sub>2</sub>, the rate equation is rate = <i>k</i>[C<sub>2</sub>H<sub>4</sub>][I<sub>2</sub>]<sup>3/2</sup>. Give the order with respect to each reactant and the overall order.",a:"First order with respect to C<sub>2</sub>H<sub>4</sub>, three-halves order with respect to I<sub>2</sub>, overall order 5/2 (2.5).",keywords:["1|first","3/2|three-halves|1.5","5/2|2.5|two and a half"],numerics:[],distractors:["First order in each; overall order 2.","First order in C<sub>2</sub>H<sub>4</sub>, second order in I<sub>2</sub>; overall 3.","Three-halves order in C<sub>2</sub>H<sub>4</sub>, first order in I<sub>2</sub>; overall 5/2."],prereqs:["e02","e05"]},{id:"e11",section:2,source:"Kinetics 1, p.5",difficulty:3,q:"Substances P and Q react with an overall order of 3. Explain why the rate equation rate = <i>k</i>[P][Q]<sup>3</sup> cannot be correct.",a:"The individual orders add to 1 + 3 = 4, so this equation describes an overall order 4 reaction. For an overall order of 3, the individual orders must sum to 3.",keywords:["4|four","overall","sum|add|total"],numerics:[],distractors:["Because a concentration cannot be raised to a power higher than 2.","Because the orders must match the coefficients in the balanced equation.","Because a rate equation must include every reactant raised to the power 1."],prereqs:["e05"]},{id:"e12",section:2,source:"Kinetics 1, p.6",difficulty:3,q:"For S<sub>2</sub>O<sub>8</sub><sup>2&minus;</sup> + 2I<sup>&minus;</sup graph is linear for a first-order reaction, and what is k?",a:"ln[A] against time is a straight line with a negative slope, and <i>k</i> = &minus;slope. The other graphs are curved.",keywords:["ln[a]|ln [a]","straight|linear","minus|negative","slope"],numerics:[],distractors:["1/[A] against time is linear, with <i>k</i> = slope.","[A] against time is linear, with <i>k</i> = &minus;slope.","ln[A] against time is linear, with <i>k</i> = slope."],prereqs:["g01"]},{id:"g04",section:3,source:"Kinetics 1, p.7",difficulty:2,q:"Which graph is linear for a second-order reaction, and what is k?",a:"1/[A] against time is a straight line with a positive slope, and <i>k</i> = slope. The other graphs are curved.",keywords:["1/[a]","straight|linear","positive","slope"],numerics:[],distractors:["1/[A] against time is linear, with <i>k</i> = &minus;slope.","ln[A] against time is linear, with <i>k</i> = slope.","[A] against time is linear, with <i>k</i> = slope."],prereqs:["g01"]},{id:"g05",section:3,source:"Kinetics 1, p.6",difficulty:1,q:"What is the half-life of a reaction?",a:"The amount of time needed for the concentration of a reactant to decrease by half compared with its initial concentration.",keywords:["time","half|halve","concentration","initial"],numerics:[],distractors:["The time taken for the reaction to reach equilibrium.","The time taken for the rate constant to halve.","The time taken for half of the product to decompose."],prereqs:[]},{id:"g06",section:3,source:"Kinetics 1, p.8",difficulty:2,q:"What is special about the half-life of a first-order reaction?",a:"It is independent of the initial concentration, so the half-life of a first-order reaction is constant.",keywords:["independent|constant|same","initial concentration|concentration","first order|first-order"],numerics:[],distractors:["It halves every time the initial concentration is doubled.","It doubles as the reaction proceeds because the rate constant falls.","It is constant only when the initial concentration is above 1 mol dm<sup>&minus;3</sup>."],prereqs:["g05"]},{id:"g07",section:3,source:"Kinetics 1, p.8",difficulty:1,q:"What equation links the half-life of a first-order reaction to <i>k</i>?",a:"<i>t</i><sub>1/2</sub> = ln 2 / <i>k</i> &asymp; 0.693 / <i>k</i>",keywords:["ln 2|ln2|0.693","k","half-life|t1/2|t½"],numerics:[],distractors:["<i>t</i><sub>1/2</sub> = <i>k</i> / ln 2","<i>t</i><sub>1/2</sub> = 2 / <i>k</i>","<i>t</i><sub>1/2</sub> = ln 2 &times; <i>k</i>"],prereqs:["g06"]},{id:"g08",section:3,source:"Kinetics 1, p.9",difficulty:3,q:"The half-life of a first-order reaction is 10 min at a given temperature. Calculate <i>k</i> in s<sup>&minus;1</sup>.",a:"10 min = 600 s<br><i>k</i> = 0.693 / 600 = <b>1.15 &times; 10<sup>&minus;3</sup> s<sup>&minus;1</sup></b> (0.00115 s<sup>&minus;1</sup>)",keywords:["600","0.693|ln 2|ln2","s-1|s−1"],numerics:[{value:.00115,tol:1e-4,label:"k"}],distractors:["6.93 &times; 10<sup>&minus;3</sup> s<sup>&minus;1</sup> (forgot to convert minutes to seconds)","1.15 &times; 10<sup>&minus;3</sup> min<sup>&minus;1</sup>","1.44 &times; 10<sup>&minus;3</sup> s<sup>&minus;1</sup> (used 0.693 &times; 2)"],prereqs:["g07"]},{id:"g09",section:3,source:"Kinetics 1, p.9",difficulty:3,q:"3.0 g of A decomposes for 36 min, leaving 0.375 g of unreacted A. If the reaction is first order, what is its half-life?",a:"3.0 &rarr; 1.5 &rarr; 0.75 &rarr; 0.375 g is three half-lives.<br><i>t</i><sub>1/2</sub> = 36 / 3 = <b>12 min</b>",keywords:["12","three|3","half-lives|half life|halves"],numerics:[{value:12,tol:.5,label:"t1/2 / min"}],distractors:["18 min (two half-lives in 36 min)","9 min (four half-lives in 36 min)","36 min (the concentration halves once)"],prereqs:["g06"]},{id:"g10",section:3,source:"Kinetics 1, p.11",difficulty:3,q:"For the first-order decomposition of N<sub>2</sub>O<sub>5</sub>, an initial concentration of 2.00 mol dm<sup>&minus;3</sup> gives an initial rate of 2.10 &times; 10<sup>&minus;5</sup> mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup>. Calculate <i>k</i> and its units.",a:"rate = <i>k</i>[N<sub>2</sub>O<sub>5</sub>]<br><i>k</i> = 2.10 &times; 10<sup>&minus;5</sup> / 2.00 = <b>1.05 &times; 10<sup>&minus;5</sup> s<sup>&minus;1</sup></b>",keywords:["1.05|1.05e-5|1.05 x 10-5","s-1|s−1|per second"],numerics:[{value:105e-7,tol:2e-7,label:"k"}],distractors:["4.20 &times; 10<sup>&minus;5</sup> s<sup>&minus;1</sup>","1.05 &times; 10<sup>&minus;5</sup> mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup>","2.10 &times; 10<sup>&minus;5</sup> s<sup>&minus;1</sup>"],prereqs:["e01","g03"]},{id:"g11",section:3,source:"Kinetics 1, p.11",difficulty:3,q:"N<sub>2</sub>O<sub>5</sub> decomposes with first-order kinetics. Starting from 32 units at <i>t</i> = 0 with a half-life of 5 min, describe the concentration&ndash;time curve.",a:"An exponential decay curve: 32 &rarr; 16 &rarr; 8 &rarr; 4 &rarr; 2 units at 0, 5, 10, 15 and 20 min. The concentration halves every 5 minutes, whatever the starting concentration.",keywords:["exponential|curve|decay","halves|half","5","32"],numerics:[],distractors:["A straight line falling from 32 to 0 units in 5 minutes.","A curve that flattens at 16 units because the reaction reaches equilibrium.","A straight line from 32 units with a gradient of &minus;5 units per minute."],prereqs:["g06"]},{id:"g12",section:3,source:"Kinetics 1, p.11",difficulty:3,q:"Benzenediazonium chloride decomposes (first order), giving 80 cm<sup>3</sup> of N<sub>2</sub> on complete decomposition. 40 cm<sup>3</sup> is evolved in 40 min. How long until 70 cm<sup>3</sup> has been evolved?",a:"80 &rarr; 40 cm<sup>3</sup> left after one half-life, so <i>t</i><sub>1/2</sub> = 40 min.<br>70 cm<sup>3</sup> evolved leaves 10 cm<sup>3</sup> = 80/8, i.e. three half-lives.<br>3 &times; 40 = <b>120 min</b>",keywords:["120","40","three|3","half-lives|half life"],numerics:[{value:120,tol:1,label:"time / min"}],distractors:["80 min (two half-lives)","160 min (four half-lives)","100 min (70/80 of the total time)"],prereqs:["g06"]},{id:"g13",section:3,source:"Kinetics 1, p.10",difficulty:2,q:"A first-order decay is followed by measuring the concentration of X. Sketch the relationship between rate of decay and concentration of X.",a:"A straight line through the origin: for a first-order reaction rate = <i>k</i>[X], so the rate is directly proportional to the concentration.",keywords:["straight|linear","origin","proportional|∝"],numerics:[],distractors:["A horizontal line: the rate is independent of concentration.","An upward curve that steepens as [X] rises, because the order is 2.","A straight line with a positive intercept on the rate axis."],prereqs:["g03"]},{id:"i01",section:4,source:"Kinetics 2, p.1",difficulty:2,q:"What is the initial-rate method?",a:"A method of finding orders: carry out experiments in which the initial concentration of one reactant is varied while the others are kept constant, and measure the initial rate each time.",keywords:["initial rate","vary|change|one reactant|one at a time","constant|same","concentration"],numerics:[],distractors:["A method in which the reaction is allowed to go to completion and the final concentrations are measured.","A method of finding <i>k</i> by measuring the rate at several different temperatures.","A method in which all reactant concentrations are varied at once to save time."],prereqs:["e02"]},{id:"i02",section:4,source:"Kinetics 2, p.1",difficulty:2,q:"Using initial rates, what does doubling the concentration of X tell you?",a:"If the rate doubles, the reaction is first order in X. If the rate quadruples, it is second order. If the rate does not change, it is zero order.",keywords:["double|twice","first","quadruple|four","second","no change|unchanged|zero"],numerics:[],distractors:["Doubling the concentration always doubles the rate, whatever the order.","If the rate doubles, the reaction is second order in X.","If the rate stays the same, X must be a catalyst."],prereqs:["i01"]},{id:"i03",section:4,source:"Kinetics 2, p.1",difficulty:3,q:"From the NO/H<sub>2</sub> data at 700 &deg;C (expt 1: [H<sub>2</sub>] 0.010, [NO] 0.025, rate 2.4 &times; 10<sup>&minus;6</sup>; expt 2: [H<sub>2</sub>] 0.005, [NO] 0.025, rate 1.2 &times; 10<sup>&minus;6</sup>), what is the order with respect to H<sub>2</sub>?",a:"First order: halving [H<sub>2</sub>] from 0.010 to 0.005 halved the rate from 2.4 &times; 10<sup>&minus;6</sup> to 1.2 &times; 10<sup>&minus;6</sup> mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup>.",keywords:["first","halved|halving|half","rate"],numerics:[],distractors:["Second order: halving [H<sub>2</sub>] should quarter the rate.","Zero order: changing [H<sub>2</sub>] has no effect on the rate.","First order overall, which is the same as first order in H<sub>2</sub>."],prereqs:["i02"]},{id:"i04",section:4,source:"Kinetics 2, p.1",difficulty:3,q:"From the same NO/H<sub>2</sub> data (expt 1: [NO] 0.025, rate 2.4 &times; 10<sup>&minus;6</sup>; expt 3: [NO] 0.0125, rate 0.6 &times; 10<sup>&minus;6</sup>), what is the order with respect to NO?",a:"Second order: halving [NO] from 0.025 to 0.0125 quartered the rate from 2.4 &times; 10<sup>&minus;6</sup> to 0.6 &times; 10<sup>&minus;6</sup> mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup>.",keywords:["second","quarter|quartered|quater","halving|half"],numerics:[],distractors:["First order: halving [NO] halves the rate.","Zero order: the change in rate is caused by H<sub>2</sub> alone.","Second order overall, because two experiments were compared."],prereqs:["i02"]},{id:"i05",section:4,source:"Kinetics 2, p.1",difficulty:3,q:"Write the rate equation for the NO/H<sub>2</sub> reaction (first order in H<sub>2</sub>, second order in NO) and calculate <i>k</i> from expt 1 ([H<sub>2</sub>] 0.010, [NO] 0.025, rate 2.4 &times; 10<sup>&minus;6</sup>). Include units.",a:"rate = <i>k</i>[H<sub>2</sub>][NO]<sup>2</sup><br><i>k</i> = 2.4 &times; 10<sup>&minus;6</sup> / (0.010 &times; 0.025<sup>2</sup>) = <b>0.384 dm<sup>6</sup> mol<sup>&minus;2</sup> s<sup>&minus;1</sup></b>",keywords:["0.384","dm6|dm⁶","mol-2|mol−2","[no]2|no]^2|no]<sup>2"],numerics:[{value:.384,tol:.01,label:"k"}],distractors:["rate = <i>k</i>[H<sub>2</sub>]<sup>2</sup>[NO]; <i>k</i> = 15.4 dm<sup>6</sup> mol<sup>&minus;2</sup> s<sup>&minus;1</sup>","rate = <i>k</i>[H<sub>2</sub>][NO]; <i>k</i> = 0.0096 dm<sup>3</sup> mol<sup>&minus;1</sup> s<sup>&minus;1</sup>","rate = <i>k</i>[H<sub>2</sub>][NO]<sup>2</sup>; <i>k</i> = 0.384 mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup>"],prereqs:["i03","i04","e12"]},{id:"i06",section:4,source:"Kinetics 2, p.1",difficulty:3,q:"For A + 3B &rarr; AB<sub>3</sub>, expt 1 ([A] 0.100, [B] 0.100) gives rate 0.00200 and expt 4 ([A] 0.200, [B] 0.100) gives 0.00399. What is the order with respect to A?",a:"First order: doubling [A] while [B] is constant roughly doubles the rate (0.00200 &rarr; 0.00399).",keywords:["first","double|doubling|twice","a"],numerics:[],distractors:["Second order: doubling [A] should quadruple the rate.","Zero order: the rate change is caused by B.","Second order in A, because the concentration of A is squared in the equation A + 3B."],prereqs:["i02"]},{id:"i07",section:4,source:"Kinetics 2, p.1",difficulty:3,q:"For the same A + 3B data (expt 1: [B] 0.100, rate 0.00200; expt 2: [B] 0.200, rate 0.00798; expt 3: [B] 0.300, rate 0.01805), what is the order with respect to B?",a:"Second order: doubling [B] increases the rate about four times (0.00200 &rarr; 0.00798) and tripling it about nine times (0.00200 &rarr; 0.01805).",keywords:["second","four|quadruple|x4|times","nine|9"],numerics:[],distractors:["First order: doubling [B] should double the rate.","Third order, because 3B appears in the equation.","Zero order: the concentration of B has no effect."],prereqs:["i02"]},{id:"i08",section:4,source:"Kinetics 2, p.2",difficulty:3,q:"Write the rate equation for A + 3B &rarr; AB<sub>3</sub> (first order in A, second order in B) and calculate <i>k</i> from expt 1 ([A] 0.100, [B] 0.100, rate 0.00200 mol dm<sup>&minus;3</sup> min<sup>&minus;1</sup>). Include units.",a:"rate = <i>k</i>[A][B]<sup>2</sup><br><i>k</i> = 0.00200 / (0.100 &times; 0.100<sup>2</sup>) = <b>2.0 dm<sup>6</sup> mol<sup>&minus;2</sup> min<sup>&minus;1</sup></b>",keywords:["2.0|2","dm6|dm⁶","mol-2|mol−2","min-1|min−1"],numerics:[{value:2,tol:.05,label:"k"}],distractors:["rate = <i>k</i>[A][B]<sup>2</sup>; <i>k</i> = 2.0 dm<sup>6</sup> mol<sup>&minus;2</sup> s<sup>&minus;1</sup>","rate = <i>k</i>[A]<sup>2</sup>[B]; <i>k</i> = 200 dm<sup>6</sup> mol<sup>&minus;2</sup> min<sup>&minus;1</sup>","rate = <i>k</i>[A][B] / [AB<sub>3</sub>]; <i>k</i> = 0.2 min<sup>&minus;1</sup>"],prereqs:["i06","i07"]},{id:"i09",section:4,source:"Kinetics 2, p.2",difficulty:3,q:"In the H<sub>2</sub>/NO experiments at 750 &deg;C, doubling [H<sub>2</sub>] (2.88 &rarr; 5.77 &times; 10<sup>&minus;3</sup>) doubles the rate, while doubling [NO] (0.48 &rarr; 1.92 &times; 10<sup>&minus;3</sup>) quadruples it. What is the rate equation?",a:"rate = <i>k</i>[H<sub>2</sub>][NO]<sup>2</sup> — first order in hydrogen, second order in nitrogen monoxide.",keywords:["[h2]","[no]","2|squared|second"],numerics:[],distractors:["rate = <i>k</i>[H<sub>2</sub>]<sup>2</sup>[NO]","rate = <i>k</i>[H<sub>2</sub>][NO]","rate = <i>k</i>[NO]<sup>2</sup>, because hydrogen is in excess"],prereqs:["i02"]},{id:"i10",section:4,source:"Kinetics 2, p.3",difficulty:2,q:"In the propanone/iodine experiment, why is each 10 cm<sup>3</sup> portion added to excess aqueous NaHCO<sub>3</sub> before titrating with sodium thiosulphate?",a:"The sodium hydrogencarbonate neutralises the acid catalyst and stops the reaction. The amount of iodine left at that moment is therefore fixed, so the thiosulphate titration measures the iodine remaining at that time.",keywords:["stops|stop|quench","reaction","iodine","fixed|that time|remaining"],numerics:[],distractors:["It speeds up the reaction so that all of the iodine reacts before titration.","It dissolves the propanone so that the iodine can be titrated accurately.","It removes the acid so that the thiosulphate reacts with the propanone."],prereqs:["i01"]},{id:"i11",section:4,source:"Kinetics 2, p.3",difficulty:2,q:"In the propanone/iodine experiment, how does the rate of change of iodine concentration vary during the reaction?",a:"It stays constant: the volume of thiosulphate needed falls steadily with time, so the rate of change of iodine concentration is constant.",keywords:["constant|steady|same","rate","iodine"],numerics:[],distractors:["It falls steadily, because the concentration of iodine is decreasing.","It rises steadily, because the reaction is autocatalytic.","It halves every 5 minutes, as the iodine is used up."],prereqs:["i12"]},{id:"i12",section:4,source:"Kinetics 2, p.3",difficulty:2,q:"What is the order of the propanone/iodine reaction with respect to iodine?",a:"Zero order. The iodine concentration falls at a constant rate, so [I<sub>2</sub>] does not affect the rate.",keywords:["zero","constant|not affect|no effect|independent"],numerics:[],distractors:["First order, because the iodine is used up during the reaction.","Second order, because two iodine atoms are involved.","First order overall, since the rate constant is fixed."],prereqs:["i11"]},{id:"i13",section:4,source:"Kinetics 2, p.3",difficulty:2,q:"The propanone/iodine reaction is first order with respect to propanone. If 0.50 M propanone is used instead of 0.25 M, what happens to the rate?",a:"The rate doubles, because the concentration of propanone is doubled and the reaction is first order in propanone.",keywords:["double|twice|2"],numerics:[],distractors:["The rate quadruples, because the order is second.","The rate stays the same, because propanone is in excess.","The rate halves, because the propanone is more dilute."],prereqs:["i02"]},{id:"i14",section:4,source:"Kinetics 2, p.4",difficulty:3,q:"How would the thiosulphate-volume against time graph change if no catalytic acid were present, and why?",a:"The line would still fall, but much more slowly (a shallower gradient): without the acid catalyst the reaction is much slower, so iodine is used up more slowly. The acid provides an alternative route with a lower activation energy.",keywords:["slower|shallower|less steep","gradient|slope","catalyst","activation energy|alternative route"],numerics:[],distractors:["The line would be identical, because a catalyst does not affect the rate.","The line would be steeper, because removing the acid stops the catalyst poisoning the reaction.","The line would be horizontal, because the reaction could not happen at all without the acid."],prereqs:["i10"]},{id:"i15",section:4,source:"Kinetics 2, p.4",difficulty:3,q:"For H<sub>2</sub> + I<sub>2</sub> &rarr; 2HI, rate = <i>k</i>[H<sub>2</sub>][I<sub>2</sub>] with <i>k</i> = 8.58 &times; 10<sup>&minus;5</sup> dm<sup>3</sup> mol<sup>&minus;1</sup> s<sup>&minus;1</sup> at 374 &deg;C. Calculate the rate when (A) [H<sub>2</sub>] = 0.010, [I<sub>2</sub>] = 0.050 and (B) [H<sub>2</sub>] = 0.020, [I<sub>2</sub>] = 0.050.",a:"A: 8.58 &times; 10<sup>&minus;5</sup> &times; 0.010 &times; 0.050 = <b>4.29 &times; 10<sup>&minus;8</sup> mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup></b><br>B: 8.58 &times; 10<sup>&minus;5</sup> &times; 0.020 &times; 0.050 = <b>8.58 &times; 10<sup>&minus;8</sup> mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup></b><br>Doubling [H<sub>2</sub>] doubles the rate, as expected for first order in H<sub>2</sub>.",keywords:["4.29","8.58","double|doubles|twice"],numerics:[{value:429e-10,tol:1e-9,label:"rate A"},{value:858e-10,tol:1e-9,label:"rate B"}],distractors:["A: 4.29 &times; 10<sup>&minus;6</sup>; B: 8.58 &times; 10<sup>&minus;6</sup> mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup>","A: 4.29 &times; 10<sup>&minus;8</sup>; B: 4.29 &times; 10<sup>&minus;8</sup> mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup>","A: 4.29 &times; 10<sup>&minus;8</sup>; B: 1.72 &times; 10<sup>&minus;7</sup> mol dm<sup>&minus;3</sup> s<sup>&minus;1</sup>"],prereqs:["e01"]},{id:"m01",section:5,source:"Kinetics 2, p.5",difficulty:1,q:"What is the rate-determining step?",a:"The step in a multi-step mechanism that acts as the bottleneck &mdash; the slowest step, which controls the overall rate of reaction.",keywords:["slowest|slow","step","bottleneck|controls|determines","overall rate|rate"],numerics:[],distractors:["The first step in every mechanism, because it starts the reaction.","The step that releases the most energy.","The step with the largest activation energy in a one-step reaction."],prereqs:[]},{id:"m02",section:5,source:"Kinetics 2, p.5",difficulty:2,q:"How do you find which molecules are involved in the rate-determining step?",a:"Look at the rate equation. Its orders show which species take part and how many of each collide in the rate-determining step &mdash; for example, first order in ICl and first order in H<sub>2</sub> means one of each.",keywords:["rate equation","order|orders","species|molecules","collide|collision"],numerics:[],distractors:["Look at the stoichiometric equation and use its coefficients.","Look at the products: the slow step always forms the final products.","Look at the enthalpy change of the overall reaction."],prereqs:["m01","e02"]},{id:"m03",section:5,source:"Kinetics 2, p.5",difficulty:2,q:"What are the four steps for proposing a mechanism from a rate equation?",a:"<ol><li>Decide which species are in the rate-determining step, using the rate equation.</li><li>Suggest possible products for that step (they may include species not in the overall equation).</li><li>Compare with the stoichiometric equation to see what is still to be accounted for.</li><li>Add the steps, cancel intermediates and check they sum to the overall equation.</li></ol>",keywords:["rate-determining|rate determining|slow","products","compare|stoichiometric|account","add|sum|cancel"],numerics:[],distractors:["1 Balance the equation; 2 find the catalyst; 3 write the fast step; 4 check the enthalpy change.","1 Measure the rate; 2 calculate k; 3 plot a graph; 4 read the order.","1 Pick the fastest step; 2 balance it; 3 add the catalyst; 4 check the products."],prereqs:["m01"]},{id:"m04",section:5,source:"Kinetics 2, p.5-6",difficulty:3,q:"For 2ICl + H<sub>2</sub> &rarr; 2HCl + I<sub>2</sub> with rate = <i>k</i>[ICl][H<sub>2</sub>], give a possible two-step mechanism.",a:"Slow: ICl + H<sub>2</sub> &rarr; HCl + HI<br>Fast: ICl + HI &rarr; HCl + I<sub>2</sub><br>Adding them gives 2ICl + H<sub>2</sub> &rarr; 2HCl + I<sub>2</sub>, with HI as the intermediate.",keywords:["icl","h2","hcl","hi","slow|fast"],numerics:[],distractors:["Slow: ICl + ICl &rarr; I<sub>2</sub> + Cl<sub>2</sub>; fast: Cl<sub>2</sub> + H<sub>2</sub> &rarr; 2HCl.","Slow: H<sub>2</sub> &rarr; 2H; fast: 2H + 2ICl &rarr; 2HCl + I<sub>2</sub>.","Slow: ICl &rarr; I + Cl; fast: I + Cl + H<sub>2</sub> &rarr; HCl + HI."],prereqs:["m02","m03"]},{id:"m05",section:5,source:"Kinetics 2, p.6",difficulty:2,q:"Why must the steps of a proposed mechanism add up to the stoichiometric equation?",a:"Because intermediates and species that appear on both sides must cancel. If the steps do not give the same overall amounts of reactants and products, the mechanism cannot be correct.",keywords:["cancel","intermediate","overall|stoichiometric","same|match"],numerics:[],distractors:["Because the fastest step must be written last.","Because the rate equation must have the same coefficients as the equation.","Because each step must be balanced for charge but not for atoms."],prereqs:["m04"]},{id:"m06",section:5,source:"Kinetics 2, p.6",difficulty:2,q:"What would it mean if the reaction mixture contained traces of chlorine?",a:"The proposed mechanism would not fit all the facts, so it would be disproved and a new mechanism would have to be found.",keywords:["disproved|not fit|wrong|rejected","new|another","mechanism"],numerics:[],distractors:["The mechanism would be confirmed, because chlorine is an intermediate.","Nothing: intermediate species are never observed.","The rate equation would need to include chlorine as a catalyst."],prereqs:["m04"]},{id:"m07",section:5,source:"Kinetics 2, p.7",difficulty:3,q:"Mechanism (a):<br>ICl + H<sub>2</sub> &rarr; HCl + HI (slow)<br>HCl + ICl &rarr; HI + Cl<sub>2</sub> (fast)<br>Cl<sub>2</sub> + HI &rarr; HCl + ICl (fast)<br>What is the main fault?",a:"The steps do not add up to 2ICl + H<sub>2</sub> &rarr; 2HCl + I<sub>2</sub>. The Cl<sub>2</sub> and HI cancel, leaving ICl + H<sub>2</sub> &rarr; HCl + HI &mdash; so the mechanism does not produce I<sub>2</sub> overall.",keywords:["do not add up|doesn't add up|not add up|overall","cl2|chlorine","i2|iodine"],numerics:[],distractors:["The slow step involves two molecules, which is impossible in the gas phase.","It is wrong because the first step should always be the fastest.","It is wrong because HCl cannot be both a product and a reactant."],prereqs:["m05"]},{id:"m08",section:5,source:"Kinetics 2, p.7",difficulty:3,q:"Mechanism (b):<br>ICl + ICl &rarr; I<sub>2</sub> + Cl<sub>2</sub> (slow)<br>Cl<sub>2</sub> + H<sub>2</sub> &rarr; 2HCl (fast)<br>What is the main fault?",a:"The slow step would make the rate second order in ICl and zero order in H<sub>2</sub>. That contradicts the experimental rate equation, rate = <i>k</i>[ICl][H<sub>2</sub>].",keywords:["second order|2","zero order|independent","h2|hydrogen","rate equation|contradict"],numerics:[],distractors:["It is wrong because I<sub>2</sub> cannot be an intermediate.","It is wrong because the steps add up to the wrong overall equation.","It is wrong because a slow step cannot involve two identical molecules."],prereqs:["m02"]},{id:"m09",section:5,source:"Kinetics 2, p.7",difficulty:3,q:"Mechanism (c) begins with ICl &rarr; I&bull; + Cl&bull; (slow), followed by several fast radical steps. What is the main fault?",a:"The slow step would give rate = <i>k</i>[ICl], first order in ICl and independent of H<sub>2</sub>. The experimental rate equation is rate = <i>k</i>[ICl][H<sub>2</sub>], so this mechanism cannot be right.",keywords:["first order|k[icl]","independent|zero order","h2|hydrogen","rate equation|contradict"],numerics:[],distractors:["It is wrong because radicals can never appear in a mechanism.","It is wrong because the steps do not add up to the overall equation.","It is wrong because the slow step must involve both reactants."],prereqs:["m02"]},{id:"m10",section:5,source:"Kinetics 2, p.7",difficulty:3,q:"2N<sub>2</sub>O<sub>5</sub> &rarr; 4NO<sub>2</sub> + O<sub>2</sub> is first order. Suggest a mechanism consistent with this.",a:"Slow: N<sub>2</sub>O<sub>5</sub> &rarr; NO<sub>2</sub> + NO<sub>3</sub><br>Fast: N<sub>2</sub>O<sub>5</sub> + NO<sub>3</sub> &rarr; 3NO<sub>2</sub> + O<sub>2</sub><br>The slow step involves one N<sub>2</sub>O<sub>5</sub> molecule, so rate = <i>k</i>[N<sub>2</sub>O<sub>5</sub>]; NO<sub>3</sub> cancels to give the overall equation.",keywords:["n2o5","no3","no2","o2"],numerics:[],distractors:["Slow: N<sub>2</sub>O<sub>5</sub> + N<sub>2</sub>O<sub>5</sub> &rarr; products, which would make it second order.","Slow: N<sub>2</sub>O<sub>5</sub> &rarr; N<sub>2</sub> + O<sub>2</sub> + O, which does not give NO<sub>2</sub>.","Slow: O<sub>2</sub> &rarr; 2O, followed by reaction with N<sub>2</sub>O<sub>5</sub>, which is zero order in N<sub>2</sub>O<sub>5</sub>."],prereqs:["m02","m03","m05"]},{id:"m11",section:5,source:"Kinetics 2, p.7",difficulty:3,q:"For A + 3B &rarr; AB<sub>3</sub> the rate equation is rate = <i>k</i>[A][B]<sup>2</sup>. Suggest a possible mechanism.",a:"Slow: A + 2B &rarr; AB<sub>2</sub><br>Fast: AB<sub>2</sub> + B &rarr; AB<sub>3</sub><br>The slow step involves one A and two B, giving <i>k</i>[A][B]<sup>2</sup>, and the steps sum to A + 3B &rarr; AB<sub>3</sub>.",keywords:["a + 2b|2b","ab2","ab3","slow"],numerics:[],distractors:["Slow: A + 3B &rarr; AB<sub>3</sub>, which would give rate = <i>k</i>[A][B]<sup>3</sup>.","Slow: A + B &rarr; AB; fast: AB + 2B &rarr; AB<sub>3</sub>, whic
