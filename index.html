 is <b>half</b> the equivalence volume."},{id:"l15-09",section:15,qtype:"State",spec:["14.21ii"],source:"Acid-base IV, p.9",difficulty:2,q:"State the pH at the half-neutralisation point of a weak acid&ndash;strong base titration: pH = ______.",answer:"pK<sub>a</sub>",distractors:["pK<sub>w</sub>","7","pK<sub>b</sub>"],a:"At half-neutralisation, [acid] = [conjugate base], so pH = <b>pK<sub>a</sub></b>."},{id:"l15-10",section:15,qtype:"Calculate",spec:["14.21ii"],source:"Acid-base IV, p.9",difficulty:3,q:"Calculate K<sub>a</sub> for a weak acid with pH 4.77 at half-neutralisation: K<sub>a</sub> = ______ mol dm<sup>&minus;3</sup>.",answer:"1.7 &times; 10<sup>&minus;5</sup>",distractors:["4.77","1.7 &times; 10<sup>&minus;4</sup>","5.9 &times; 10<sup>&minus;5</sup>"],a:"At half-neutralisation pH = pK<sub>a</sub> = 4.77, so K<sub>a</sub> = 10<sup>&minus;4.77</sup> = <b>1.7 &times; 10<sup>&minus;5</sup></b>."},{id:"l15-11",section:15,qtype:"Explain",spec:["14.21i"],source:"Acid-base IV, p.8",difficulty:2,q:"Explain what the flat buffer region on a weak acid&ndash;strong base curve demonstrates: it demonstrates ______ action.",answer:"buffer",distractors:["catalytic","indicator","oxidation"],a:"The flat region shows <b>buffer action</b>: added base changes the pH only slightly until the acid is used up."},{id:"l15-12",section:15,qtype:"Interpret",spec:["14.15"],source:"Acid-base V, p.11",difficulty:2,q:"Interpret the titration curve of a diprotic acid such as H<sub>2</sub>C<sub>2</sub>O<sub>4</sub>: it shows ______ equivalence points.",answer:"two",distractors:["one","three","none"],a:"The two protons are removed in two stages, giving <b>two</b> equivalence points."},{id:"l15-13",section:15,qtype:"State",spec:["14.15"],source:"Acid-base V, p.12",difficulty:2,q:"State the pH at the first half-equivalence point of a diprotic acid: pH = ______, and the second has pH = pK<sub>a2</sub>.",answer:"pK<sub>a1</sub>",distractors:["pK<sub>a2</sub>","7","pK<sub>w</sub>"],a:"At the first half-equivalence point, [H<sub>2</sub>A] = [HA<sup>&minus;</sup>], so pH = <b>pK<sub>a1</sub></b>."},{id:"l15-14",section:15,qtype:"Deduce",spec:["14.15"],source:"Acid-base V, p.10",difficulty:2,q:"Deduce the first product when HCl is added to Na<sub>2</sub>CO<sub>3</sub>: the first stage forms ______ and gives an end point near pH 8.3.",answer:"NaHCO<sub>3</sub>",distractors:["CO<sub>2</sub>","NaCl","NaOH"],a:"CO<sub>3</sub><sup>2&minus;</sup> + H<sup>+</sup> &rarr; HCO<sub>3</sub><sup>&minus;</sup>; the first end point is near <b>pH 8.3</b>."},{id:"l15-15",section:15,qtype:"Deduce",spec:["14.15"],source:"Acid-base V, p.11",difficulty:2,q:"Deduce the gas released in the second stage of the carbonate titration: HCO<sub>3</sub><sup>&minus;</sup> reacts with acid to release ______.",answer:"CO<sub>2</sub>",distractors:["H<sub>2</sub>","O<sub>2</sub>","Cl<sub>2</sub>"],a:"HCO<sub>3</sub><sup>&minus;</sup> + H<sup>+</sup> &rarr; CO<sub>2</sub> + H<sub>2</sub>O; the second end point is near pH 3.7."},{id:"l15-16",section:15,qtype:"Select",spec:["14.16"],source:"Acid-base IV, p.8",difficulty:2,q:"Select a suitable indicator from a titration curve: its pH range must lie within the ______ section.",answer:"vertical",distractors:["buffer","initial","horizontal"],a:"The indicator range must fall within the steep <b>vertical</b> section so a single drop changes the colour."},{id:"l15-17",section:15,qtype:"Interpret",spec:["14.15"],source:"Acid-base V, p.9",difficulty:2,q:"Interpret the effect of swapping acid and base between flask and burette: the titration curve is a ______ image.",answer:"mirror",distractors:["identical","rotated","scaled"],a:"Swapping the solutions reverses the curve, giving a <b>mirror</b> image."},{id:"l16-01",section:16,qtype:"Define",spec:["13.1"],source:"Chemical Equilibria I, p.1",difficulty:1,q:"Define a homogeneous equilibrium: all substances are present in the ______ phase.",answer:"same",distractors:["different","solid","gaseous"],a:"In a <b>homogeneous</b> equilibrium, everything is in the same phase, such as all gases or all aqueous."},{id:"l16-02",section:16,qtype:"Define",spec:["13.1"],source:"Chemical Equilibria I, p.1",difficulty:1,q:"Define a heterogeneous equilibrium: substances are present in ______ than one phase.",answer:"more",distractors:["less","exactly","no more"],a:"A <b>heterogeneous</b> equilibrium contains substances in more than one phase, such as a solid and a gas."},{id:"l16-03",section:16,qtype:"Deduce",spec:["13.1"],source:"Chemical Equilibria I, p.2",difficulty:2,q:"Deduce the K<sub>c</sub> expression for aA + bB &rlarr; cC + dD: K<sub>c</sub> = ______.",answer:"[C]<sup>c</sup>[D]<sup>d</sup>/[A]<sup>a</sup>[B]<sup>b</sup>",distractors:["[A]<sup>a</sup>[B]<sup>b</sup>/[C]<sup>c</sup>[D]<sup>d</sup>","[C][D]/[A][B]","[A][B]/[C][D]"],a:"Products go on top and reactants on the bottom, each raised to its stoichiometric coefficient."},{id:"l16-04",section:16,qtype:"State",spec:["13.1"],source:"Chemical Equilibria I, p.5",difficulty:2,q:"State how pure solids and pure liquids are treated in a heterogeneous K<sub>c</sub> expression: their terms are ______.",answer:"omitted",distractors:["squared","included","inverted"],a:"The concentration of a pure solid or liquid is constant, so it is <b>omitted</b> from K<sub>c</sub>."},{id:"l16-05",section:16,qtype:"State",spec:["13.3"],source:"Chemical Equilibria I, p.4",difficulty:3,q:"State the units of K<sub>c</sub> for 2SO<sub>2</sub>(g) + O<sub>2</sub>(g) &rlarr; 2SO<sub>3</sub>(g): ______.",answer:"dm<sup>3</sup> mol<sup>&minus;1</sup>",distractors:["mol dm<sup>&minus;3</sup>","dm<sup>6</sup> mol<sup>&minus;2</sup>","no units"],a:"K<sub>c</sub> = [SO<sub>3</sub>]<sup>2</sup>/([SO<sub>2</sub>]<sup>2</sup>[O<sub>2</sub>]); the units are (mol dm<sup>&minus;3</sup>)<sup>2</sup>/(mol dm<sup>&minus;3</sup>)<sup>3</sup> = <b>dm<sup>3</sup> mol<sup>&minus;1</sup></b>."},{id:"l16-06",section:16,qtype:"State",spec:["13.3"],source:"Chemical Equilibria I, p.4",difficulty:3,q:"State the units of K<sub>c</sub> for N<sub>2</sub>(g) + 3H<sub>2</sub>(g) &rlarr; 2NH<sub>3</sub>(g): ______.",answer:"dm<sup>6</sup> mol<sup>&minus;2</sup>",distractors:["dm<sup>3</sup> mol<sup>&minus;1</sup>","mol dm<sup>&minus;3</sup>","no units"],a:"K<sub>c</sub> = [NH<sub>3</sub>]<sup>2</sup>/([N<sub>2</sub>][H<sub>2</sub>]<sup>3</sup>); the units are (mol dm<sup>&minus;3</sup>)<sup>2</sup>/(mol dm<sup>&minus;3</sup>)<sup>4</sup> = <b>dm<sup>6</sup> mol<sup>&minus;2</sup></b>."},{id:"l16-07",section:16,qtype:"State",spec:["13.3"],source:"Chemical Equilibria I, p.3",difficulty:2,q:"State the units of K<sub>c</sub> for H<sub>2</sub>(g) + I<sub>2</sub>(g) &rlarr; 2HI(g): ______.",answer:"no units",distractors:["mol dm<sup>&minus;3</sup>","dm<sup>3</sup> mol<sup>&minus;1</sup>","dm<sup>6</sup> mol<sup>&minus;2</sup>"],a:"The powers cancel: (mol dm<sup>&minus;3</sup>)<sup>2</sup>/(mol dm<sup>&minus;3</sup>)<sup>2</sup>, so K<sub>c</sub> has <b>no units</b>."},{id:"l16-08",section:16,qtype:"Deduce",spec:["13.3"],source:"Chemical Equilibria I, p.5",difficulty:2,q:"Deduce K<sub>c</sub> for CaCO<sub>3</sub>(s) &rlarr; CaO(s) + CO<sub>2</sub>(g): K<sub>c</sub> = ______.",answer:"[CO<sub>2</sub>]",distractors:["[CaO][CO<sub>2</sub>]/[CaCO<sub>3</sub>]","1/[CO<sub>2</sub>]","[CaCO<sub>3</sub>]/[CaO][CO<sub>2</sub>]"],a:"Solids are omitted, so K<sub>c</sub> = <b>[CO<sub>2</sub>]</b>."},{id:"l16-09",section:16,qtype:"Calculate",spec:["13.3"],source:"Chemical Equilibria I, p.11",difficulty:3,q:"Calculate the K<sub>c</sub> of the reverse hydrolysis reaction when the esterification K<sub>c</sub> = 4 at room temperature: K<sub>c</sub> = ______.",answer:"0.25",distractors:["4","8","16"],a:"Reversing the equation gives the reciprocal: K<sub>c</sub> = 1/4 = <b>0.25</b>."},{id:"l16-10",section:16,qtype:"Deduce",spec:["13.3"],source:"Chemical Equilibria I, p.3",difficulty:2,q:"Deduce how K<sub>c</sub> changes when the equation is doubled: the new K<sub>c</sub> is the original value ______.",answer:"squared",distractors:["halved","doubled","square-rooted"],a:"Multiplying the equation by 2 raises each concentration to twice the power, so K<sub>c</sub> is <b>squared</b>."},{id:"l16-11",section:16,qtype:"Deduce",spec:["13.3"],source:"Chemical Equilibria I, p.3",difficulty:2,q:"Deduce how K<sub>c</sub> changes when the equation is halved: the new K<sub>c</sub> is the ______ of the original value.",answer:"square root",distractors:["square","reciprocal","double"],a:"Halving the equation halves the powers, so K<sub>c</sub> becomes the <b>square root</b> of the original."},{id:"l16-12",section:16,qtype:"State",spec:["13.5"],source:"Chemical Equilibria I, p.2",difficulty:2,q:"State how K<sub>c</sub> depends on starting amounts at constant temperature: K<sub>c</sub> is ______ whatever starting amounts of reactants are used.",answer:"constant",distractors:["different","zero","random"],a:"K<sub>c</sub> depends only on temperature, so at constant T it is <b>constant</b>."},{id:"l16-13",section:16,qtype:"State",spec:["13.5"],source:"Chemical Equilibria I, p.2",difficulty:2,q:"State how a catalyst affects K<sub>c</sub>: K<sub>c</sub> is unaffected by changes in pressure or by adding a ______.",answer:"catalyst",distractors:["reactant","product","solvent"],a:"A catalyst speeds up both directions equally and does not change K<sub>c</sub>."},{id:"l16-14",section:16,qtype:"Predict",spec:["13.9"],source:"Chemical Equilibria I, p.2",difficulty:2,q:"Predict the equilibrium position for a large K<sub>c</sub>: it lies to the ______, so the reaction has a high extent.",answer:"right",distractors:["left","centre","top"],a:"Large K<sub>c</sub> = more products than reactants = equilibrium lies to the <b>right</b>."},{id:"l16-15",section:16,qtype:"Predict",spec:["13.9"],source:"Chemical Equilibria I, p.2",difficulty:2,q:"Predict the equilibrium position for a small K<sub>c</sub>: it lies to the ______, so the extent of reaction is low.",answer:"left",distractors:["right","centre","bottom"],a:"Small K<sub>c</sub> = more reactants than products = equilibrium lies to the <b>left</b>."},{id:"l17-01",section:17,qtype:"Define",spec:["13.2"],source:"Chemical Equilibria I, p.7",difficulty:1,q:"Define the mole fraction of gas A: the number of moles of A divided by the ______ number of moles of gas.",answer:"total",distractors:["partial","initial","final"],a:"Mole fraction x<sub>A</sub> = n<sub>A</sub>/n<sub>total</sub>."},{id:"l17-02",section:17,qtype:"Define",spec:["13.2"],source:"Chemical Equilibria I, p.7",difficulty:1,q:"Define the partial pressure of gas A: its mole fraction multiplied by the ______ pressure.",answer:"total",distractors:["partial","vapour","initial"],a:"p<sub>A</sub> = x<sub>A</sub> &times; P<sub>total</sub>."},{id:"l17-03",section:17,qtype:"State",spec:["13.2"],source:"Chemical Equilibria I, p.7",difficulty:1,q:"State how total pressure relates to partial pressures: the total pressure is the ______ of the partial pressures.",answer:"sum",distractors:["product","difference","average"],a:"P<sub>total</sub> = p<sub>A</sub> + p<sub>B</sub> + ..."},{id:"l17-04",section:17,qtype:"Deduce",spec:["13.2"],source:"Chemical Equilibria I, p.8",difficulty:2,q:"Deduce the K<sub>p</sub> expression for aA(g) + bB(g) &rlarr; cC(g) + dD(g): K<sub>p</sub> = ______.",answer:"p<sub>C</sub><sup>c</sup>p<sub>D</sub><sup>d</sup>/p<sub>A</sub><sup>a</sup>p<sub>B</sub><sup>b</sup>",distractors:["p<sub>A</sub><sup>a</sup>p<sub>B</sub><sup>b</sup>/p<sub>C</sub><sup>c</sup>p<sub>D</sub><sup>d</sup>","p<sub>C</sub>p<sub>D</sub>/p<sub>A</sub>p<sub>B</sub>","p<sub>A</sub>p<sub>B</sub>/p<sub>C</sub>p<sub>D</sub>"],a:"K<sub>p</sub> uses partial pressures in the same format as K<sub>c</sub>."},{id:"l17-05",section:17,qtype:"State",spec:["13.2"],source:"Chemical Equilibria I, p.10",difficulty:2,q:"State how a solid is treated in a K<sub>p</sub> expression: its partial pressure is ______.",answer:"omitted",distractors:["included","squared","inverted"],a:"Pure solids have constant activity, so they are <b>omitted</b> from K<sub>p</sub>."},{id:"l17-06",section:17,qtype:"State",spec:["13.3"],source:"Chemical Equilibria I, p.9",difficulty:3,q:"State the units of K<sub>p</sub> for 2SO<sub>2</sub>(g) + O<sub>2</sub>(g) &rlarr; 2SO<sub>3</sub>(g), in atm: ______.",answer:"atm<sup>&minus;1</sup>",distractors:["atm","atm<sup>&minus;2</sup>","no units"],a:"K<sub>p</sub> = p<sub>SO3</sub><sup>2</sup>/(p<sub>SO2</sub><sup>2</sup>p<sub>O2</sub>); units are atm<sup>2</sup>/atm<sup>3</sup> = <b>atm<sup>&minus;1</sup></b>."},{id:"l17-07",section:17,qtype:"State",spec:["13.3"],source:"Chemical Equilibria I, p.9",difficulty:3,q:"State the units of K<sub>p</sub> for N<sub>2</sub>(g) + 3H<sub>2</sub>(g) &rlarr; 2NH<sub>3</sub>(g), in atm: ______.",answer:"atm<sup>&minus;2</sup>",distractors:["atm<sup>&minus;1</sup>","atm<sup>2</sup>","no units"],a:"K<sub>p</sub> = p<sub>NH3</sub><sup>2</sup>/(p<sub>N2</sub>p<sub>H2</sub><sup>3</sup>); units are atm<sup>2</sup>/atm<sup>4</sup> = <b>atm<sup>&minus;2</sup></b>."},{id:"l17-08",section:17,qtype:"Deduce",spec:["13.3"],source:"Chemical Equilibria I, p.10",difficulty:2,q:"Deduce K<sub>p</sub> for CaCO<sub>3</sub>(s) &rlarr; CaO(s) + CO<sub>2</sub>(g): K<sub>p</sub> = ______.",answer:"p<sub>CO2</sub>",distractors:["p<sub>CaO</sub>p<sub>CO2</sub>","p<sub>CaCO3</sub>/p<sub>CO2</sub>","1/p<sub>CO2</sub>"],a:"Solids are omitted, so K<sub>p</sub> = <b>p<sub>CO2</sub></b>."},{id:"l17-09",section:17,qtype:"Calculate",spec:["13.3"],source:"Chemical Equilibria I, p.8",difficulty:3,q:"Calculate the partial pressure of N<sub>2</sub> in a mixture of 20 mol N<sub>2</sub>, 60 mol H<sub>2</sub> and 20 mol NH<sub>3</sub> at 200 atm: ______ atm.",answer:"40",distractors:["20","120","200"],a:"x<sub>N2</sub> = 20/100 = 0.20; p<sub>N2</sub> = 0.20 &times; 200 = <b>40 atm</b>."},{id:"l17-10",section:17,qtype:"Calculate",spec:["13.3"],source:"Chemical Equilibria I, p.8",difficulty:3,q:"Calculate the partial pressure of H<sub>2</sub> in the same mixture: ______ atm.",answer:"120",distractors:["60","40","200"],a:"x<sub>H2</sub> = 60/100 = 0.60; p<sub>H2</sub> = 0.60 &times; 200 = <b>120 atm</b>."},{id:"l17-11",section:17,qtype:"Predict",spec:["13.9"],source:"Chemical Equilibria I, p.2",difficulty:2,q:"Predict what a large K<sub>p</sub> means for the equilibrium mixture: it contains mainly ______.",answer:"products",distractors:["reactants","catalyst","solids"],a:"Large K<sub>p</sub> means products dominate, so the equilibrium lies to the right."},{id:"l17-12",section:17,qtype:"State",spec:["13.5"],source:"Chemical Equilibria II, p.5",difficulty:2,q:"State how changing total pressure affects K<sub>p</sub>: K<sub>p</sub> itself is ______.",answer:"unchanged",distractors:["increased","decreased","zero"],a:"K<sub>p</sub> depends only on temperature; changing pressure changes the position but not K<sub>p</sub>."},{id:"l18-01",section:18,qtype:"Explain",spec:["13.4"],source:"Chemical Equilibria II, p.6",difficulty:2,q:"Explain how a catalyst affects the position of equilibrium: it has ______ effect.",answer:"no",distractors:["a large","a small","an unpredictable"],a:"A catalyst speeds up both forward and reverse reactions equally, so the position and K are unchanged."},{id:"l18-02",section:18,qtype:"State",spec:["13.5"],source:"Chemical Equilibria II, p.6",difficulty:2,q:"State what the equilibrium constant is not affected by: changes in concentration, pressure or addition of a ______.",answer:"catalyst",distractors:["reactant","product","gas"],a:"Only temperature changes K; concentration, pressure and catalysts do not."},{id:"l18-03",section:18,qtype:"Explain",spec:["13.6"],source:"Chemical Equilibria II, p.3",difficulty:2,q:"Explain the effect of increasing temperature on an exothermic reaction: K ______ and the equilibrium shifts to the left.",answer:"decreases",distractors:["increases","does not change","doubles"],a:"Exothermic: higher T makes &minus;&Delta;H/T less positive, so &Delta;S<sub>total</sub> and K <b>decrease</b>; the equilibrium shifts left."},{id:"l18-04",section:18,qtype:"Explain",spec:["13.6"],source:"Chemical Equilibria II, p.4",difficulty:2,q:"Explain the effect of increasing temperature on an endothermic reaction: K ______ and the equilibrium shifts to the right.",answer:"increases",distractors:["decreases","does not change","halves"],a:"Endothermic: higher T makes &minus;&Delta;H/T less negative, so &Delta;S<sub>total</sub> and K <b>increase</b>; the equilibrium shifts right."},{id:"l18-05",section:18,qtype:"Explain",spec:["13.7"],source:"Chemical Equilibria II, p.1",difficulty:2,q:"Explain how temperature changes the position of equilibrium: it changes the value of ______.",answer:"K",distractors:["pH","activation energy","concentration"],a:"Temperature changes the value of K itself; the new equilibrium position is the one that restores equilibrium."},{id:"l18-06",section:18,qtype:"Explain",spec:["13.8i"],source:"Chemical Equilibria II, p.3",difficulty:3,q:"Explain the effect of increasing temperature on ΔS<sub>total</sub> for an exothermic reaction: it becomes less ______.",answer:"positive",distractors:["negative","constant","zero"],a:"&Delta;S<sub>surroundings</sub> = &minus;&Delta;H/T is positive for an exothermic reaction; as T rises it becomes less positive, so &Delta;S<sub>total</sub> is less positive."},{id:"l18-07",section:18,qtype:"Explain",spec:["13.8i"],source:"Chemical Equilibria II, p.4",difficulty:3,q:"Explain the effect of increasing temperature on ΔS<sub>total</sub> for an endothermic reaction: it becomes more ______.",answer:"positive",distractors:["negative","constant","zero"],a:"&Delta;S<sub>surroundings</sub> is negative for an endothermic reaction; as T rises it becomes less negative, so &Delta;S<sub>total</sub> becomes more positive."},{id:"l18-08",section:18,qtype:"State",spec:["13.8ii"],source:"Chemical Equilibria II, p.3",difficulty:2,q:"State the relationship between ΔS<sub>total</sub> and K: ΔS<sub>total</sub> = ______.",answer:"R ln K",distractors:["K ln R","R/K","ln(K/R)"],a:"&Delta;S<sub>total</sub> = <b>R ln K</b>; a positive &Delta;S<sub>total</sub> gives K &gt; 1."},{id:"l18-09",section:18,qtype:"Deduce",spec:["13.8ii"],source:"Chemical Equilibria II, p.3",difficulty:2,q:"Deduce the value of K when ΔS<sub>total</sub> is positive: K is ______.",answer:"greater than 1",distractors:["less than 1","equal to 1","zero"],a:"&Delta;S<sub>total</sub> = R ln K; positive &Delta;S<sub>total</sub> means ln K &gt; 0, so <b>K &gt; 1</b>."},{id:"l18-10",section:18,qtype:"Predict",spec:["13.4"],source:"Chemical Equilibria II, p.5",difficulty:2,q:"Predict the direction of shift when pressure increases: the equilibrium shifts to the side with ______ gas moles.",answer:"fewer",distractors:["more","equal","zero"],a:"Higher pressure favours the side with <b>fewer</b> gas moles."},{id:"l18-11",section:18,qtype:"State",spec:["13.4"],source:"Chemical Equilibria II, p.5",difficulty:2,q:"State when pressure has no effect on a gaseous equilibrium: when the number of gas moles is ______ on both sides.",answer:"equal",distractors:["different","zero","maximum"],a:"If &Delta;n(gas) = 0, pressure changes affect both sides equally and the position does not shift."},{id:"l18-12",section:18,qtype:"Explain",spec:["13.4"],source:"Chemical Equilibria II, p.6",difficulty:2,q:"Explain what happens to K when more reactant is added: the equilibrium shifts right, but K ______.",answer:"stays the same",distractors:["increases","decreases","becomes zero"],a:"The system shifts to use up the added reactant, but K remains constant at that temperature."},{id:"l18-13",section:18,qtype:"Predict",spec:["13.4"],source:"Chemical Equilibria II, p.5",difficulty:3,q:"Predict the pressure shift for 4NH<sub>3</sub>(g) + 5O<sub>2</sub>(g) &rlarr; 4NO(g) + 6H<sub>2</sub>O(g): increasing pressure shifts the equilibrium to the ______.",answer:"left",distractors:["right","centre","right then left"],a:"There are 9 gas moles on the left and 10 on the right, so higher pressure favours the <b>left</b>."},{id:"l18-14",section:18,qtype:"Predict",spec:["13.9"],source:"Chemical Equilibria II, p.1",difficulty:2,q:"Predict the extent of reaction for a very small K: the extent is ______.",answer:"low",distractors:["high","complete","maximum"],a:"Small K means reactants dominate, so the extent of reaction is <b>low</b>."},{id:"l19-01",section:19,qtype:"Explain",spec:["12.1"],source:"Entropy, p.1",difficulty:1,q:"Explain why enthalpy alone does not determine whether a reaction occurs: some ______ reactions happen spontaneously at room temperature.",answer:"endothermic",distractors:["exothermic","catalytic","reversible"],a:"Many endothermic reactions occur spontaneously, so <b>enthalpy alone</b> is not enough to decide feasibility."},{id:"l19-02",section:19,qtype:"Define",spec:["12.2"],source:"Entropy, p.1",difficulty:1,q:"Define entropy: a measure of the ______ of a system in terms of the random dispersal of molecules and energy.",answer:"disorder",distractors:["order","temperature","pressure"],a:"Entropy measures the <b>disorder</b> or dispersal of molecules and energy quanta."},{id:"l19-03",section:19,qtype:"State",spec:["12.3"],source:"Entropy, p.1",difficulty:1,q:"State how entropy changes with temperature: the entropy of a substance ______ as temperature increases.",answer:"increases",distractors:["decreases","stays constant","becomes zero"],a:"Higher temperature means more random motion and energy dispersal, so entropy <b>increases</b>."},{id:"l19-04",section:19,qtype:"State",spec:["12.3"],source:"Entropy, p.1",difficulty:1,q:"State the order of increasing entropy: solid &rarr; ______ &rarr; gas.",answer:"liquid",distractors:["plasma","aqueous","crystal"],a:"Particles become more disordered from solid to <b>liquid</b> to gas."},{id:"l19-05",section:19,qtype:"State",spec:["12.3"],source:"Entropy, p.1",difficulty:2,q:"State the entropy of a perfect crystal at zero kelvin: it has ______ entropy.",answer:"zero",distractors:["maximum","negative","infinite"],a:"A perfect crystal at 0 K has only one arrangement, so its entropy is <b>zero</b>."},{id:"l19-06",section:19,qtype:"State",spec:["12.4"],source:"Entropy, p.2",difficulty:2,q:"State the natural direction of change: the direction of increasing ______ entropy.",answer:"total",distractors:["system","surroundings","molar"],a:"Change is spontaneous in the direction that increases <b>total</b> entropy."},{id:"l19-07",section:19,qtype:"Explain",spec:["12.4"],source:"Entropy, p.2",difficulty:2,q:"Explain why a gas spreads through a room: it is a spontaneous process driven by an increase in ______.",answer:"entropy",distractors:["enthalpy","pressure","kinetic energy"],a:"Gas molecules disperse randomly, increasing <b>entropy</b>; this is the natural direction of change."},{id:"l19-08",section:19,qtype:"Predict",spec:["12.5i"],source:"Entropy, p.3",difficulty:2,q:"Predict the entropy change when a solid melts: the entropy of the system ______.",answer:"increases",distractors:["decreases","stays constant","becomes negative"],a:"Melting increases disorder, so &Delta;S<sub>system</sub> is <b>positive</b>."},{id:"l19-09",section:19,qtype:"Predict",spec:["12.5ii"],source:"Entropy, p.3",difficulty:2,q:"Predict the entropy change when an ionic lattice dissolves: the entropy of the system usually ______ because the ions become more disordered.",answer:"increases",distractors:["decreases","stays constant","becomes zero"],a:"Breaking up an ordered lattice increases disorder, so &Delta;S<sub>system</sub> is usually <b>positive</b>."},{id:"l19-10",section:19,qtype:"Predict",spec:["12.5iii"],source:"Entropy, p.3",difficulty:2,q:"Predict the entropy change when more moles of gas are produced: the entropy change is ______.",answer:"positive",distractors:["negative","zero","constant"],a:"More gas moles means greater dispersal, so &Delta;S<sub>system</sub> is <b>positive</b>."},{id:"l19-11",section:19,qtype:"State",spec:["12.6"],source:"Entropy, p.8",difficulty:2,q:"State the total entropy change: ΔS<sub>total</sub> = ______.",answer:"&Delta;S<sub>system</sub> + &Delta;S<sub>surroundings</sub>",distractors:["&Delta;S<sub>system</sub> &minus; &Delta;S<sub>surroundings</sub>","&Delta;H &minus; T&Delta;S","&Delta;S<sub>surroundings</sub> &minus; &Delta;S<sub>system</sub>"],a:"&Delta;S<sub>total</sub> = <b>&Delta;S<sub>system</sub> + &Delta;S<sub>surroundings</sub></b>."},{id:"l19-12",section:19,qtype:"State",spec:["12.7"],source:"Entropy, p.8",difficulty:2,q:"State how to calculate ΔS<sub>system</sub> for a reaction: ΔS<sub>system</sub> = ______.",answer:"&Sigma;S(products) &minus; &Sigma;S(reactants)",distractors:["&Sigma;S(reactants) &minus; &Sigma;S(products)","&Sigma;S(products) + &Sigma;S(reactants)","&Delta;H/T"],a:"Add the standard entropies of the products and subtract those of the reactants."},{id:"l19-13",section:19,qtype:"State",spec:["12.8"],source:"Entropy, p.8",difficulty:2,q:"State the entropy change of the surroundings: ΔS<sub>surroundings</sub> = ______.",answer:"&minus;&Delta;H/T",distractors:["&Delta;H/T","&minus;T/&Delta;H","&Delta;H &times; T"],a:"&Delta;S<sub>surroundings</sub> = <b>&minus;&Delta;H/T</b>, with T in kelvin."},{id:"l19-14",section:19,qtype:"Calculate",spec:["12.8"],source:"Entropy, p.8",difficulty:3,q:"Calculate ΔS<sub>total</sub> for ΔH = &minus;100 kJ mol<sup>&minus;1</sup> and ΔS<sub>system</sub> = &minus;200 J mol<sup>&minus;1</sup> K<sup>&minus;1</sup> at 298 K: about ______ J mol<sup>&minus;1</sup> K<sup>&minus;1</sup>.",answer:"+136",distractors:["&minus;536","+536","&minus;136"],a:"&Delta;S<sub>surroundings</sub> = +100000/298 = +336 J mol<sup>&minus;1</sup> K<sup>&minus;1</sup>; &Delta;S<sub>total</sub> = &minus;200 + 336 = <b>+136</b>."},{id:"l19-15",section:19,qtype:"Predict",spec:["12.9i"],source:"Entropy, p.9",difficulty:2,q:"Predict whether a reaction with ΔS<sub>total</sub> = +50 J mol<sup>&minus;1</sup> K<sup>&minus;1</sup> is feasible: it is ______.",answer:"positive",distractors:["negative","zero","maximum"],a:"Feasible means &Delta;S<sub>total</sub> &gt; 0; the reaction can occur spontaneously."},{id:"l19-16",section:19,qtype:"Explain",spec:["12.9i"],source:"Entropy, p.9",difficulty:3,q:"Explain how an endothermic reaction can be feasible at room temperature: its ΔS<sub>system</sub> is sufficiently ______.",answer:"positive",distractors:["negative","small","zero"],a:"The positive system entropy can outweigh the negative surroundings entropy, making &Delta;S<sub>total</sub> positive."},{id:"l19-17",section:19,qtype:"Explain",spec:["12.9ii"],source:"Entropy, p.9",difficulty:3,q:"Explain how increasing temperature affects ΔS<sub>surroundings</sub>: its magnitude ______.",answer:"decreases",distractors:["increases","stays constant","becomes infinite"],a:"&Delta;S<sub>surroundings</sub> = &minus;&Delta;H/T, so its magnitude <b>decreases</b> as T rises."},{id:"l19-18",section:19,qtype:"Calculate",spec:["12.9ii"],source:"Entropy, p.9",difficulty:3,q:"Calculate the minimum temperature for feasibility when ΔH = +50 kJ mol<sup>&minus;1</sup> and ΔS<sub>system</sub> = +100 J mol<sup>&minus;1</sup> K<sup>&minus;1</sup>: ______ K.",answer:"500",distractors:["50","100","298"],a:"At the boundary &Delta;S<sub>total</sub> = 0, so T = &Delta;H/&Delta;S<sub>system</sub> = 50000/100 = <b>500 K</b>."},{id:"l19-19",section:19,qtype:"Explain",spec:["12.10"],source:"Entropy, p.9",difficulty:2,q:"Explain how a reaction can occur when one entropy change is negative: it occurs as long as ΔS<sub>total</sub> is positive, even if another entropy change is ______.",answer:"negative",distractors:["positive","zero","infinite"],a:"One negative entropy term can be outweighed by a larger positive term; only &Delta;S<sub>total</sub> decides feasibility."},{id:"l19-20",section:19,qtype:"Define",spec:["12.11"],source:"Entropy, p.9",difficulty:2,q:"Define kinetic stability: a thermodynamically feasible reaction with a very high activation energy is ______ stable.",answer:"kinetically",distractors:["thermodynamically","chemically","permanently"],a:"High E<sub>a</sub> makes the reaction slow, so it is <b>kinetically</b> stable even if thermodynamically unstable."},{id:"l19-21",section:19,qtype:"Distinguish",spec:["12.11"],source:"Entropy, p.9",difficulty:2,q:"Distinguish thermodynamic and kinetic stability: thermodynamic stability depends on ______, while kinetic stability depends on activation energy.",answer:"&Delta;S<sub>total</sub>",distractors:["rate","pH","concentration"],a:"Thermodynamic stability is about feasibility (&Delta;S<sub>total</sub>); kinetic stability is about the rate/E<sub>a</sub>."},{id:"l20-01",section:20,qtype:"Define",spec:["12.12i"],source:"Lattice Energy I, p.1",difficulty:1,q:"Define standard enthalpy change of atomisation: the enthalpy change when 1 mol of gaseous atoms is formed from the element in its ______ state.",answer:"standard",distractors:["gaseous","liquid","aqueous"],a:"&Delta;<sub>at</sub>H starts from the element in its <b>standard</b> state under standard conditions."},{id:"l20-02",section:20,qtype:"Write",spec:["12.12i"],source:"Lattice Energy I, p.1",difficulty:2,q:"Write the equation for the atomisation enthalpy of bromine: ______.",answer:"&frac12;Br<sub>2</sub>(l) &rarr; Br(g)",distractors:["&frac12;Br<sub>2</sub>(g) &rarr; Br(g)","Br<sub>2</sub>(l) &rarr; 2Br(g)","Br(g) &rarr; Br(l)"],a:"Atomisation forms 1 mol of gaseous atoms: <b>&frac12;Br<sub>2</sub>(l) &rarr; Br(g)</b>."},{id:"l20-03",section:20,qtype:"Define",spec:["12.12ii"],source:"Lattice Energy I, p.1",difficulty:1,q:"Define first electron affinity: the energy ______ when 1 mol of gaseous atoms each gain an electron.",answer:"released",distractors:["absorbed","transferred","stored"],a:"First electron affinity is usually <b>exothermic</b>, so energy is released and the value is negative."},{id:"l20-04",section:20,qtype:"Define",spec:["12.12ii"],source:"Lattice Energy I, p.3",difficulty:2,q:"Define second electron affinity: the energy ______ to add an electron to 1 mol of gaseous 1&minus; ions.",answer:"required",distractors:["released","transferred","lost"],a:"Adding an electron to an already negative ion requires energy, so the second electron affinity is <b>positive</b>."},{id:"l20-05",section:20,qtype:"Define",spec:["12.12iii"],source:"Lattice Energy I, p.3",difficulty:1,q:"Define lattice energy: the enthalpy change when 1 mol of an ionic solid is formed from its ______ ions.",answer:"gaseous",distractors:["aqueous","solid","molten"],a:"Lattice energy: gaseous ions &rarr; 1 mol of solid ionic compound; it is exothermic."},{id:"l20-06",section:20,qtype:"Describe",spec:["12.13"],source:"Lattice Energy I, p.4",difficulty:2,q:"Describe the start and end of the Born&ndash;Haber cycle for NaCl: it starts with Na(s) + &frac12;Cl<sub>2</sub>(g) and ends with ______.",answer:"NaCl(s)",distractors:["Na<sup>+</sup>(g) + Cl<sup>&minus;</sup>(g)","Na(g) + Cl(g)","Na<sup>+</sup>(aq) + Cl<sup>&minus;</sup>(aq)"],a:"The cycle starts with elements in standard states and ends with 1 mol of <b>NaCl(s)</b>."},{id:"l20-07",section:20,qtype:"Calculate",spec:["12.13"],source:"Lattice Energy I, p.6",difficulty:3,q:"Calculate Δ<sub>latt</sub>H for NaCl using Δ<sub>f</sub>H = &minus;411, Δ<sub>at</sub>H(Na) = +107, IE(Na) = +496, Δ<sub>at</sub>H(Cl) = +122 and EA(Cl) = &minus;349: ______ kJ mol<sup>&minus;1</sup>.",answer:"&minus;787",distractors:["&minus;411","&minus;565","&minus;1009"],a:"&minus;411 = 107 + 496 + 122 &minus; 349 + &Delta;<sub>latt</sub>H, so &Delta;<sub>latt</sub>H = <b>&minus;787</b>."},{id:"l20-08",section:20,qtype:"State",spec:["12.13"],source:"Lattice Energy I, p.7",difficulty:3,q:"State how many chlorine electron affinity terms are needed in the Born&ndash;Haber cycle for MgCl<sub>2</sub>: ______.",answer:"two",distractors:["one","three","zero"],a:"There are 2 mol of Cl atoms, so include <b>two</b> electron affinity terms."},{id:"l20-09",section:20,qtype:"Explain",spec:["12.14"],source:"Lattice Energy I, p.8",difficulty:2,q:"Explain what a comparison of experimental and theoretical lattice energies indicates: the degree of ______ bonding.",answer:"covalent",distractors:["ionic","metallic","hydrogen"],a:"The difference between the experimental and theoretical values shows how much <b>covalent</b> character the ionic bond has."},{id:"l20-10",section:20,qtype:"State",spec:["12.14"],source:"Lattice Energy I, p.8",difficulty:2,q:"State the model used to calculate theoretical lattice energy: a perfect ______ model.",answer:"ionic",distractors:["covalent","metallic","gaseous"],a:"Electrostatic theory assumes a perfect <b>ionic</b> model with point charges and no covalent interaction."},{id:"l20-11",section:20,qtype:"Explain",spec:["12.15"],source:"Lattice Energy I, p.8",difficulty:2,q:"Explain the effect of polarisation of an anion by a cation: it leads to some ______ character in the ionic bond.",answer:"covalent",distractors:["ionic","metallic","hydrogen"],a:"The cation distorts the anion electron cloud, giving some <b>covalent</b> character."},{id:"l20-12",section:20,qtype:"State",spec:["12.15"],source:"Lattice Energy I, p.8",difficulty:2,q:"State the conditions for maximum polarisation: a small, highly charged cation and a ______ anion.",answer:"large",distractors:["small","neutral","gaseous"],a:"A small, highly charged cation and a <b>large</b> anion give the most polarisation and covalency."},{id:"l20-13",section:20,qtype:"State",spec:["12.18"],source:"Lattice Energy I, p.8",difficulty:2,q:"State the effect of increasing ionic charge on lattice energy: the lattice energy becomes more ______.",answer:"increases; decreases",distractors:["decreases; decreases","increases; increases","decreases; increases"],a:"Higher charge and smaller radius give stronger electrostatic attraction, so lattice energy is more exothermic."},{id:"l20-14",section:20,qtype:"Explain",spec:["12.18"],source:"Lattice Energy I, p.8",difficulty:2,q:"Explain why MgO has a more exothermic lattice energy than NaCl: its ions have ______ charges.",answer:"higher",distractors:["lower","equal","opposite"],a:"Mg<sup>2+</sup> and O<sup>2&minus;</sup> have <b>higher</b> charges than Na<sup>+</sup> and Cl<sup>&minus;</sup>, so the attraction is stronger."},{id:"l20-15",section:20,qtype:"Calculate",spec:["12.13"],source:"Lattice Energy I, p.7",difficulty:3,q:"Calculate the second electron affinity of S for Na<sub>2</sub>S using Δ<sub>f</sub>H = &minus;364.8, Δ<sub>at</sub>H(Na) = +108, IE(Na) = +496, Δ<sub>at</sub>H(S) = +278.8, 1st EA(S) = &minus;200.4 and Δ<sub>latt</sub>H = &minus;2198: ______ kJ mol<sup>&minus;1</sup>.",answer:"+546.8",distractors:["&minus;546.8","+364.8","&minus;200.4"],a:"&minus;364.8 = 2(108) + 2(496) + 278.8 &minus; 200.4 + EA2 &minus; 2198; solving gives EA2 = <b>+546.8</b>."},{id:"l21-01",section:21,qtype:"Define",spec:["12.16"],source:"Lattice Energy II, p.1",difficulty:1,q:"Define enthalpy change of solution: the enthalpy change when 1 mol of an ionic compound dissolves in water at ______ dilution.",answer:"infinite",distractors:["zero","minimum","maximum"],a:"At <b>infinite dilution</b>, adding more water causes no further heat change."},{id:"l21-02",section:21,qtype:"Predict",spec:["12.16"],source:"Lattice Energy II, p.1",difficulty:1,q:"Predict whether NaCl dissolves exothermically or endothermically: NaCl dissolves ______.",answer:"endothermically",distractors:["exothermically","without heat change","spontaneously only"],a:"NaCl has &Delta;<sub>sol</sub>H = +3.9 kJ mol<sup>&minus;1</sup>, so it dissolves <b>endothermically</b>."},{id:"l21-03",section:21,qtype:"Define",spec:["12.16"],source:"Lattice Energy II, p.1",difficulty:1,q:"Define enthalpy change of hydration: the enthalpy change when 1 mol of gaseous ions is completely dissolved in water at ______ dilution.",answer:"infinite",distractors:["zero","standard","minimum"],a:"Hydration enthalpy is measured at <b>infinite dilution</b> and is always negative."},{id:"l21-04",section:21,qtype:"Explain",spec:["12.16"],source:"Lattice Energy II, p.1",difficulty:2,q:"Explain why hydration enthalpies are always negative: ion&ndash;dipole attractions are ______.",answer:"negative",distractors:["positive","zero","variable"],a:"Energy is released when water molecules bond to ions, so hydration enthalpy is <b>negative</b>."},{id:"l21-05",section:21,qtype:"State",spec:["12.16"],source:"Lattice Energy II, p.1",difficulty:2,q:"State which end of a water molecule a positive ion is attracted to: the ______ oxygen atom.",answer:"&delta;&minus;",distractors:["&delta;+","neutral","positively charged"],a:"The positive ion attracts the <b>&delta;&minus;</b> oxygen end of the water dipole."},{id:"l21-06",section:21,qtype:"State",spec:["12.16"],source:"Lattice Energy II, p.1",difficulty:2,q:"State which end of a water molecule a negative ion is attracted to: the ______ hydrogen atoms.",answer:"&delta;+",distractors:["&delta;&minus;","neutral","negatively charged"],a:"The negative ion attracts the <b>&delta;+</b> hydrogen ends of water molecules."},{id:"l21-07",section:21,qtype:"State",spec:["12.17"],source:"Lattice Energy II, p.2",difficulty:2,q:"State the equation for enthalpy of solution: Δ<sub>sol</sub>H = ______.",answer:"&minus;&Delta;<sub>latt</sub>H + &Sigma;&Delta;<sub>hyd</sub>H",distractors:["&Delta;<sub>latt</sub>H + &Sigma;&Delta;<sub>hyd</sub>H","&Delta;<sub>latt</sub>H &minus; &Sigma;&Delta;<sub>hyd</sub>H","&Sigma;&Delta;<sub>hyd</sub>H &minus; &Delta;<sub>latt</sub>H"],a:"&Delta;<sub>sol</sub>H = <b>&minus;&Delta;<sub>latt</sub>H + &Sigma;&Delta;<sub>hyd</sub>H</b>, because breaking the lattice uses energy and hydration releases it."},{id:"l21-08",section:21,qtype:"Calculate",spec:["12.17"],source:"Lattice Energy II, p.2",difficulty:3,q:"Calculate Δ<sub>sol</sub>H for CaCl<sub>2</sub> using Δ<sub>latt</sub>H = &minus;2258, Δ<sub>hyd</sub>H(Ca<sup>2+</sup>) = &minus;1650 and Δ<sub>hyd</sub>H(Cl<sup>&minus;</sup>) = &minus;364: ______ kJ mol<sup>&minus;1</sup>.",answer:"&minus;120",distractors:["+120","&minus;240","+244"],a:"&Delta;<sub>sol</sub>H = +2258 &minus; 1650 + 2(&minus;364) = <b>&minus;120 kJ mol<sup>&minus;1</sup></b>."},{id:"l21-09",section:21,qtype:"Calculate",spec:["12.17"],source:"Lattice Energy II, p.3",difficulty:3,q:"Calculate Δ<sub>sol</sub>H for KCl using Δ<sub>latt</sub>H = &minus;711, Δ<sub>hyd</sub>H(K<sup>+</sup>) = &minus;320 and Δ<sub>hyd</sub>H(Cl<sup>&minus;</sup>) = &minus;378: ______ kJ mol<sup>&minus;1</sup>.",answer:"+13",distractors:["&minus;13","+711","&minus;698"],a:"&Delta;<sub>sol</sub>H = +711 &minus; 320 &minus; 378 = <b>+13 kJ mol<sup>&minus;1</sup></b>."},{id:"l21-10",section:21,qtype:"State",spec:["12.18"],source:"Lattice Energy II, p.2",difficulty:2,q:"State the effect of increasing ionic radius on hydration enthalpy: the hydration enthalpy becomes less ______.",answer:"increases; decreases",distractors:["decreases; decreases","increases; increases","decreases; increases"],a:"Higher charge and smaller radius give stronger ion&ndash;dipole attractions, so hydration is more exothermic."},{id:"l21-11",section:21,qtype:"Explain",spec:["12.18"],source:"Lattice Energy II, p.2",difficulty:2,q:"Explain why Group 2 ions have more exothermic hydration enthalpies than Group 1 ions: they have ______ charge.",answer:"higher",distractors:["lower","equal","opposite"],a:"Mg<sup>2+</sup> has a <b>higher</b> charge than Na<sup>+</sup>, so it attracts water more strongly."},{id:"l21-12",section:21,qtype:"Explain",spec:["12.19"],source:"Lattice Energy II, p.5",difficulty:2,q:"Explain why the sign of the enthalpy of solution alone is not enough to predict solubility: it is ______ enough.",answer:"not",distractors:["always","usually","more than"],a:"Some endothermic salts dissolve readily and some exothermic salts are sparingly soluble, so enthalpy alone is insufficient."},{id:"l21-13",section:21,qtype:"Explain",spec:["12.19"],source:"Lattice Energy II, p.6",difficulty:2,q:"Explain why the entropy of the system usually increases when an ionic solid dissolves: the ordered lattice becomes ______.",answer:"disordered",distractors:["more ordered","smaller","neutral"],a:"Breaking up the lattice increases disorder, giving a positive &Delta;S<sub>system</sub>."},{id:"l21-14",section:21,qtype:"Explain",spec:["12.19"],source:"Lattice Energy II, p.7",difficulty:2,q:"Explain how water ordering around small, highly charged ions affects the entropy of the system: the entropy ______.",answer:"decrease",distractors:["increase","stay constant","become zero"],a:"Ordering water around ions reduces disorder, so this effect makes &Delta;S<sub>system</sub> <b>less positive or negative</b>."},{id:"l21-15",section:21,qtype:"State",spec:["12.19"],source:"Lattice Energy II, p.7",difficulty:2,q:"State the solubility trend for Group 2 sulfates and carbonates: they become ______ soluble down the group.",answer:"less",distractors:["more","equally","completely"],a:"Group 2 sulfates and carbonates become <b>less</b> soluble down the group; hydroxides become more soluble."},{id:"l21-16",section:21,qtype:"Calculate",spec:["12.19"],source:"Lattice Energy II, p.8",difficulty:3,q:"Calculate ΔS<sub>total</sub> for AgF using Δ<sub>sol</sub>H = &minus;39 kJ mol<sup>&minus;1</sup> and ΔS<sub>system</sub> = &minus;20 J mol<sup>&minus;1</sup> K<sup>&minus;1</sup> at 298 K: about ______ J mol<sup>&minus;1</sup> K<sup>&minus;1</sup>.",answer:"+111",distractors:["&minus;111","+20","&minus;39"],a:"&Delta;S<sub>surroundings</sub> = +39000/298 = +131; &Delta;S<sub>total</sub> = &minus;20 + 131 = <b>+111</b>, so AgF is soluble."},{id:"l2-15",section:2,spec:["11.1ii"],source:"Kinetics 2, p.1",difficulty:2,qtype:"Define",q:"Define what m and n represent in rate = k[A]<sup>m</sup>[B]<sup>n</sup>: the ______ with respect to A and B.",answer:"orders",distractors:["concentrations","stoichiometric coefficients","rate constants"],a:"m and n are the <b>orders</b> with respect to A and B; the overall order is m + n."},{id:"l2-16",section:2,spec:["11.1iv"],source:"Kinetics 2, p.1",difficulty:2,qtype:"Calculate",q:"Calculate the overall order for rate = k[A]<sup>2</sup>[B]: ______.",answer:"3",distractors:["2","1","0"],a:"Overall order = 2 + 1 = <b>3</b>."},{id:"l4-20",section:4,spec:["11.6i"],source:"Kinetics 5, p.21",difficulty:3,qtype:"Deduce",q:"Deduce the rate equation for the acid-catalysed iodination of propanone: rate = ______.",answer:"k[propanone][H<sup>+</sup>]",distractors:["k[propanone][I<sub>2</sub>]","k[H<sup>+</sup>][I<sub>2</sub>]","k[propanone]"],a:"The reaction is first order in propanone and H<sup>+</sup>, and zero order in iodine: rate = <b>k[propanone][H<sup>+</sup>]</b>."},{id:"l4-21",section:4,spec:["11.6iii"],source:"Kinetics 5, p.21",difficulty:3,qtype:"Deduce",q:"Deduce the mechanism step that follows enol formation in the iodination of propanone: the enol reacts rapidly with ______.",answer:"iodine",distractors:["water","H<sup>+</sup>","propanone"],a:"The enol is formed slowly; it then reacts rapidly with <b>iodine</b>, so iodine is zero order."},{id:"l7-15",section:7,spec:["11.4ii"],source:"Kinetics 1, p.1",difficulty:2,qtype:"Describe",q:"Describe the graph produced by continuous monitoring: plot ______ against time.",answer:"concentration or volume",distractors:["rate","temperature","pH"],a:"Continuous monitoring produces a <b>concentration–time</b> or <b>volume–time</b> graph."},{id:"l7-16",section:7,spec:["11.12"],source:"Kinetics 5, p.22",difficulty:2,qtype:"Describe",q:"Describe the iodine clock method: measure the time for the first blue colour when the ______ is used up.",answer:"thiosulfate",distractors:["starch","iodine","water"],a:"Thiosulfate removes iodine until it is used up; then starch turns blue and the time is recorded."},{id:"l9-13",section:9,spec:["11.13"],source:"Kinetics 5, p.22",difficulty:3,qtype:"Calculate",q:"Calculate Ea from a graph of ln k a
